<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LearnGuard AI — Academic Early Warning &amp; Personalized Learning Intelligence Platform</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --paper:#F2F5F3;
    --paper-raised:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6670;
    --line:#DCE2DE;
    --line-strong:#B9C3BE;
    --pine:#2D5F4C;
    --pine-soft:#E4EEE8;
    --amber:#B4822C;
    --amber-soft:#F5ECD9;
    --rust:#B3541E;
    --rust-soft:#F5E4D8;
    --steel:#4A6FA5;
    --steel-soft:#E7EDF5;
    --plum:#6B4C7A;
    --plum-soft:#EDE5F0;
    --radius-s:4px;
    --radius-m:8px;
    --radius-l:14px;
  }

  [data-theme="dark"]{
    --paper:#161B18;
    --paper-raised:#1F2622;
    --ink:#EDF1EE;
    --ink-soft:#9BA8A0;
    --line:#2C352F;
    --line-strong:#3C463F;
    --pine:#5FA786;
    --pine-soft:#20362C;
    --amber:#D8A64C;
    --amber-soft:#3A2F17;
    --rust:#D9744A;
    --rust-soft:#3A2418;
    --steel:#7FA3D6;
    --steel-soft:#1E2A3A;
    --plum:#B48FC7;
    --plum-soft:#2C233A;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  :focus-visible{ outline:2px solid var(--steel); outline-offset:2px; border-radius:4px; }
  .btn:hover, .icon-btn:hover, .sidenav button:hover:not(.active){ transition:border-color .15s ease, color .15s ease; }
  h1,h2,h3,.serif{ font-family:'Newsreader', serif; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  input,textarea{ font-family:inherit; }
  ::selection{ background:var(--pine-soft); }

  .shell{ max-width:1320px; margin:0 auto; padding:24px 28px 70px; }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:18px; margin-bottom:20px; border-bottom:1px solid var(--line-strong);
    gap:20px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .brand .mark svg{ flex:none; }
  .brand-text h1{ font-size:20px; font-weight:600; margin:0; letter-spacing:-0.01em; line-height:1.15; }
  .brand-text .sub{ font-size:11.5px; color:var(--ink-soft); }

  .topbar-right{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

  .demo-badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:600;
    padding:5px 11px; border-radius:999px; background:var(--amber-soft); color:var(--amber);
    border:1px solid #E9D9B4;
  }
  .demo-badge .dot{ width:6px; height:6px; border-radius:50%; background:var(--amber); }

  .role-toggle{ display:flex; align-items:center; gap:8px; }
  .switch{
    position:relative; display:flex; background:var(--paper-raised); border:1px solid var(--line-strong);
    border-radius:999px; padding:3px; gap:2px;
  }
  .switch button{
    position:relative; z-index:1; border:none; background:transparent; padding:7px 15px;
    font-size:12.5px; font-weight:600; color:var(--ink-soft); border-radius:999px; transition:color .2s ease;
    white-space:nowrap;
  }
  .switch button.active{ color:#fff; }
  .switch .thumb{
    position:absolute; top:3px; bottom:3px; left:3px; z-index:0;
    background:linear-gradient(155deg, rgba(255,255,255,.32), rgba(255,255,255,0) 55%), linear-gradient(160deg, var(--pine), #234B3C);
    border-radius:999px; border:1px solid rgba(255,255,255,.35);
    box-shadow:0 4px 14px -4px rgba(45,95,76,0.55), inset 0 1px 0 rgba(255,255,255,.25);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    transition:left .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
  }

  .icon-btn{
    position:relative; width:34px; height:34px; border-radius:50%; border:1px solid var(--line-strong);
    background:var(--paper-raised); display:flex; align-items:center; justify-content:center; flex:none;
  }
  .icon-btn .badge{
    position:absolute; top:-4px; right:-4px; background:var(--rust); color:#fff; font-size:9.5px; font-weight:700;
    min-width:15px; height:15px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  .student-switch{
    position:relative;
  }
  .student-switch select{
    appearance:none; border:1px solid var(--line-strong); background:var(--paper-raised); color:var(--ink);
    font-size:12.5px; font-weight:600; padding:7px 28px 7px 13px; border-radius:999px;
  }
  .student-switch::after{
    content:'▾'; position:absolute; right:11px; top:50%; transform:translateY(-50%); font-size:10px; color:var(--ink-soft); pointer-events:none;
  }

  .notif-drop{
    position:absolute; top:44px; right:0; width:320px; background:var(--paper-raised); border:1px solid var(--line-strong);
    border-radius:var(--radius-m); box-shadow:0 14px 34px rgba(20,26,22,0.16); z-index:60; overflow:hidden;
  }
  .notif-drop .nd-head{ padding:12px 16px; border-bottom:1px solid var(--line); font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .notif-drop .nd-head button{ border:none; background:none; font-size:11px; color:var(--pine); font-weight:600; }
  .notif-drop .nd-list{ max-height:340px; overflow-y:auto; }
  .notif-item{ padding:11px 16px; border-bottom:1px solid var(--line); font-size:12.5px; line-height:1.5; cursor:pointer; }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item.unread{ background:var(--pine-soft); }
  .notif-item .k{ font-weight:600; display:block; margin-bottom:2px; font-size:11px; color:var(--ink-soft); }

  /* ---------- app layout: sidebar + content ---------- */
  .layout{ display:grid; grid-template-columns:200px 1fr; gap:26px; align-items:start; }
  @media (max-width:880px){ .layout{ grid-template-columns:1fr; } }

  .sidenav{ display:flex; flex-direction:column; gap:3px; position:sticky; top:20px; }
  @media (max-width:880px){ .sidenav{ position:static; flex-direction:row; flex-wrap:wrap; gap:6px; } }
  .sidenav button{
    text-align:left; border:none; background:transparent; padding:9px 12px; border-radius:var(--radius-s);
    font-size:13px; font-weight:500; color:var(--ink-soft);
  }
  .sidenav button.active{ background:var(--paper-raised); color:var(--ink); font-weight:600; border:1px solid var(--line); }
  .sidenav button:hover:not(.active){ color:var(--ink); }

  .content{ min-width:0; }

  /* ---------- generic layout bits ---------- */
  .grid-2{ display:grid; grid-template-columns:1.35fr 1fr; gap:22px; align-items:start; }
  @media (max-width:880px){ .grid-2{ grid-template-columns:1fr; } }
  .grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:900px){ .grid-3{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:600px){ .grid-3{ grid-template-columns:1fr; } }
  .grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  @media (max-width:780px){ .grid-4{ grid-template-columns:repeat(2,1fr); } }

  .panel{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:22px 24px;
  }
  .panel + .panel{ margin-top:18px; }
  .panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .panel-head h2{ font-size:17px; font-weight:600; margin:0; }
  .panel-head .sub{ font-size:12.5px; color:var(--ink-soft); }

  .section-title{ margin-bottom:18px; }
  .section-title h1{ font-size:24px; font-weight:600; margin:0 0 4px; }
  .section-title p{ margin:0; font-size:13.5px; color:var(--ink-soft); max-width:64ch; line-height:1.55; }

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:999px; line-height:1.5; white-space:nowrap;
  }
  .pill.pine{ background:var(--pine-soft); color:var(--pine); }
  .pill.amber{ background:var(--amber-soft); color:var(--amber); }
  .pill.rust{ background:var(--rust-soft); color:var(--rust); }
  .pill.steel{ background:var(--steel-soft); color:var(--steel); }
  .pill.plum{ background:var(--plum-soft); color:var(--plum); }
  .pill.neutral{ background:var(--paper); color:var(--ink-soft); border:1px solid var(--line-strong); }

  .label-tag{ font-size:10.5px; font-weight:600; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line-strong); padding:2px 7px; border-radius:5px; }

  /* ---------- buttons ---------- */
  .btn{
    border:1px solid var(--line-strong); background:var(--paper-raised); padding:8px 15px; border-radius:999px; font-size:12.5px;
    font-weight:600; color:var(--ink); white-space:nowrap;
  }
  .btn:hover{ border-color:var(--ink); }
  .btn.primary{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .btn.pine{ background:var(--pine); color:#fff; border-color:var(--pine); }
  .btn.ghost{ background:transparent; }
  .btn.small{ padding:6px 12px; font-size:11.5px; }
  .btn.done{ background:var(--pine-soft); color:var(--pine); border-color:var(--pine-soft); }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- landing / home ---------- */
  .hero{ padding:38px 6px 30px; border-bottom:1px solid var(--line-strong); margin-bottom:30px; }
  .hero .tagline-pill{ display:inline-flex; margin-bottom:16px; }
  .hero h1{ font-size:42px; line-height:1.08; margin:0 0 14px; font-weight:600; max-width:16ch; letter-spacing:-0.01em; }
  .hero .quote{ font-family:'Newsreader', serif; font-style:italic; font-size:19px; color:var(--pine); margin:0 0 20px; max-width:44ch; }
  .hero p.lead{ font-size:15px; color:var(--ink-soft); max-width:62ch; line-height:1.65; margin:0 0 24px; }
  .hero-cta{ display:flex; gap:10px; flex-wrap:wrap; }

  .feature-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:26px 0 34px; }
  @media (max-width:900px){ .feature-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){ .feature-grid{ grid-template-columns:1fr; } }
  .feature-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:20px; }
  .feature-card .fi{ font-size:22px; margin-bottom:10px; display:block; }
  .feature-card h3{ font-size:14.5px; margin:0 0 6px; font-weight:600; }
  .feature-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.55; }

  .home-explain{ display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-bottom:10px; }
  @media (max-width:880px){ .home-explain{ grid-template-columns:1fr; } }

  /* ---------- public nav (Home / Login only) ---------- */
  .pubnav{ display:flex; align-items:center; justify-content:space-between; padding:18px 6px; border-bottom:1px solid var(--line-strong); margin-bottom:0; gap:18px; flex-wrap:wrap; }
  .pubnav-links{ display:flex; gap:28px; align-items:center; }
  .pubnav-links a{ font-size:13px; font-weight:500; color:var(--ink-soft); cursor:pointer; text-decoration:none; }
  .pubnav-links a:hover{ color:var(--ink); }
  .pubnav-actions{ display:flex; gap:10px; align-items:center; }
  @media (max-width:860px){ .pubnav-links{ display:none; } }

  /* ---------- hero v2 ---------- */
  .hero-v2{ display:grid; grid-template-columns:1.1fr 1fr; gap:50px; align-items:center; padding:54px 6px 50px; border-bottom:1px solid var(--line-strong); margin-bottom:54px; }
  @media (max-width:900px){ .hero-v2{ grid-template-columns:1fr; padding:36px 6px 34px; gap:32px; margin-bottom:40px; } }
  .badge-pill{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:5px 12px; border-radius:999px; background:var(--pine-soft); color:var(--pine); border:1px solid var(--line); margin-bottom:18px; }
  .hero-v2 h1{ font-size:44px; line-height:1.12; margin:0 0 18px; font-weight:600; letter-spacing:-0.01em; max-width:15ch; }
  @media (max-width:560px){ .hero-v2 h1{ font-size:31px; } }
  .hero-v2 p.lead{ font-size:15.5px; color:var(--ink-soft); line-height:1.7; max-width:52ch; margin:0 0 28px; }

  .hero-visual{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:8px 26px; box-shadow:0 16px 36px -22px rgba(27,36,48,0.28); }
  .hero-visual .hv-row{ display:flex; align-items:center; justify-content:space-between; padding:16px 0; border-bottom:1px solid var(--line); }
  .hero-visual .hv-row:last-child{ border-bottom:none; }
  .hero-visual .hv-label{ font-size:12.5px; color:var(--ink-soft); font-weight:500; }
  .hero-visual .hv-value{ font-size:15.5px; font-weight:600; font-family:'Newsreader', serif; }
  .hero-visual .hv-value.pine{ color:var(--pine); }
  .hero-visual .hv-value.amber{ color:var(--amber); }

  /* ---------- public section blocks ---------- */
  .section-block{ padding:50px 6px; border-bottom:1px solid var(--line-strong); }
  .section-block:last-of-type{ border-bottom:none; }
  .section-heading{ text-align:center; max-width:56ch; margin:0 auto 34px; }
  .section-heading h2{ font-size:28px; font-weight:600; margin:0; letter-spacing:-0.01em; }
  @media (max-width:560px){ .section-heading h2{ font-size:23px; } }

  /* ---------- how it works ---------- */
  .steps-flow{ display:flex; align-items:stretch; gap:14px; }
  @media (max-width:860px){ .steps-flow{ flex-direction:column; } }
  .step-card{ flex:1; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px 20px; }
  .step-card .step-num{ font-family:'Newsreader', serif; font-size:22px; color:var(--pine); font-weight:600; margin-bottom:10px; display:block; }
  .step-card h3{ font-size:15px; margin:0 0 8px; font-weight:600; }
  .step-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.55; }
  .step-arrow{ display:flex; align-items:center; justify-content:center; color:var(--line-strong); font-size:18px; flex:none; width:18px; }
  @media (max-width:860px){ .step-arrow{ display:none; } }

  /* ---------- user types ---------- */
  .usertype-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  @media (max-width:860px){ .usertype-grid{ grid-template-columns:1fr; } }
  .usertype-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:26px 22px; transition:border-color .15s ease, transform .15s ease; }
  .usertype-card:hover{ border-color:var(--pine); transform:translateY(-2px); }
  .usertype-card .ut-icon{ width:40px; height:40px; border-radius:10px; background:var(--pine-soft); display:flex; align-items:center; justify-content:center; font-size:18px; margin-bottom:16px; }
  .usertype-card .ut-kicker{ font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--pine); text-transform:uppercase; margin-bottom:10px; }
  .usertype-card p{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:0 0 16px; }
  .usertype-card .ut-link{ font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer; }
  .usertype-card .ut-link:hover{ color:var(--pine); }

  /* ---------- trust / responsible AI ---------- */
  .trust-block{ display:grid; grid-template-columns:1fr 1fr; gap:44px; align-items:center; }
  @media (max-width:860px){ .trust-block{ grid-template-columns:1fr; gap:26px; } }
  .trust-block h2{ font-size:27px; font-weight:600; margin:0 0 14px; letter-spacing:-0.01em; }
  .trust-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
  .trust-list li{ display:flex; align-items:flex-start; gap:10px; font-size:13.5px; color:var(--ink); background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 14px; }
  .trust-list li:before{ content:"✓"; color:var(--pine); font-weight:700; }

  /* ---------- final CTA ---------- */
  .final-cta{ text-align:center; padding:56px 20px; background:var(--pine-soft); border-radius:var(--radius-l); margin:50px 6px 30px; }
  .final-cta h2{ font-size:27px; margin:0 0 12px; font-weight:600; letter-spacing:-0.01em; }
  @media (max-width:560px){ .final-cta h2{ font-size:22px; } }
  .final-cta p{ font-size:14.5px; color:var(--ink-soft); max-width:52ch; margin:0 auto 26px; line-height:1.6; }

  /* ---------- login page ---------- */
  .shell-login{ max-width:none; padding:0; margin:0; }
  .login-page{ min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
  @media (max-width:860px){ .login-page{ grid-template-columns:1fr; } }
  .login-left{ background:var(--pine); color:#fff; padding:60px; display:flex; flex-direction:column; justify-content:center; }
  @media (max-width:860px){ .login-left{ padding:44px 28px; } }
  .login-left .brand-row{ display:flex; align-items:center; gap:12px; margin-bottom:44px; }
  .login-left .brand-row h1{ font-size:19px; margin:0; font-weight:600; color:#fff; }
  .login-left h2{ font-size:30px; line-height:1.25; margin:0 0 16px; font-weight:600; max-width:14ch; color:#fff; letter-spacing:-0.01em; }
  .login-left p{ font-size:14px; line-height:1.65; color:rgba(255,255,255,.85); max-width:34ch; margin:0; }
  .login-right{ display:flex; align-items:center; justify-content:center; padding:40px 24px; background:var(--paper); }
  .login-card{ width:100%; max-width:380px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:34px 30px; box-shadow:0 16px 36px -24px rgba(27,36,48,0.25); }
  .login-card h2{ font-size:22px; margin:0 0 6px; font-weight:600; }
  .login-card .sub{ font-size:13px; color:var(--ink-soft); margin:0 0 22px; }
  .login-field{ margin-bottom:16px; }
  .login-field label{ display:block; font-size:12px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .login-field input{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px; font-size:13.5px; background:var(--paper); color:var(--ink); }
  .login-field input:focus{ outline:2px solid var(--pine); outline-offset:1px; border-color:var(--pine); }
  .role-select-row{ display:flex; gap:8px; margin-bottom:20px; }
  .role-select-btn{ flex:1; text-align:center; padding:9px 6px; border:1px solid var(--line-strong); border-radius:8px; font-size:12px; font-weight:600; color:var(--ink-soft); background:var(--paper); cursor:pointer; transition:border-color .15s ease, color .15s ease, background .15s ease; }
  .role-select-btn.active{ border-color:var(--pine); background:var(--pine-soft); color:var(--pine); }
  .login-row-between{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; font-size:12.5px; gap:10px; flex-wrap:wrap; }
  .login-remember{ display:flex; align-items:center; gap:6px; color:var(--ink-soft); cursor:pointer; }
  .login-forgot{ color:var(--pine); font-weight:600; cursor:pointer; }
  .login-signin-btn{ width:100%; padding:11px; border-radius:999px; text-align:center; }
  .login-footer-text{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin:18px 0 0; }
  .login-footer-text a{ color:var(--pine); font-weight:600; cursor:pointer; }
  .demo-hint{ margin-top:16px; padding:9px 12px; border-radius:8px; background:var(--amber-soft); border:1px solid var(--line); font-size:11.5px; color:var(--amber); text-align:center; }

  /* ---------- readiness ---------- */
  .readiness-row{ display:flex; gap:22px; align-items:center; margin-bottom:24px; flex-wrap:wrap; }
  .readiness-dial{ position:relative; width:104px; height:104px; flex:none; }
  .readiness-dial svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .readiness-dial .num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .readiness-dial .num b{ font-family:'Newsreader', serif; font-size:26px; line-height:1; }
  .readiness-dial .num span{ font-size:10px; color:var(--ink-soft); margin-top:2px; }
  .readiness-copy h1{ font-size:21px; margin:0 0 5px; font-weight:600; }
  .readiness-copy p{ margin:0 0 8px; font-size:13.5px; color:var(--ink-soft); max-width:56ch; line-height:1.5; }
  .status-row{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- concept graph ---------- */
  .graph-wrap{ position:relative; }
  .graph-wrap svg{ width:100%; height:auto; display:block; cursor:default; }
  .graph-wrap svg .node-hit{ cursor:pointer; }
  .node-label{ font-size:11px; fill:var(--ink); font-weight:500; }
  .node-pct{ font-size:13px; font-weight:700; fill:#fff; font-family:'IBM Plex Mono', monospace; }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; padding-top:12px; border-top:1px solid var(--line); }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex:none; }

  /* ---------- concept detail card ---------- */
  .concept-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; margin-bottom:12px; }
  .concept-card .cc-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .concept-card h3{ font-size:15px; margin:0; font-weight:600; }
  .progress-track{ flex:1; height:8px; background:var(--paper); border-radius:99px; overflow:hidden; border:1px solid var(--line); margin:8px 0 10px; }
  .progress-fill{ height:100%; border-radius:99px; }
  .cc-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:8px; }
  @media (max-width:640px){ .cc-stats{ grid-template-columns:repeat(2,1fr); } }
  .cc-stat{ font-size:11.5px; color:var(--ink-soft); }
  .cc-stat b{ display:block; font-family:'IBM Plex Mono', monospace; font-size:14px; color:var(--ink); font-weight:600; }
  .cc-meta{ font-size:12px; color:var(--ink-soft); line-height:1.6; }
  .cc-meta b{ color:var(--ink); font-weight:600; }
  .cc-insight{
    margin-top:10px; padding:11px 13px; background:var(--pine-soft); border-radius:var(--radius-s); font-size:12.5px;
    color:#1E3A2F; line-height:1.55; font-style:italic; font-family:'Newsreader', serif;
  }
  .cc-why-panel{ margin-top:10px; padding:12px 14px; border:1px dashed var(--line-strong); border-radius:var(--radius-s); font-size:12.5px; line-height:1.65; }
  .cc-why-panel dt{ font-weight:600; color:var(--ink-soft); font-size:11px; margin-top:8px; }
  .cc-why-panel dt:first-child{ margin-top:0; }
  .cc-why-panel dd{ margin:2px 0 0; }

  /* ---------- gap cards ---------- */
  .gap-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; margin-bottom:10px; border-left:3px solid var(--rust); }
  .gap-card.isolated{ border-left-color:var(--amber); }
  .gap-card .row1{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:5px; }
  .gap-card h3{ font-size:14.5px; margin:0; font-weight:600; }
  .gap-card p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .gap-card .impact{ font-size:12px; color:var(--rust); font-weight:600; }
  .gap-card.isolated .impact{ color:var(--amber); }
  .empty-note{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:6px 0; }

  /* ---------- root cause chain ---------- */
  .chain{ display:flex; flex-direction:column; align-items:flex-start; gap:0; margin:14px 0; }
  .chain-node{ display:flex; align-items:center; gap:12px; padding:10px 0; }
  .chain-node .cn-badge{ width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:13px; flex:none; }
  .chain-node .cn-name{ font-size:13.5px; font-weight:600; }
  .chain-node .cn-tag{ font-size:11px; color:var(--ink-soft); }
  .chain-arrow{ margin-left:22px; color:var(--line-strong); font-size:16px; line-height:1; }
  .severity-strip{ display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .severity-strip .sv{ font-size:12px; color:var(--ink-soft); }
  .severity-strip .sv b{ display:block; font-size:16px; color:var(--ink); font-family:'Newsreader',serif; }

  /* ---------- hidden pattern ---------- */
  .signal-note{ display:flex; gap:12px; padding:14px 16px; border:1px dashed var(--line-strong); border-radius:var(--radius-m); background:var(--paper); margin-bottom:10px; }
  .signal-note .dot{ width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none; background:var(--steel); }
  .signal-note p{ margin:0 0 4px; font-size:13px; line-height:1.55; }
  .signal-note .tag{ font-size:11px; color:var(--ink-soft); font-weight:600; }

  /* ---------- recommendations ---------- */
  .rec{ display:flex; align-items:flex-start; gap:12px; padding:13px 0; border-bottom:1px solid var(--line); }
  .rec:last-child{ border-bottom:none; }
  .rec-check{ width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line-strong); flex:none; margin-top:2px; display:flex; align-items:center; justify-content:center; transition:all .15s ease; background:var(--paper-raised); }
  .rec-check.done{ background:var(--pine); border-color:var(--pine); }
  .rec-check.done svg{ display:block; }
  .rec-check svg{ display:none; width:11px; height:11px; }
  .rec-body h4{ margin:0 0 3px; font-size:13.5px; font-weight:600; }
  .rec-body p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .rec.done .rec-body h4, .rec.done .rec-body p{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line-strong); }

  /* ---------- stat cards ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px; }
  @media (max-width:780px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }
  .stat-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; }
  .stat-card .num{ font-family:'Newsreader', serif; font-size:28px; font-weight:600; line-height:1; }
  .stat-card .lbl{ font-size:12px; color:var(--ink-soft); margin-top:6px; }

  /* ---------- bars ---------- */
  .bar-row{ display:flex; align-items:center; gap:12px; margin-bottom:11px; }
  .bar-row .name{ width:150px; flex:none; font-size:12.5px; color:var(--ink); }
  .bar-track{ flex:1; height:9px; background:var(--paper); border-radius:99px; overflow:hidden; border:1px solid var(--line); }
  .bar-fill{ height:100%; border-radius:99px; }
  .bar-row .pct{ width:38px; flex:none; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }

  /* ---------- table ---------- */
  table.roster{ width:100%; border-collapse:collapse; }
  table.roster th{ text-align:left; font-size:11px; color:var(--ink-soft); font-weight:600; padding:0 10px 10px; border-bottom:1px solid var(--line-strong); }
  table.roster td{ padding:12px 10px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:13.5px; }
  table.roster tr:last-child td{ border-bottom:none; }
  table.roster tr.rowbtn{ cursor:pointer; transition:background .12s ease; }
  table.roster tr.rowbtn:hover{ background:var(--paper); }
  .name-cell{ font-weight:600; }
  .risk-bar{ width:70px; height:7px; background:var(--paper); border-radius:99px; overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; border:1px solid var(--line); }
  .risk-fill{ height:100%; border-radius:99px; }
  .chip-row{ display:flex; gap:5px; flex-wrap:wrap; }
  .why{ color:var(--ink-soft); font-size:12.5px; max-width:32ch; }
  .view-btn{ border:1px solid var(--line-strong); background:var(--paper-raised); padding:6px 13px; border-radius:99px; font-size:12px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .view-btn:hover{ border-color:var(--ink); }

  .filter-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .filter-row input[type=text]{ border:1px solid var(--line-strong); border-radius:999px; padding:8px 14px; font-size:12.5px; background:var(--paper-raised); min-width:180px; }
  .filter-row select{ border:1px solid var(--line-strong); border-radius:999px; padding:8px 14px; font-size:12.5px; background:var(--paper-raised); }

  /* ---------- class insight ---------- */
  .insight-box{ display:flex; gap:12px; padding:16px 18px; background:var(--pine-soft); border-radius:var(--radius-m); margin-bottom:22px; align-items:flex-start; }
  .insight-box svg{ flex:none; margin-top:2px; }
  .insight-box p{ margin:0; font-size:13.5px; line-height:1.6; color:#1E3A2F; }
  .insight-box b{ font-weight:700; }

  /* ---------- drilldown overlay ---------- */
  .overlay{ position:fixed; inset:0; background:rgba(20,26,22,0.42); display:none; align-items:flex-start; justify-content:center; padding:40px 20px; overflow-y:auto; z-index:70; }
  .overlay.open{ display:flex; }
  .drawer{ background:var(--paper); border-radius:12px; max-width:960px; width:100%; padding:0; box-shadow:0 20px 60px rgba(0,0,0,0.25); animation:rise .22s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
  .drawer-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 24px; border-bottom:1px solid var(--line-strong); background:var(--paper-raised); border-radius:12px 12px 0 0; }
  .drawer-head h2{ margin:0; font-size:18px; }
  .drawer-close{ border:none; background:var(--paper); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .drawer-body{ padding:22px 24px 26px; }
  .teacher-action{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius-m); margin-bottom:9px; background:var(--paper-raised); }
  .teacher-action p{ margin:0; font-size:13px; }
  .teacher-action button{ border:1px solid var(--ink); background:var(--ink); color:#fff; padding:6px 13px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
  .teacher-action button.sent{ background:var(--pine-soft); color:var(--pine); border-color:var(--pine-soft); }

  footer.note{ margin-top:34px; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-soft); line-height:1.6; }

  /* ---------- chat / assistant ---------- */
  .chat-window{ display:flex; flex-direction:column; gap:12px; max-height:420px; overflow-y:auto; padding:6px 2px 12px; margin-bottom:14px; }
  .chat-msg{ max-width:78%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.55; }
  .chat-msg.user{ align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:3px; }
  .chat-msg.bot{ align-self:flex-start; background:var(--pine-soft); color:#1E3A2F; border-bottom-left-radius:3px; }
  .chat-quick{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .chat-quick button{ border:1px solid var(--line-strong); background:var(--paper-raised); padding:7px 12px; border-radius:999px; font-size:12px; color:var(--ink); }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; border:1px solid var(--line-strong); border-radius:999px; padding:10px 16px; font-size:13px; }
  .chat-input-row button{ border:none; background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; }

  /* ---------- quiz ---------- */
  .quiz-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }
  .quiz-meta{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--ink-soft); }
  .quiz-meta b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }
  .quiz-q{ font-size:16px; font-weight:600; margin:6px 0 16px; font-family:'Newsreader',serif; }
  .quiz-options{ display:flex; flex-direction:column; gap:9px; margin-bottom:16px; }
  .quiz-opt{ text-align:left; border:1px solid var(--line-strong); background:var(--paper-raised); padding:12px 15px; border-radius:var(--radius-m); font-size:13.5px; }
  .quiz-opt:hover{ border-color:var(--ink); }
  .quiz-opt.correct{ border-color:var(--pine); background:var(--pine-soft); }
  .quiz-opt.incorrect{ border-color:var(--rust); background:var(--rust-soft); }
  .quiz-feedback{ padding:12px 14px; border-radius:var(--radius-m); font-size:13px; margin-bottom:14px; line-height:1.55; }
  .quiz-feedback.correct{ background:var(--pine-soft); color:#1E3A2F; }
  .quiz-feedback.incorrect{ background:var(--rust-soft); color:#5C2A0F; }
  .quiz-progress-dots{ display:flex; gap:6px; margin-bottom:16px; }
  .quiz-progress-dots span{ width:22px; height:5px; border-radius:99px; background:var(--line-strong); }
  .quiz-progress-dots span.done{ background:var(--pine); }
  .quiz-progress-dots span.current{ background:var(--amber); }

  /* ---------- badges / gamification ---------- */
  .badge-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .badge-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; text-align:center; background:var(--paper-raised); }
  .badge-card .bi{ font-size:26px; display:block; margin-bottom:8px; }
  .badge-card h4{ margin:0 0 4px; font-size:12.5px; font-weight:600; }
  .badge-card p{ margin:0; font-size:11px; color:var(--ink-soft); line-height:1.4; }
  .badge-locked{ opacity:0.38; }

  /* ---------- calendar ---------- */
  .cal-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .cal-cell{ flex:1; min-width:52px; text-align:center; }
  .cal-cell .box{ width:100%; aspect-ratio:1; border-radius:6px; margin-bottom:6px; }
  .cal-cell .box.full{ background:var(--pine); }
  .cal-cell .box.partial{ background:var(--amber); }
  .cal-cell .box.none{ background:var(--rust-soft); border:1px dashed var(--rust); }
  .cal-cell .lbl{ font-size:10.5px; color:var(--ink-soft); }

  /* ---------- goal ---------- */
  .goal-row{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; margin-bottom:16px; }
  .goal-track{ flex:1; min-width:200px; height:14px; background:var(--paper); border-radius:99px; overflow:hidden; border:1px solid var(--line); position:relative; }
  .goal-fill{ height:100%; background:linear-gradient(90deg, var(--amber), var(--pine)); border-radius:99px; }
  .goal-nums{ display:flex; gap:20px; font-size:12px; color:var(--ink-soft); }
  .goal-nums b{ display:block; font-family:'Newsreader',serif; font-size:20px; color:var(--ink); }

  /* ---------- benchmark ---------- */
  .bench-row{ display:flex; align-items:center; gap:14px; margin-bottom:12px; }
  .bench-row .bl{ width:110px; flex:none; font-size:12.5px; color:var(--ink-soft); }
  .bench-track{ flex:1; height:10px; background:var(--paper); border-radius:99px; border:1px solid var(--line); position:relative; overflow:visible; }
  .bench-fill{ height:100%; border-radius:99px; }
  .bench-marker{ position:absolute; top:-4px; width:2px; height:18px; background:var(--ink); }

  /* ---------- resources ---------- */
  .resource-block{ margin-bottom:20px; }
  .resource-block h3{ font-size:14.5px; margin:0 0 4px; }
  .resource-block .why{ font-size:12px; color:var(--ink-soft); margin:0 0 10px; max-width:none; }
  .resource-tiles{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
  .resource-tile{ border:1px solid var(--line-strong); border-radius:var(--radius-m); padding:12px; text-align:center; background:var(--paper-raised); font-size:12px; font-weight:600; }
  .resource-tile:hover{ border-color:var(--ink); }

  /* ---------- risk factors ---------- */
  .risk-score-big{ display:flex; align-items:center; gap:20px; margin-bottom:20px; flex-wrap:wrap; }
  .risk-score-big .num{ font-family:'Newsreader',serif; font-size:44px; font-weight:600; }
  .factor-row{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .factor-row .fname{ width:180px; flex:none; font-size:12.5px; }
  .factor-track{ flex:1; height:10px; background:var(--paper); border-radius:99px; border:1px solid var(--line); overflow:hidden; }
  .factor-fill{ height:100%; background:var(--steel); border-radius:99px; }
  .factor-row .fpct{ width:36px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); }

  /* ---------- before/after ---------- */
  .ba-row{ display:flex; gap:22px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .ba-block{ flex:1; min-width:160px; }
  .ba-block .lbl{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
  .ba-block .val{ font-family:'Newsreader',serif; font-size:30px; font-weight:600; }
  .ba-arrow{ font-size:22px; color:var(--line-strong); }
  .ba-delta{ display:inline-flex; margin-top:6px; }

  /* ---------- flow diagrams ---------- */
  .flow-vert{ display:flex; flex-direction:column; align-items:stretch; gap:0; max-width:420px; margin:6px auto; }
  .flow-step{ border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:var(--radius-m); padding:12px 16px; text-align:center; font-size:13px; font-weight:600; }
  .flow-arrow{ text-align:center; color:var(--line-strong); font-size:18px; padding:2px 0; }
  .flow-loop{ display:flex; flex-wrap:wrap; gap:0; align-items:center; justify-content:center; }
  .flow-loop .fl-step{ border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:999px; padding:10px 16px; font-size:12.5px; font-weight:600; }
  .flow-loop .fl-arrow{ padding:0 8px; color:var(--line-strong); font-size:14px; }

  /* ---------- course cards ---------- */
  .course-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:18px; background:var(--paper-raised); }
  .course-card h3{ font-size:15px; margin:0 0 10px; }
  .course-mini-stat{ display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); padding:5px 0; border-bottom:1px solid var(--line); }
  .course-mini-stat:last-child{ border-bottom:none; }
  .course-mini-stat b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }

  /* ---------- tech cards ---------- */
  .tech-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; background:var(--paper-raised); }
  .tech-card h3{ font-size:14.5px; margin:0 0 6px; }
  .tech-card p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 10px; line-height:1.55; }

  /* ---------- comparison table (why learnguard) ---------- */
  .compare-flow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12.5px; }
  .compare-flow span.step{ background:var(--paper); border:1px solid var(--line-strong); border-radius:999px; padding:6px 12px; }
  .compare-flow .arrow{ color:var(--line-strong); }

  .toast-wrap{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:100; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .toast{ background:var(--ink); color:#fff; padding:10px 18px; border-radius:999px; font-size:12.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,0.2); animation:toastin .18s ease; }
  @keyframes toastin{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }

  .uvp-list{ counter-reset:uvp; list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:14px; }
  .uvp-list li{ display:flex; gap:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .uvp-list li:last-child{ border-bottom:none; padding-bottom:0; }
  .uvp-num{ font-family:'Newsreader',serif; font-size:20px; color:var(--line-strong); flex:none; width:30px; }
  .uvp-body h4{ margin:0 0 3px; font-size:13.5px; }
  .uvp-body p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

  .metric-empty{ font-size:12px; color:var(--ink-soft); font-style:italic; background:var(--paper); border:1px dashed var(--line-strong); padding:10px 12px; border-radius:var(--radius-s); margin-top:10px; }
  ul.metric-list{ margin:0; padding-left:18px; font-size:13px; color:var(--ink); line-height:2; }

  .rb-list{ margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .rb-list li{ display:flex; gap:10px; font-size:13px; line-height:1.55; }
  .rb-list li .rb-dot{ width:6px; height:6px; border-radius:50%; background:var(--pine); margin-top:7px; flex:none; }

  /* ================= V3: INTELLIGENCE CENTER / HEALTH SCORE ================= */
  .v3-badge{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--plum-soft); color:var(--plum); border:1px solid var(--plum); letter-spacing:.02em; }
  .health-wrap{ display:flex; gap:26px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
  .health-arc{ position:relative; width:150px; height:150px; flex:none; }
  .health-arc svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .health-arc .num{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .health-arc .num b{ font-family:'Newsreader', serif; font-size:34px; line-height:1; }
  .health-arc .num span{ font-size:10.5px; color:var(--ink-soft); margin-top:3px; }
  .health-factors{ flex:1; min-width:260px; display:flex; flex-direction:column; gap:9px; }
  .hf-row{ display:flex; align-items:center; gap:10px; }
  .hf-row .hf-name{ width:150px; flex:none; font-size:12px; color:var(--ink-soft); }
  .hf-row .hf-track{ flex:1; height:8px; background:var(--paper); border-radius:99px; border:1px solid var(--line); overflow:hidden; }
  .hf-row .hf-fill{ height:100%; border-radius:99px; }
  .hf-row .hf-val{ width:34px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); }
  .why-drawer{ margin-top:16px; padding:14px 16px; background:var(--paper); border:1px dashed var(--line-strong); border-radius:var(--radius-m); font-size:12.5px; line-height:1.7; }
  .why-drawer h4{ margin:0 0 8px; font-size:13px; }
  .why-drawer code{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; background:var(--paper-raised); padding:1px 5px; border-radius:4px; }

  /* ================= V3: RADAR ================= */
  .radar-wrap{ display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
  .radar-svg-box{ flex:none; width:290px; }
  .radar-svg-box svg{ width:100%; height:auto; }
  .radar-legend-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .radar-signals{ flex:1; min-width:260px; display:flex; flex-direction:column; gap:8px; }
  .radar-sig{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:var(--radius-s); padding:9px 12px; cursor:pointer; background:var(--paper-raised); }
  .radar-sig:hover{ border-color:var(--ink); }
  .radar-sig .rs-dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .radar-sig .rs-label{ flex:1; font-size:12.5px; }
  .radar-sig .rs-state{ font-size:10.5px; color:var(--ink-soft); font-weight:600; }
  .radar-detail{ margin-top:10px; padding:13px 15px; border-radius:var(--radius-m); background:var(--paper); border:1px solid var(--line-strong); font-size:12.5px; line-height:1.65; }
  .radar-detail dt{ font-weight:600; color:var(--ink); margin-top:8px; }
  .radar-detail dt:first-child{ margin-top:0; }
  .radar-detail dd{ margin:2px 0 0; color:var(--ink-soft); }

  /* ================= V3: WHAT CHANGED ================= */
  .change-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-bottom:14px; }
  .change-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 15px; background:var(--paper-raised); }
  .change-card .cl{ font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; }
  .change-card .cv{ font-family:'Newsreader',serif; font-size:23px; font-weight:600; display:flex; align-items:center; gap:6px; }
  .change-card .cv.up{ color:var(--pine); }
  .change-card .cv.down{ color:var(--rust); }
  .interp-box{ padding:13px 15px; background:var(--steel-soft); border-radius:var(--radius-m); font-size:12.5px; line-height:1.65; color:var(--ink); }

  /* ================= V3: LEARNING PATH ================= */
  .path-list{ display:flex; flex-direction:column; gap:0; }
  .path-step{ display:flex; gap:16px; padding:16px 4px; border-bottom:1px solid var(--line); }
  .path-step:last-child{ border-bottom:none; }
  .path-num{ width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-family:'Newsreader',serif; font-weight:600; font-size:14px; border:2px solid var(--line-strong); color:var(--ink-soft); }
  .path-num.completed{ background:var(--pine); border-color:var(--pine); color:#fff; }
  .path-num.available, .path-num.inprogress{ border-color:var(--amber); color:var(--amber); }
  .path-num.locked{ opacity:.5; }
  .path-body{ flex:1; }
  .path-body h3{ margin:0 0 4px; font-size:14.5px; }
  .path-meta-row{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-soft); margin-bottom:8px; }
  .path-meta-row b{ color:var(--ink); font-family:'IBM Plex Mono',monospace; }
  .path-step.locked{ opacity:.55; }

  /* ================= V3: DAILY PLAN ================= */
  .plan-summary-row{ display:flex; gap:18px; flex-wrap:wrap; margin-bottom:16px; }
  .plan-summary-row .ps{ flex:1; min-width:110px; border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 14px; background:var(--paper-raised); }
  .plan-summary-row .ps b{ display:block; font-family:'Newsreader',serif; font-size:22px; }
  .plan-summary-row .ps span{ font-size:11px; color:var(--ink-soft); }
  .plan-task{ display:flex; align-items:center; gap:14px; border:1px solid var(--line); border-radius:var(--radius-m); padding:13px 15px; margin-bottom:10px; background:var(--paper-raised); }
  .plan-task.done{ opacity:.55; }
  .plan-task .pt-time{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); width:52px; flex:none; }
  .plan-task .pt-body{ flex:1; }
  .plan-task .pt-body h4{ margin:0 0 2px; font-size:13.5px; }
  .plan-task .pt-body p{ margin:0; font-size:11.5px; color:var(--ink-soft); }
  .plan-task.done .pt-body h4{ text-decoration:line-through; }

  /* ================= V3: DIGITAL TWIN / PROFILE ================= */
  .twin-summary{ font-family:'Newsreader',serif; font-style:italic; font-size:19px; color:var(--pine); margin:0 0 16px; }
  .twin-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .twin-item{ border:1px solid var(--line); border-radius:var(--radius-m); padding:12px 14px; }
  .twin-item .tl{ font-size:11px; color:var(--ink-soft); margin-bottom:4px; }
  .twin-item .tv{ font-size:13px; font-weight:600; }

  /* ================= V3: TIMELINE ================= */
  .tl-list{ position:relative; padding-left:22px; }
  .tl-list::before{ content:''; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background:var(--line-strong); }
  .tl-entry{ position:relative; padding-bottom:20px; }
  .tl-entry:last-child{ padding-bottom:0; }
  .tl-entry::before{ content:''; position:absolute; left:-22px; top:3px; width:11px; height:11px; border-radius:50%; background:var(--pine); border:2px solid var(--paper-raised); }
  .tl-entry .tld{ font-size:11px; font-weight:700; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-bottom:2px; }
  .tl-entry .tlt{ font-size:13px; }

  /* ================= V3: EXAM PREP ================= */
  .exam-form-row{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:6px; }
  .exam-form-row label{ display:flex; flex-direction:column; gap:5px; font-size:11.5px; color:var(--ink-soft); font-weight:600; flex:1; min-width:160px; }
  .exam-form-row input, .exam-form-row select{ border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); border-radius:8px; padding:8px 10px; font-size:13px; }
  .exam-stat-row{ display:flex; gap:14px; flex-wrap:wrap; margin:16px 0; }
  .exam-stat-row .es{ flex:1; min-width:110px; text-align:center; border:1px solid var(--line); border-radius:var(--radius-m); padding:14px; background:var(--paper-raised); }
  .exam-stat-row .es b{ display:block; font-family:'Newsreader',serif; font-size:24px; }
  .exam-stat-row .es span{ font-size:11px; color:var(--ink-soft); }
  .exam-day-row{ display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--line); font-size:12.5px; }
  .exam-day-row:last-child{ border-bottom:none; }
  .exam-day-row b{ width:60px; flex:none; }

  /* ================= V3: INTERVENTION CENTER ================= */
  .ic-columns{ display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; align-items:start; }
  .ic-col-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-weight:600; font-size:13px; }
  .ic-count{ font-size:10.5px; background:var(--paper); border:1px solid var(--line-strong); border-radius:999px; padding:1px 8px; color:var(--ink-soft); }
  .ic-card{ border:1px solid var(--line); border-radius:var(--radius-m); padding:13px 14px; margin-bottom:10px; background:var(--paper-raised); }
  .ic-card h4{ margin:0 0 3px; font-size:13.5px; }
  .ic-card .icr{ font-size:11.5px; color:var(--ink-soft); margin:0 0 8px; line-height:1.5; }
  .ic-card .icmeta{ font-size:10.5px; color:var(--ink-soft); margin-bottom:8px; }
  .ic-card .icmeta b{ color:var(--ink); }
  .ic-btn-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .ic-btn-row button{ border:1px solid var(--line-strong); background:var(--paper); color:var(--ink); font-size:10.5px; font-weight:600; padding:5px 9px; border-radius:6px; }
  .ic-btn-row button:hover{ border-color:var(--ink); }
  .ic-btn-row button.resolved{ background:var(--pine-soft); color:var(--pine); border-color:var(--pine-soft); }

  /* ================= V3: INTERVENTION WORKFLOW MODAL ================= */
  .iw-drawer{ max-width:480px; }
  .iw-steps{ display:flex; gap:5px; margin-bottom:18px; }
  .iw-steps span{ flex:1; height:4px; border-radius:99px; background:var(--line); }
  .iw-steps span.on{ background:var(--pine); }
  .iw-option{ display:block; width:100%; text-align:left; border:1px solid var(--line-strong); background:var(--paper-raised); border-radius:var(--radius-m); padding:11px 14px; margin-bottom:8px; font-size:13px; color:var(--ink); }
  .iw-option.sel{ border-color:var(--pine); background:var(--pine-soft); color:var(--pine); font-weight:600; }
  .iw-drawer textarea{ width:100%; min-height:90px; border:1px solid var(--line-strong); border-radius:var(--radius-m); padding:10px 12px; font-size:13px; background:var(--paper); color:var(--ink); font-family:inherit; resize:vertical; }
  .iw-drawer input[type=date]{ border:1px solid var(--line-strong); border-radius:var(--radius-m); padding:9px 12px; font-size:13px; background:var(--paper); color:var(--ink); width:100%; }
  .iw-summary dt{ font-size:11px; color:var(--ink-soft); margin-top:10px; font-weight:600; }
  .iw-summary dt:first-child{ margin-top:0; }
  .iw-summary dd{ margin:2px 0 0; font-size:13px; }
  .iw-success{ text-align:center; padding:26px 10px; }
  .iw-success .chk{ width:52px; height:52px; border-radius:50%; background:var(--pine-soft); color:var(--pine); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 14px; }

  /* ================= V3: FAB / COMMAND CENTER ================= */
  .fab-wrap{ position:fixed; right:24px; bottom:24px; z-index:80; display:flex; flex-direction:column; align-items:flex-end; gap:10px; }
  .fab-menu{ display:flex; flex-direction:column; gap:8px; background:var(--paper-raised); border:1px solid var(--line-strong); border-radius:var(--radius-m); padding:8px; box-shadow:0 14px 34px rgba(20,26,22,0.18); min-width:210px; }
  .fab-menu button{ display:flex; align-items:center; gap:10px; border:none; background:transparent; text-align:left; padding:9px 10px; border-radius:8px; font-size:12.5px; font-weight:600; color:var(--ink); }
  .fab-menu button:hover{ background:var(--paper); }
  .fab-btn{ width:52px; height:52px; border-radius:50%; background:var(--ink); color:#fff; border:none; font-size:22px; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px rgba(20,26,22,0.28); transition:transform .18s ease; }
  .fab-btn:hover{ transform:scale(1.06); }
  @media (max-width:880px){ .fab-wrap{ right:16px; bottom:78px; } }

  /* ================= V3: MOBILE BOTTOM NAV ================= */
  .mobile-tabbar{ display:none; }
  @media (max-width:880px){
    .mobile-tabbar{
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--paper-raised);
      border-top:1px solid var(--line-strong); padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    }
    .mobile-tabbar button{ flex:1; border:none; background:transparent; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:9.5px; font-weight:600; color:var(--ink-soft); padding:5px 2px; }
    .mobile-tabbar button.active{ color:var(--pine); }
    .mobile-tabbar .mi{ font-size:16px; }
    body{ padding-bottom:0; }
    .shell{ padding-bottom:86px; }
  }

  /* ================= V3: DIAGNOSTIC RESULT ================= */
  .diag-groups{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:14px; }
  .diag-col h4{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin:0 0 8px; }
  .diag-col .dchip{ display:block; border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 10px; margin-bottom:6px; font-size:12.5px; background:var(--paper-raised); }

  /* ================= V3: REPORT PRINT (in-app preview) ================= */
  .report-preview{ background:#fff; color:#1B2430; border-radius:var(--radius-m); padding:26px 30px; font-family:'IBM Plex Sans',sans-serif; }
  .report-preview h1{ font-family:'Newsreader',serif; font-size:24px; margin:0 0 4px; }
  .report-preview h2{ font-size:14px; margin:20px 0 8px; border-bottom:1px solid #DCE2DE; padding-bottom:6px; }
  .report-preview .rp-meta{ font-size:11.5px; color:#5B6670; margin-bottom:14px; }
  .report-preview table{ width:100%; border-collapse:collapse; font-size:12px; }
  .report-preview td,.report-preview th{ padding:5px 8px; border-bottom:1px solid #DCE2DE; text-align:left; }

  /* ---------- auth + proctoring + reports (added) ---------- */
  .auth-error{ background:var(--rust-soft); color:var(--rust); border:1px solid #E7C3A8; border-radius:8px; padding:9px 12px; font-size:12.5px; margin-bottom:14px; line-height:1.5; }
  .login-field select{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px; font-size:13.5px; background:var(--paper); color:var(--ink); }
  .acct-chip{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; padding:6px 12px; border:1px solid var(--line-strong); border-radius:999px; background:var(--paper-raised); max-width:240px; }
  .acct-chip span.nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-chip small{ color:var(--ink-soft); font-weight:500; }
  .layout.focus-mode{ grid-template-columns:1fr; max-width:860px; margin:0 auto; }
  .proctor-bar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; background:var(--steel-soft); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:12px; margin-bottom:14px; }
  .proctor-bar .pv{ font-weight:600; }
  .proctor-warn{ background:var(--rust-soft); color:var(--rust); border:1px solid #E7C3A8; border-radius:8px; padding:10px 12px; font-size:12.5px; line-height:1.55; margin-bottom:14px; }
  .test-rules{ margin:12px 0 16px; padding-left:18px; font-size:12.5px; color:var(--ink-soft); line-height:1.75; }

  /* ---------- V7: full-screen timed tests ---------- */
  body.test-lock{ overflow:hidden; }
  .shell.shell-test{ padding:0; max-width:none; }
  .test-fs{ position:fixed; inset:0; z-index:90; background:var(--paper); overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .test-fs-inner{ max-width:980px; margin:0 auto; padding:28px 28px 60px; }
  .test-fs .quiz-q{ font-size:21px; line-height:1.4; margin:10px 0 22px; }
  .test-fs .quiz-opt{ font-size:15.5px; padding:15px 18px; }
  .test-fs .quiz-progress-dots{ flex-wrap:wrap; }
  .test-fs .quiz-progress-dots span{ width:16px; }
  .test-timer{ display:inline-flex; align-items:center; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:17px; font-weight:600; padding:5px 14px; border-radius:999px; background:var(--pine-soft); color:var(--pine); border:1px solid var(--line-strong); }
  .test-timer.warn{ background:var(--amber-soft); color:var(--amber); }
  .test-timer.crit{ background:var(--rust-soft); color:var(--rust); animation:timerpulse 1s ease-in-out infinite; }
  @keyframes timerpulse{ 50%{ opacity:.55; } }
  .timer-track{ height:5px; border-radius:99px; background:var(--line); overflow:hidden; margin:0 0 14px; }
  .timer-track i{ display:block; height:100%; background:var(--pine); transition:width 1s linear, background .3s ease; }
  .timer-track i.warn{ background:var(--amber); } .timer-track i.crit{ background:var(--rust); }
  .fs-lost{ position:fixed; inset:0; z-index:95; background:rgba(15,20,17,.88); display:flex; align-items:center; justify-content:center; padding:24px; }
  .fs-lost .box{ background:var(--paper-raised); color:var(--ink); border-radius:var(--radius-l); padding:28px; max-width:440px; text-align:center; }
  .fs-lost h2{ margin:0 0 8px; font-size:22px; }
  #camBox{ position:fixed; right:14px; bottom:14px; z-index:92; width:150px; border-radius:10px; overflow:hidden; background:#111; border:2px solid var(--pine); box-shadow:0 4px 16px rgba(0,0,0,.25); display:none; }
  #camBox video{ display:block; width:100%; height:auto; min-height:80px; transform:scaleX(-1); background:#000; }
  #camBox span{ position:absolute; left:0; right:0; bottom:0; padding:3px 6px; font-size:10.5px; font-weight:700; color:#fff; background:rgba(30,58,47,.85); }
  #camBox.bad{ border-color:var(--rust); } #camBox.bad span{ background:var(--rust); } .fs-lost p{ font-size:13.5px; line-height:1.6; color:var(--ink-soft); margin:0 0 16px; }
  .timeup-note{ background:var(--amber-soft); color:var(--amber); border-radius:8px; padding:10px 12px; font-size:12.5px; font-weight:600; margin:12px 0; }
  .qkey{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-right:10px; border:1px solid var(--line-strong); border-radius:4px; padding:1px 6px; }

  /* ---------- V8: shared tests + animations ---------- */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  @keyframes popIn{ 0%{ opacity:0; transform:scale(.92) translateY(10px); } 60%{ transform:scale(1.015); } 100%{ opacity:1; transform:none; } }
  @keyframes floaty{ 0%,100%{ transform:translate(0,0) scale(1); } 50%{ transform:translate(18px,-14px) scale(1.08); } }
  @keyframes ringfill{ from{ stroke-dashoffset:var(--circ); } to{ stroke-dashoffset:var(--off); } }
  @keyframes growX{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  @keyframes pulsering{ 0%{ box-shadow:0 0 0 0 rgba(45,95,76,.45); } 70%{ box-shadow:0 0 0 12px rgba(45,95,76,0); } 100%{ box-shadow:0 0 0 0 rgba(45,95,76,0); } }
  @keyframes shimmer{ from{ transform:translateX(-120%); } to{ transform:translateX(220%); } }
  @keyframes confall{ 0%{ transform:translateY(-20px) rotate(0deg); opacity:1; } 100%{ transform:translateY(105vh) rotate(720deg); opacity:.9; } }
  @keyframes rowIn{ from{ opacity:0; transform:translateX(-10px); } to{ opacity:1; transform:none; } }
  .anim-in{ animation:fadeUp .55s cubic-bezier(.2,.7,.2,1) both; animation-delay:var(--d,0s); }
  .anim-pop{ animation:popIn .6s cubic-bezier(.2,.8,.2,1) both; }
  .pulse-btn{ animation:pulsering 2s ease-out infinite; }
  .shell-shared{ max-width:none; padding:0; }
  .sh-wrap{ max-width:760px; margin:0 auto; padding:26px 18px 70px; }
  .sh-hero{ position:relative; overflow:hidden; border-radius:var(--radius-l); padding:28px 26px; margin-bottom:16px; color:#fff; background:linear-gradient(135deg,#2D5F4C,#3F7E66 55%,#4A6FA5); }
  .sh-hero h1{ margin:10px 0 6px; font-size:30px; line-height:1.15; color:#fff; } .sh-hero p{ margin:0; font-size:14px; opacity:.92; }
  .sh-blob{ position:absolute; border-radius:50%; background:rgba(255,255,255,.14); animation:floaty 7s ease-in-out infinite; }
  .sh-blob.b1{ width:170px; height:170px; right:-40px; top:-50px; } .sh-blob.b2{ width:100px; height:100px; right:90px; bottom:-40px; animation-delay:-3s; }
  .sh-hero > *{ position:relative; z-index:1; }
  .sh-form{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-bottom:14px; }
  .sh-form label{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:600; }
  .sh-input{ width:100%; padding:10px 12px; border:1px solid var(--line-strong); border-radius:8px; font-size:13.5px; background:var(--paper); color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease; }
  .sh-input:focus{ outline:none; border-color:var(--pine); box-shadow:0 0 0 3px var(--pine-soft); }
  .wa-btn{ position:relative; overflow:hidden; background:linear-gradient(160deg,#25D366,#128C7E); color:#fff; border:none; font-weight:700; }
  .wa-btn::after{ content:''; position:absolute; top:0; bottom:0; width:40%; background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent); animation:shimmer 2.8s ease-in-out infinite; }
  .wa-btn:hover{ filter:brightness(1.06); }
  .link-made{ border-color:var(--pine); } .link-box{ word-break:break-all; font-family:'IBM Plex Mono',monospace; font-size:11.5px; background:var(--pine-soft); color:var(--ink); padding:12px 14px; border-radius:8px; max-height:96px; overflow:auto; }
  .st-card{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px 18px; margin-bottom:12px; transition:transform .2s ease, box-shadow .2s ease; }
  .st-card:hover{ transform:translateY(-2px); box-shadow:0 10px 24px -14px rgba(20,26,22,.35); }
  .st-top{ display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap; } .st-top h3{ margin:0 0 3px; font-size:18px; }

  /* ============ V10: presentation polish layer (professional, restrained motion) ============ */
  body{
    background:
      radial-gradient(900px 520px at 6% -8%, rgba(45,95,76,.13), transparent 60%),
      radial-gradient(800px 480px at 100% 2%, rgba(74,111,165,.12), transparent 58%),
      radial-gradient(700px 420px at 55% 112%, rgba(107,76,122,.07), transparent 60%),
      var(--paper);
    background-attachment:fixed;
    animation:lgFade .6s ease both;
  }
  ::selection{ background:var(--pine); color:#fff; }
  *:focus-visible{ outline:2px solid var(--steel); outline-offset:2px; border-radius:6px; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:99px; border:2px solid var(--paper); } ::-webkit-scrollbar-thumb:hover{ background:var(--pine); }
  @keyframes lgFade{ from{ opacity:0; } to{ opacity:1; } }
  @keyframes lgFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  @keyframes lgShine{ 0%,100%{ background-position:0% 50%; } 50%{ background-position:100% 50%; } }
  @keyframes lgSweep{ from{ transform:translateX(-120%) skewX(-18deg); } to{ transform:translateX(320%) skewX(-18deg); } }
  @keyframes lgGlow{ 0%,100%{ filter:drop-shadow(0 3px 8px rgba(45,95,76,.30)); } 50%{ filter:drop-shadow(0 5px 16px rgba(74,111,165,.50)); } }
  @keyframes lgPing{ 0%{ box-shadow:0 0 0 0 rgba(179,84,30,.40); } 80%,100%{ box-shadow:0 0 0 8px rgba(179,84,30,0); } }

  /* scroll progress */
  #lgProg{ position:fixed; top:0; left:0; right:0; height:3px; z-index:120; transform-origin:left; transform:scaleX(0); background:linear-gradient(90deg,var(--pine),var(--steel),var(--plum)); }
  body.test-lock #lgProg{ display:none; }

  /* glass header */
  .topbar{
    position:sticky; top:10px; z-index:40;
    padding:12px 20px; margin-bottom:26px;
    background-color:color-mix(in srgb, var(--paper-raised) 78%, transparent);
    -webkit-backdrop-filter:blur(14px) saturate(1.5); backdrop-filter:blur(14px) saturate(1.5);
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 10px 30px -18px rgba(27,36,48,.35);

  .brand .mark{ animation:lgGlow 5s ease-in-out infinite; transition:transform .35s cubic-bezier(.2,.7,.2,1); }
  .brand:hover .mark{ transform:rotate(-6deg) scale(1.08); }

  /* hero */
  .hero-v2{ position:relative; isolation:isolate; }
  .hero-v2::before{ content:''; position:absolute; z-index:-1; width:380px; height:380px; left:-90px; top:-60px; border-radius:50%; background:radial-gradient(circle, rgba(45,95,76,.20), transparent 68%); filter:blur(8px); animation:floaty 14s ease-in-out infinite; pointer-events:none; }
  .hero-v2::after{ content:''; position:absolute; z-index:-1; width:320px; height:320px; right:-40px; bottom:-50px; border-radius:50%; background:radial-gradient(circle, rgba(74,111,165,.22), transparent 68%); filter:blur(8px); animation:floaty 17s ease-in-out infinite reverse; pointer-events:none; }
  .hero-v2 h1{
    background:linear-gradient(110deg, var(--ink) 20%, var(--pine) 55%, var(--steel) 85%, var(--ink));
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    animation:lgShine 10s ease-in-out infinite, fadeUp .8s cubic-bezier(.2,.7,.2,1) both;
  }
  .hero-v2 > div:first-child > *:not(h1){ animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both; }
  .hero-v2 > div:first-child > *:nth-child(1){ animation-delay:.05s; } .hero-v2 > div:first-child > *:nth-child(3){ animation-delay:.2s; }
  .hero-v2 > div:first-child > *:nth-child(4){ animation-delay:.32s; } .hero-v2 > div:first-child > *:nth-child(5){ animation-delay:.44s; }
  .hero-visual{ position:relative; animation:lgFloat 8s ease-in-out infinite, popIn .9s cubic-bezier(.2,.7,.2,1) both; border-top:3px solid transparent; border-image:linear-gradient(90deg,var(--pine),var(--steel),var(--plum)) 1; box-shadow:0 30px 60px -30px rgba(27,36,48,.45), 0 0 0 1px var(--line); }
  .hero-visual .hv-row{ transition:padding-left .25s ease, background-color .25s ease; }
  .hero-visual .hv-row:hover{ padding-left:8px; }
  .badge-pill{ box-shadow:0 0 0 4px rgba(45,95,76,.08); }

  /* section titles */
  .section-title h1::after{ content:''; display:block; width:56px; height:3px; margin-top:10px; border-radius:3px; background:linear-gradient(90deg,var(--pine),var(--steel)); transform-origin:left; animation:growX .9s cubic-bezier(.2,.7,.2,1) .15s both; }

  /* cards + panels */
  .panel, .stat-card, .rep-tile, .teacher-action{ transition:transform .28s cubic-bezier(.2,.7,.2,1), box-shadow .28s ease, border-color .28s ease; }
  .panel{ box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 8px 24px -20px rgba(27,36,48,.30); }
  .panel:hover{ border-color:var(--line-strong); box-shadow:0 14px 34px -22px rgba(27,36,48,.38); }
  .stat-card, .rep-tile{ position:relative; overflow:hidden; }
  .stat-card::before, .rep-tile::before{ content:''; position:absolute; left:0; top:0; right:0; height:3px; background:linear-gradient(90deg,var(--pine),var(--steel)); transform:scaleX(0); transform-origin:left; transition:transform .45s cubic-bezier(.2,.7,.2,1); }
  .stat-card:hover, .rep-tile:hover{ transform:translateY(-4px); border-color:var(--line-strong); box-shadow:0 18px 30px -20px rgba(27,36,48,.45); }
  .stat-card:hover::before, .rep-tile:hover::before{ transform:scaleX(1); }
  .hero-visual:hover, .stat-card:hover, .rep-tile:hover{ background-image:radial-gradient(260px circle at var(--mx,50%) var(--my,50%), rgba(45,95,76,.10), transparent 65%); }
  .teacher-action:hover{ transform:translateX(4px); border-color:var(--pine); }

  /* navigation */
  .sidenav button{ position:relative; transition:background-color .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease; }
  .sidenav button:hover:not(.active){ transform:translateX(4px); background:var(--pine-soft); }
  .sidenav button.active{ box-shadow:0 8px 20px -14px rgba(27,36,48,.45); }
  .sidenav button.active::before{ content:''; position:absolute; left:-1px; top:18%; bottom:18%; width:3px; border-radius:3px; background:linear-gradient(var(--pine),var(--steel)); animation:growX .4s ease both; }

  /* buttons */
  .btn{ position:relative; overflow:hidden; transition:transform .2s ease, box-shadow .2s ease, border-color .15s ease, background-color .15s ease, color .15s ease; }
  .btn:not(:disabled):hover{ transform:translateY(-2px); box-shadow:0 10px 20px -12px rgba(27,36,48,.5); }
  .btn:not(:disabled):active{ transform:translateY(0) scale(.98); }
  .btn.primary{ background:linear-gradient(135deg, var(--pine), color-mix(in srgb, var(--pine) 62%, var(--steel))); border-color:transparent; color:#fff; }
  .btn.primary::after{ content:''; position:absolute; top:0; bottom:0; left:0; width:32%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); transform:translateX(-120%) skewX(-18deg); pointer-events:none; }
  .btn.primary:not(:disabled):hover::after{ animation:lgSweep .8s ease; }

  /* data + status */
  .bar-fill, .rep-bar i{ position:relative; overflow:hidden; }
  .bar-fill::after, .rep-bar i::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent); transform:translateX(-100%); animation:lgSweep 3.2s ease-in-out 1s infinite; }
  .chip-new{ animation:lgPing 2.2s ease-out infinite; }
  .quiz-opt{ transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease, background-color .18s ease; }
  .quiz-opt:not(:disabled):hover{ transform:translateX(4px); box-shadow:0 8px 18px -14px rgba(27,36,48,.5); }
  .rep-head{ transition:background-color .2s ease; }

  /* reveal on first view of a screen */
  .lg-rv{ opacity:0; }
  .lg-go{ animation:fadeUp .65s cubic-bezier(.2,.7,.2,1) var(--rd,0ms) backwards; }

  @media (prefers-reduced-motion: reduce){
    body, .hero-v2 h1, .hero-visual, .hero-v2::before, .hero-v2::after, .brand .mark, .chip-new, .bar-fill::after, .rep-bar i::after{ animation:none !important; }
    .lg-rv{ opacity:1 !important; } .hero-v2 h1{ -webkit-text-fill-color:currentColor; }
  }
  /* ============ V11: extra effects ============ */
  @keyframes lgRipple{ to{ transform:scale(4.5); opacity:0; } }
  @keyframes lgRing{ 0%{ box-shadow:0 0 0 0 rgba(45,95,76,.45); } 70%,100%{ box-shadow:0 0 0 14px rgba(45,95,76,0); } }
  @keyframes lgBlink{ 50%{ opacity:0; } }
  @keyframes lgDrift{ 0%,100%{ transform:translate(0,0) rotate(0); } 50%{ transform:translate(26px,-30px) rotate(12deg); } }

  #lgNet{ position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; opacity:.9; }
  #lgCursor{ position:fixed; left:0; top:0; width:420px; height:420px; border-radius:50%; z-index:-1; pointer-events:none; background:radial-gradient(circle, rgba(74,111,165,.14), transparent 65%); will-change:transform; }
  body.test-lock #lgCursor{ display:none; }

  /* hero extras */
  .lg-type{ font-size:15px; font-weight:600; color:var(--steel); margin:-6px 0 14px; min-height:22px; animation:fadeUp .8s ease .15s both; }
  .lg-type b{ color:var(--pine); font-weight:700; }
  .lg-caret{ display:inline-block; width:2px; height:1.05em; margin-left:2px; vertical-align:-2px; background:var(--pine); animation:lgBlink 1s steps(1) infinite; }
  .badge-pill{ position:relative; overflow:hidden; }
  .badge-pill::after{ content:''; position:absolute; top:0; bottom:0; left:0; width:35%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-120%) skewX(-18deg); animation:lgSweep 4.5s ease-in-out 1.2s infinite; }
  .hero-cta .btn.primary{ animation:lgRing 2.8s ease-out 1.5s infinite; }

  /* 3D tilt */
  .stat-card:hover, .rep-tile:hover{ transform:perspective(800px) translateY(-4px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); }
  .login-card{ transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .25s ease, box-shadow .3s ease; animation:popIn .8s cubic-bezier(.2,.7,.2,1) .1s backwards; box-shadow:0 30px 60px -30px rgba(27,36,48,.45); }

  /* animated login panel */
  .login-left{ position:relative; overflow:hidden; background:linear-gradient(140deg,#17382B 0%, var(--pine) 48%, #2B5E78 100%); background-size:220% 220%; animation:lgShine 14s ease-in-out infinite; }
  .login-left::before, .login-left::after{ content:''; position:absolute; border-radius:50%; pointer-events:none; }
  .login-left::before{ width:340px; height:340px; right:-110px; top:-90px; background:radial-gradient(circle, rgba(255,255,255,.18), transparent 68%); animation:lgDrift 15s ease-in-out infinite; }
  .login-left::after{ width:260px; height:260px; left:-70px; bottom:-60px; background:radial-gradient(circle, rgba(127,163,214,.35), transparent 68%); animation:lgDrift 19s ease-in-out infinite reverse; }
  .login-left > *{ position:relative; z-index:1; }
  .login-left .brand-row{ animation:fadeUp .7s ease .05s backwards; } .login-left h2{ animation:fadeUp .7s ease .18s backwards; } .login-left p{ animation:fadeUp .7s ease .3s backwards; }
  .login-field input{ transition:border-color .2s ease, box-shadow .25s ease, transform .2s ease; }
  .login-field input:focus{ box-shadow:0 0 0 4px rgba(45,95,76,.15); transform:translateY(-1px); }

  /* interaction extras */
  .lg-ripple{ position:absolute; border-radius:50%; background:rgba(255,255,255,.45); transform:scale(0); animation:lgRipple .65s ease-out forwards; pointer-events:none; }
  .btn:not(.primary) .lg-ripple{ background:rgba(45,95,76,.22); }
  body.lg-scrolled .topbar{ padding:8px 18px; box-shadow:0 14px 34px -16px rgba(27,36,48,.5); }
  .topbar{ transition:padding .25s ease, box-shadow .25s ease; }
  tbody tr{ transition:background-color .2s ease, box-shadow .2s ease; }
  tbody tr:hover{ background:var(--pine-soft); box-shadow:inset 3px 0 0 var(--pine); }
  #lgTop{ position:fixed; right:20px; bottom:20px; z-index:80; width:44px; height:44px; border-radius:50%; border:none; cursor:pointer; color:#fff; font-size:18px; background:linear-gradient(135deg,var(--pine),var(--steel)); box-shadow:0 12px 24px -10px rgba(27,36,48,.6); opacity:0; transform:translateY(14px) scale(.9); pointer-events:none; transition:opacity .3s ease, transform .3s ease; }
  #lgTop.show{ opacity:1; transform:none; pointer-events:auto; } #lgTop:hover{ transform:translateY(-3px); }
