      <div class="panel-head"><h2>Record a result sent by a student</h2></div>
      <p class="empty-note" style="margin:0 0 10px;">When a student finishes on their own phone, they tap “Send result to teacher” and WhatsApp delivers a result link. Open it while signed in, or paste it here.</p>
      <div class="btn-row"><input id="importBox" class="sh-input" style="flex:1; min-width:220px;" type="text" placeholder="Paste result link or code"><button class="btn" onclick="importFromBox()">Record result</button></div>
      ${importMsg ? `<div class="sent-note" style="margin-top:10px;">${esc(importMsg)}</div>` : ''}
    </div>
    <div class="panel-head" style="margin:18px 0 10px;"><h2>My shared tests</h2><span class="sub">${tests.length} test${tests.length===1?'':'s'}</span></div>
    ${tests.length ? tests.map(card).join('') : `<div class="panel"><p class="empty-note" style="margin:0;">No tests yet. Create one above and it will appear here with its results.</p></div>`}
  `;
}

/* ---------- student: open link, take test, instant score ---------- */
function handleHash(forced){
  const h = (typeof forced==='string' ? forced : location.hash) || ''; let m;
  if((m = h.match(/^#t=([\w-]+)/))){
    try{
      const p = b64d(m[1]); if(!CONCEPT_MAP[p.tp]) throw new Error('topic');
      sharedCtx = { test:{ id:p.id, title:p.ti, tp:p.tp, n:p.n, m:p.m, by:p.by, be:p.be, ph:p.ph, sd:p.sd }, name:'', roll:'', showReview:false, result:null };
      const acc = currentAccount(); if(acc && acc.type==='student'){ sharedCtx.name = acc.name; sharedCtx.roll = acc.roll||''; }
      quizState = null; diagnosticState = null; currentRole = 'shared'; render();
    }catch(e){ toast('This test link is invalid or damaged'); }
  } else if((m = h.match(/^#r=([\w-]+)/))){
    pendingImport = m[1]; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
    const acc = currentAccount();
    if(acc && acc.type==='staff') doImport(); else { toast('Sign in as the instructor to record this result'); goToLogin('staff','signin'); }
  }
}
window.addEventListener('hashchange', handleHash);

function sharedQuestions(t){
  const qs = questionsFor(t.tp); const n = Math.min(t.n, qs.length);
  const e = Math.round(n*0.25), h = Math.round(n*0.35), m = n-e-h;
  const pick = (d,k)=>qs.filter(q=>q.d===d).sort((a,b)=>seededRand(t.sd+a.q,1)-seededRand(t.sd+b.q,1)).slice(0,k);
  let out = pick('easy',e).concat(pick('medium',m), pick('hard',h));
  if(out.length<n) out = out.concat(qs.filter(q=>!out.includes(q)).slice(0,n-out.length));
  return out;      // same questions, same order, for every student who opens this link
}
function beginSharedQuiz(){
  const t = sharedCtx.test; const list = sharedQuestions(t);
  quizState = { conceptId:t.tp, difficulty:list[0].d, qIndex:0, score:0, total:0, answered:null, correctStreak:0, wrongStreak:0, order:list.map(q=>q.d), pools:{easy:[],medium:[],hard:[]}, fixed:list.slice(1), cur:list[0], done:false, timedOut:false, log:[], startedAt:Date.now(), shared:true };
  startTestTimer('quiz', list.length, t.m*60);
  render();
}
function startSharedTest(){
  const nm = (sharedCtx.name||'').trim();
  if(nm.length<2){ toast('Please enter your name to begin'); const el=document.getElementById('shName'); if(el) el.focus(); return; }
  sharedCtx.name = nm; sharedCtx.result = null; sharedCtx.showReview = false;
  testViolations.quiz = 0; testEvents.quiz = []; testNotice = ''; fsLost = false; fsEntered = false;
  enterFullscreen();
  camReset(); startCamera();
  beginSharedQuiz();
}
function submitSharedResult(){
  const q = quizState, t = sharedCtx.test;
  const res = { id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), testId:t.id, name:sharedCtx.name, roll:sharedCtx.roll||'', score:q.score, total:q.total, pct:q.total?Math.round(q.score/q.total*100):0, durationSec:q.durationSec||0, violations:testViolations.quiz, violEv:testEvents.quiz.slice(), camFlags:camFinal().n, camEvents:camFinal().events, timedOut:!!q.timedOut, at:new Date().toISOString(), log:q.log.map(x=>({ q:x.q, correct:x.correct, chosen:x.chosen, right:x.right, d:x.d })) };
  const all = getSRes(); all.unshift(res); saveSRes(all);
  sharedCtx.result = res;
  if(res.pct>=80) setTimeout(spawnConfetti, 450);
}
function resultLink(res){ const t=sharedCtx.test; return baseUrl()+'#r='+b64e({ i:res.id, t:t.id, n:res.name, r:res.roll, s:res.score, o:res.total, d:res.durationSec, v:res.violations, c:res.camFlags||0, e:(res.violEv||[]).map(x=>[x.ts,x.q,x.w]), ce:(res.camEvents||[]).map(x=>[x.type,x.at,x.dur]), x:res.timedOut?1:0, a:Date.parse(res.at) }); }
function resultShareText(res){
  const t = sharedCtx.test;
  return '*LearnGuard AI — Test result*\n👤 '+res.name+(res.roll?' ('+res.roll+')':'')+'\n📝 '+t.title+'\n🎯 Score: '+res.score+'/'+res.total+' ('+res.pct+'%)\n⏱ Time: '+fmtClock(res.durationSec)+' · Violations: '+res.violations+(res.timedOut?' · Timed out':'')+'\n\nTeacher — open to record in your dashboard:\n'+resultLink(res);
}
function sendResultWa(){ const r=sharedCtx.result; if(r) openWa(waUrl(resultShareText(r), sharedCtx.test.ph)); }
function copyResultLink(){ const r=sharedCtx.result; if(r) copyText(resultLink(r), 'Result link copied'); }
function toggleSharedReview(){ sharedCtx.showReview = !sharedCtx.showReview; render(); }
function leaveShared(){
  quizState = null; sharedCtx = null; try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
  const acc = currentAccount(); if(acc){ openDashboard(); } else { currentRole='home'; render(); }
}
function spawnConfetti(){
  const box = document.createElement('div'); box.className = 'confetti'; const cols = ['#2D5F4C','#B4822C','#4A6FA5','#B3541E','#6B4C7A','#5FA786'];
  for(let i=0;i<60;i++){ const s=document.createElement('i'); s.style.cssText='left:'+(Math.random()*100)+'%;background:'+cols[i%cols.length]+';animation-delay:'+(Math.random()*.8)+'s;animation-duration:'+(2.2+Math.random()*1.6)+'s;transform:rotate('+(Math.random()*360)+'deg);width:'+(6+Math.random()*6)+'px;height:'+(10+Math.random()*8)+'px;'; box.appendChild(s); }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 4800);
}

function renderSharedLanding(){
  const t = sharedCtx.test; const acc = currentAccount();
  return `<div class="sh-wrap">
    <div class="sh-hero anim-in"><div class="sh-blob b1"></div><div class="sh-blob b2"></div>
      <span class="pill amber">Shared test</span>
      <h1>${esc(t.title)}</h1>
      <p>${esc(topicName(t.tp))} · <b>${t.n}</b> questions · <b>${t.m}</b> minutes · from ${esc(t.by)}</p></div>
    <div class="panel anim-in" style="--d:.12s">
      <div class="panel-head"><h2>Before you begin</h2></div>
      <div class="sh-form">
        <label>Your full name<input id="shName" class="sh-input" type="text" autocomplete="name" placeholder="Enter your name" value="${esc(sharedCtx.name)}" oninput="sharedCtx.name=this.value"></label>
        <label>Roll number / ID <span class="st-sub">(optional)</span><input class="sh-input" type="text" placeholder="e.g. 21CS045" value="${esc(sharedCtx.roll)}" oninput="sharedCtx.roll=this.value"></label>
      </div>
      <ul class="test-rules">
        <li>You have <b>${t.m} minutes</b> for <b>${t.n} questions</b>. The test submits itself when the timer ends.</li>
        <li>The test opens in <b>full screen</b>. If you switch tabs or leave this window, it restarts from Question 1.</li>
        <li>Copy, paste and right-click are disabled. Press 1–4 to answer and Enter to continue.</li>
        <li><b>Your camera must stay on.</b> You will be asked to allow camera access; if it is turned off or covered the test is flagged for your teacher. Video is never recorded or uploaded.</li>
        <li>You will see your <b>score immediately</b> when you finish, and can send it to your teacher on WhatsApp.</li>
      </ul>
      <div class="btn-row"><button class="btn primary pulse-btn" onclick="startSharedTest()">Start test</button><button class="btn ghost" onclick="leaveShared()">${acc?'Back to dashboard':'Cancel'}</button></div>
    </div></div>`;
}
function renderSharedResult(){
  const r = sharedCtx.result, t = sharedCtx.test;
  const C = 2*Math.PI*54, off = C*(1-r.pct/100);
  const tone = r.pct>=80?'pine':r.pct>=60?'amber':'rust';
  const verdict = r.pct>=90?'Outstanding!':r.pct>=80?'Excellent work!':r.pct>=60?'Good effort — a little more practice will help.':r.pct>=40?'Keep going — review the topics you missed.':'Don’t worry — revisit the basics and try again.';
  const key = 'res-'+r.id;
  return `<div class="sh-wrap">
    <div class="panel result-card anim-pop">
      <span class="pill ${tone}">Test complete</span>
      <h1 style="margin:10px 0 2px;">${esc(r.name)}</h1>
      <p class="st-sub" style="margin:0 0 6px;">${esc(t.title)} · ${esc(topicName(t.tp))}</p>
      <div class="ring-wrap"><svg viewBox="0 0 130 130" width="190" height="190"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--line)" stroke-width="10"/><circle class="ring-fill ${tone}" cx="65" cy="65" r="54" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 65 65)" style="--circ:${C};--off:${off};stroke-dasharray:${C};stroke-dashoffset:${off}"/></svg>
        <div class="ring-num"><b data-count="${r.pct}" data-suffix="%" data-akey="${key}">${r.pct}%</b><span>${r.score} / ${r.total} correct</span></div></div>
      <p class="verdict ${tone}">${verdict}</p>
      <div class="quiz-meta" style="justify-content:center; margin:6px 0 14px;"><div>Time: <b>${fmtClock(r.durationSec)}</b> of ${fmtClock(t.m*60)}</div><div>Violations: <b>${r.violations}</b></div></div>
      ${r.timedOut ? `<div class="timeup-note">⏱ Time is up — unanswered questions were counted as incorrect.</div>` : ''}
      <div class="sent-note">✅ Your score is saved${t.ph?'':''}. Send it to your teacher so it appears in their dashboard:</div>
      <div class="btn-row" style="justify-content:center;"><button class="btn wa-btn" onclick="sendResultWa()">💬 Send result to teacher on WhatsApp</button><button class="btn small" onclick="copyResultLink()">Copy result link</button></div>
      <div class="btn-row" style="justify-content:center; margin-top:12px;"><button class="btn small" onclick="toggleSharedReview()">${sharedCtx.showReview?'Hide':'Review'} my answers</button><button class="btn small ghost" onclick="leaveShared()">Finish</button></div>
    </div>
    ${sharedCtx.showReview ? `<div class="panel anim-in"><div class="panel-head"><h2>Answer review</h2></div>${r.log.map((x,i)=>`<div class="rev-row ${x.correct?'ok':'bad'}" style="animation-delay:${i*.03}s"><b>${i+1}. ${esc(x.q)}</b><div>${x.correct?'✓ Correct — ':'✗ You answered: '}${esc(x.chosen)}${x.correct?'':` <span class="st-sub">· Correct answer: <b>${esc(x.right)}</b></span>`}</div></div>`).join('')}</div>` : ''}
  </div>`;
}
function renderShared(){
  if(!sharedCtx) return '';
  if(quizState && quizState.done && sharedCtx.result) return renderSharedResult();
  if(quizState) return renderQuiz(null);
  return renderSharedLanding();
}

/* ---------- animations ---------- */
function postRender(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const key = el.getAttribute('data-akey')||''; const target = +el.getAttribute('data-count'); const suf = el.getAttribute('data-suffix')||'';
    if(key && animDone.has(key)){ el.textContent = target+suf; return; }
    if(key) animDone.add(key);
    const dur = 1100, t0 = performance.now();
    (function step(t){ const p = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-p,3); el.textContent = Math.round(target*e)+suf; if(p<1) requestAnimationFrame(step); })(t0);
  });
}
const __origRender = render;
render = function(){ __origRender(); postRender(); };

const __r1 = render;
render = function(){ __r1(); lgPolish(); };

/* ---------- V10: presentation polish (reveal on screen change, scroll progress, hover spotlight) ---------- */
let __lgKey = '';
function lgPolish(){
  const key = currentRole+'|'+studentSection+'|'+instructorSection+'|'+departmentSection;
  const changed = key !== __lgKey; __lgKey = key;
  if(!changed || !('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const els = [...document.querySelectorAll('#app .panel, #app .stat-card, #app .rep-tile, #app .grid-3 > *, #app .grid-4 > *, #app .home-explain > *, #app tbody tr:nth-child(-n+12)')]
    .filter(el=>!el.closest('.test-fs') && !el.classList.contains('anim-in'));
  const io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.remove('lg-rv'); e.target.classList.add('lg-go'); io.unobserve(e.target); }
  }), { threshold:.06 });
  els.forEach((el,i)=>{ el.classList.add('lg-rv'); el.style.setProperty('--rd', (i%8)*55+'ms'); io.observe(el); });
  setTimeout(()=>els.forEach(el=>el.classList.remove('lg-rv')), 1800);   // safety net: never leave anything hidden
}
(function(){
  const bar = document.createElement('div'); bar.id = 'lgProg'; document.body.appendChild(bar);
  addEventListener('scroll', ()=>{
    const h = document.documentElement, max = h.scrollHeight - h.clientHeight;
    bar.style.transform = 'scaleX('+(max>0 ? Math.min(1, h.scrollTop/max) : 0)+')';
  }, { passive:true });
  document.addEventListener('pointermove', (e)=>{
    const el = e.target.closest && e.target.closest('.hero-visual, .stat-card, .rep-tile'); if(!el) return;
    const r = el.getBoundingClientRect();
    el.style.setProperty('--mx', (e.clientX-r.left)+'px'); el.style.setProperty('--my', (e.clientY-r.top)+'px');
  }, { passive:true });
})();

const __r3 = render;
render = function(){ __r3(); lgFx(); };

/* ---------- V11: extra effects ---------- */
const LG_RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TW = { words:['students','instructors','department heads','academic leaders'], w:0, c:0, del:false, on:false };
function lgTypeTick(){
  const el = document.getElementById('lgTW'), word = TW.words[TW.w]; let wait = TW.del ? 35 : 75;
  if(el){
    if(!TW.del){ TW.c++; if(TW.c>=word.length){ TW.del = true; wait = 1500; } }
    else { TW.c--; if(TW.c<=0){ TW.del = false; TW.w = (TW.w+1)%TW.words.length; wait = 350; } }
    el.textContent = word.slice(0, Math.max(0,TW.c));
  }
  setTimeout(lgTypeTick, wait);
}
function lgConfetti(){
  const cv = document.createElement('canvas'); cv.id = 'lgConfetti'; document.body.appendChild(cv);
  const r = devicePixelRatio||1, W = innerWidth, H = innerHeight; cv.width = W*r; cv.height = H*r;
  const x = cv.getContext('2d'); x.scale(r,r);
  const cols = ['#2D5F4C','#4A6FA5','#B4822C','#6B4C7A','#5FA786'];
  const P = Array.from({length:110},()=>({ x:W/2+(Math.random()-.5)*160, y:H*.35, vx:(Math.random()-.5)*13, vy:-Math.random()*13-4, s:Math.random()*7+4, a:Math.random()*6, va:(Math.random()-.5)*.3, c:cols[Math.random()*cols.length|0] }));
  const t0 = performance.now();
  (function f(t){
    const k = (t-t0)/2800; x.clearRect(0,0,W,H);
    P.forEach(p=>{ p.vy += .32; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.va; x.save(); x.globalAlpha = Math.max(0,1-k); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(k<1) requestAnimationFrame(f); else cv.remove();
  })(t0);
}
function lgFx(){
  const h = document.querySelector('.hero-v2 h1');
  if(h && !document.getElementById('lgTW')){
    h.insertAdjacentHTML('afterend','<div class="lg-type">Built for <b id="lgTW">'+TW.words[TW.w].slice(0,TW.c)+'</b><i class="lg-caret"></i></div>');
    if(LG_RM) document.getElementById('lgTW').textContent = TW.words[0];
    else if(!TW.on){ TW.on = true; lgTypeTick(); }
  }
  if(typeof quizState!=='undefined' && quizState && quizState.done && !quizState.__fx){
    quizState.__fx = true;
    if(!LG_RM && currentRole!=='shared' && quizState.total && quizState.score/quizState.total >= 0.8) lgConfetti();
  }
}
(function(){
  /* neural-network background */
  if(!LG_RM){
    const cv = document.createElement('canvas'); cv.id = 'lgNet'; document.body.prepend(cv);
    const cx = cv.getContext('2d'); let W, H, N = [], mx = -999, my = -999, col = '45,95,76', fr = 0;
    const size = ()=>{ const r = devicePixelRatio||1; W = innerWidth; H = innerHeight; cv.width = W*r; cv.height = H*r; cx.setTransform(r,0,0,r,0,0);
      N = Array.from({length:Math.min(60,Math.round(W*H/24000))},()=>({ x:Math.random()*W, y:Math.random()*H, vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35 })); };
    size(); addEventListener('resize', size);
    addEventListener('pointermove', e=>{ mx = e.clientX; my = e.clientY; }, { passive:true });
    const getCol = ()=>{ const h = getComputedStyle(document.documentElement).getPropertyValue('--pine').trim(); if(/^#[0-9a-f]{6}$/i.test(h)) col = [1,3,5].map(i=>parseInt(h.substr(i,2),16)).join(','); };
    (function draw(){
      requestAnimationFrame(draw);
      if(document.hidden || document.body.classList.contains('test-lock')){ cv.style.display = 'none'; return; }
      cv.style.display = 'block'; if(fr++%90===0) getCol();
      cx.clearRect(0,0,W,H);
      for(const p of N){ p.x += p.vx; p.y += p.vy; if(p.x<0||p.x>W) p.vx *= -1; if(p.y<0||p.y>H) p.vy *= -1;
        const dx = mx-p.x, dy = my-p.y; if(dx*dx+dy*dy < 22000){ p.x += dx*.002; p.y += dy*.002; } }
      for(let i=0;i<N.length;i++){ const a = N[i]; cx.fillStyle = 'rgba('+col+',.45)'; cx.beginPath(); cx.arc(a.x,a.y,1.8,0,6.283); cx.fill();
        for(let j=i+1;j<N.length;j++){ const b = N[j], dx = a.x-b.x, dy = a.y-b.y, d = dx*dx+dy*dy;
          if(d<16900){ cx.strokeStyle = 'rgba('+col+','+(0.17*(1-d/16900))+')'; cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke(); } } }
    })();
  }
  /* soft cursor glow */
  if(matchMedia('(hover:hover)').matches && !LG_RM){
    const g = document.createElement('div'); g.id = 'lgCursor'; document.body.appendChild(g);
    let tx = innerWidth/2, ty = innerHeight/3, x = tx, y = ty;
    addEventListener('pointermove', e=>{ tx = e.clientX; ty = e.clientY; }, { passive:true });
    (function f(){ x += (tx-x)*.08; y += (ty-y)*.08; g.style.transform = 'translate('+(x-210)+'px,'+(y-210)+'px)'; requestAnimationFrame(f); })();
  }
  /* button ripple */
  document.addEventListener('pointerdown', e=>{
    const b = e.target.closest && e.target.closest('.btn'); if(!b || b.disabled || LG_RM) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width,r.height)/2, s = document.createElement('span'); s.className = 'lg-ripple';
    s.style.cssText = 'width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
    b.appendChild(s); s.addEventListener('animationend', ()=>s.remove());
  });
  /* 3D tilt */
  document.addEventListener('pointermove', e=>{
    const el = e.target.closest && e.target.closest('.stat-card, .rep-tile, .login-card'); if(!el || LG_RM) return;
    const r = el.getBoundingClientRect(), px = (e.clientX-r.left)/r.width-.5, py = (e.clientY-r.top)/r.height-.5, k = el.classList.contains('login-card') ? 4 : 9;
    el.style.setProperty('--rx', (-py*k)+'deg'); el.style.setProperty('--ry', (px*k)+'deg');
  }, { passive:true });
  document.addEventListener('pointerleave', e=>{ const el = e.target; if(el && el.style && el.matches && el.matches('.stat-card, .rep-tile, .login-card')){ el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); } }, true);
  /* scrolled header + back-to-top */
  const up = document.createElement('button'); up.id = 'lgTop'; up.setAttribute('aria-label','Back to top'); up.textContent = '↑';
  up.onclick = ()=>scrollTo({ top:0, behavior:'smooth' }); document.body.appendChild(up);
  addEventListener('scroll', ()=>{ const y = document.documentElement.scrollTop; document.body.classList.toggle('lg-scrolled', y>24); up.classList.toggle('show', y>500); }, { passive:true });
})();

applyTheme();
render();
handleHash();
LGC.start();
