const STUDENT_MAP = Object.fromEntries(STUDENTS.map(s=>[s.id,s]));

/* ============================================================ HELPERS / DERIVED "AI" LOGIC ============================================================
   Everything below is simulated / illustrative — computed client-side from the demo data above,
   not the output of a trained model. Labelled as such throughout the UI. */

function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return Math.abs(h); }
function seededRand(seed,i=0){ const x=Math.sin(hashStr(String(seed))+i*999.13)*10000; return x-Math.floor(x); }
function seededInt(seed,min,max,i=0){ return min+Math.floor(seededRand(seed,i)*(max-min+1)); }

function bucket(pct){ return pct>=MED_T?'pine':(pct>=WEAK_T?'amber':'rust'); }
function bucketColor(pct){ return pct>=MED_T?'#2D5F4C':(pct>=WEAK_T?'#B4822C':'#B3541E'); }
function statusLabel(pct){ return pct>=MED_T?'Strong':(pct>=WEAK_T?'Developing':'Needs Attention'); }

function overallReadiness(mastery){ const vals=Object.values(mastery); return Math.round(vals.reduce((a,b)=>a+b,0)/vals.length); }
function readinessStatus(pct){ return pct>=75?'On Track':pct>=60?'Developing':pct>=40?'Needs Attention':'High Risk'; }
function trendIcon(t){ return t==='improving'?'📈':t==='declining'?'📉':t==='volatile'?'⚠️':'➡️'; }
function trendWord(t){ return t==='improving'?'Improving':t==='declining'?'Declining':t==='volatile'?'Volatile':'Stable'; }

function weakestConceptId(student){
  return Object.keys(student.mastery).reduce((a,b)=> student.mastery[a]<=student.mastery[b]?a:b);
}

function findRootCauses(mastery){
  const weak = id => mastery[id] < WEAK_T;
  const roots = CONCEPTS.filter(c=>{
    if(!weak(c.id)) return false;
    if(c.prereqs.length===0) return true;
    return c.prereqs.every(p=>!weak(p));
  }).map(c=>c.id);
  return roots.map(rootId=>{
    const seen=new Set(); const queue=[rootId]; let count=0;
    while(queue.length){
      const cur=queue.shift();
      (CHILDREN[cur]||[]).forEach(ch=>{ if(!seen.has(ch)){ seen.add(ch); if(weak(ch)) count++; queue.push(ch); } });
    }
    return { id: rootId, downstreamWeak: count };
  });
}

function rootChain(mastery, rootId){
  const chain=[rootId]; const visited=new Set([rootId]); let current=rootId;
  while(true){
    const children=(CHILDREN[current]||[]).filter(c=>!visited.has(c));
    const weakChildren=children.filter(c=>mastery[c]<WEAK_T);
    if(!weakChildren.length) break;
    weakChildren.sort((a,b)=>mastery[a]-mastery[b]);
    const next=weakChildren[0]; chain.push(next); visited.add(next); current=next;
  }
  return chain;
}

function severityFor(rootMastery, affected){
  if(affected>=3 && rootMastery<40) return {label:'Critical', color:'rust'};
  if(affected>=2) return {label:'High', color:'rust'};
  if(affected>=1) return {label:'Moderate', color:'amber'};
  return {label:'Low / Isolated', color:'pine'};
}

function currentlyLearningConcept(mastery){
  const weak = CONCEPTS.filter(c=>mastery[c.id]<MED_T);
  if(!weak.length) return CONCEPTS[CONCEPTS.length-1];
  return weak.reduce((a,b)=> b.y>a.y ? b : a);
}

function missingFoundationsFor(mastery, target){
  const out=[]; const seen=new Set();
  function walk(c){
    c.prereqs.forEach(pid=>{
      const p=CONCEPT_MAP[pid];
      if(mastery[pid]<MED_T && !seen.has(pid)){ seen.add(pid); out.push(p); walk(p); }
    });
  }
  walk(target);
  return out;
}

function deriveConceptDetail(student, cid){
  const c = CONCEPT_MAP[cid];
  const mastery = student.mastery[cid];
  const seed = student.id+'-'+cid;
  const quizPerf = clamp(mastery + seededInt(seed,-8,6,1),0,100);
  const practiceAcc = clamp(mastery + seededInt(seed,-11,4,2),0,100);
  const mistakes = mastery>=MED_T ? seededInt(seed,0,2,3) : mastery>=WEAK_T ? seededInt(seed,2,5,3) : seededInt(seed,5,9,3);
  const daysAgo = mastery>=MED_T ? seededInt(seed,1,3,4) : seededInt(seed,4,13,4);
  const lastStudied = daysAgo===0?'Today':daysAgo===1?'Yesterday':daysAgo+' days ago';
  const prereqNames = c.prereqs.map(p=>CONCEPT_MAP[p].name);
  const depNames = (CHILDREN[cid]||[]).map(d=>CONCEPT_MAP[d].name);
  return { concept:c, mastery, status:statusLabel(mastery), quizPerf, practiceAcc, mistakes, lastStudied, prereqNames, depNames };
}

function deriveTrend(student){
  const current = overallReadiness(student.mastery);
  const seed = student.id+'-trend';
  const dir = student.gradeTrend;
  const weeks=[current];
  for(let i=1;i<5;i++){
    let prev=weeks[weeks.length-1], delta;
    if(dir==='improving') delta = -seededInt(seed,4,7,i);
    else if(dir==='declining') delta = seededInt(seed,3,6,i);
    else if(dir==='volatile') delta = seededInt(seed,-9,9,i);
    else delta = seededInt(seed,-2,2,i);
    weeks.push(clamp(prev+delta,5,98));
  }
  weeks.reverse();
  return weeks;
}

function deriveSubTrend(student, label){
  const seed = student.id+'-'+label;
  const dir = student.gradeTrend;
  const arrow = dir==='improving'?'📈 Up':dir==='declining'?'📉 Down':dir==='volatile'?'⚠️ Volatile':'➡️ Flat';
  return arrow;
}

function deriveRiskFactors(student){
  const avgMastery = overallReadiness(student.mastery);
  const gapScore = 100-avgMastery;
  const hiddenCount = student.hidden.length;
  const trendPenalty = student.gradeTrend==='declining'?32:student.gradeTrend==='volatile'?24:student.gradeTrend==='improving'?6:13;
  const engagementRaw = hiddenCount*16;
  const prereqPenalty = findRootCauses(student.mastery).length*11 + 4;
  const raw = {
    'Concept mastery': gapScore*0.95 + 4,
    'Quiz trend': trendPenalty,
    'Assignment behavior': engagementRaw*0.6 + 3,
    'Engagement': engagementRaw*0.4 + 2,
    'Prerequisite dependency': prereqPenalty,
  };
  const total = Object.values(raw).reduce((a,b)=>a+b,0)||1;
  const entries = Object.entries(raw).map(([k,v])=>[k, Math.round(v/total*100)]);
  let sum = entries.reduce((a,[,v])=>a+v,0);
  entries[0][1] += (100-sum);
  return entries;
}

function deriveGoal(student, override){
  const current = overallReadiness(student.mastery);
  const base = student.riskScore>=50?20:10;
  const target = override && override.target ? override.target : Math.min(96, current+base);
  const progress = Math.round(clamp((current-35)/((target-35)||1),0,1)*100);
  return { current, target, progress };
}

function deriveConsistency(student){
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const seed = student.id+'-consistency';
  const good = student.gradeTrend!=='declining';
  const arr = days.map((d,i)=>{
    const r = seededRand(seed,i);
    let status;
    if(good) status = r>0.82?'none':r>0.4?'partial':'full';
    else status = r>0.55?'none':r>0.3?'partial':'full';
    return {day:d, status};
  });
  let streak=0;
  for(let i=arr.length-1;i>=0;i--){ if(arr[i].status!=='none') streak++; else break; }
  const weeklyPct = Math.round((arr.filter(a=>a.status==='full').length + arr.filter(a=>a.status==='partial').length*0.5)/7*100);
  return { days:arr, streak, weeklyPct };
}

function deriveAchievements(student){
  const badges=[];
  const roots = findRootCauses(student.mastery);
  const consistency = deriveConsistency(student);
  const masteredCount = Object.values(student.mastery).filter(m=>m>=85).length;
  badges.push({ icon:'🏆', name:'Foundation Builder', desc:'No open foundational gaps right now.', earned: roots.length===0 });
  badges.push({ icon:'🔥', name:consistency.streak+'-Day Learning Streak', desc:'Studied '+consistency.streak+' day(s) in a row.', earned: consistency.streak>=3 });
  badges.push({ icon:'🧠', name:'Concept Master', desc:masteredCount+' concept(s) at 85%+ mastery.', earned: masteredCount>=3 });
  badges.push({ icon:'📈', name:'Fast Improver', desc:'Mastery trending upward over recent weeks.', earned: student.gradeTrend==='improving' });
  badges.push({ icon:'🎯', name:'Quiz Champion', desc:'Scored in the top band on a recent adaptive quiz.', earned: seededInt(student.id+'-qc',0,1,9)===1 && overallReadiness(student.mastery)>=60 });
  badges.push({ icon:'🛠️', name:'Foundation Rebuilder', desc:'Closed a root-cause gap that was affecting later topics.', earned: student.signals.includes('Improving') || roots.length===0 });
  badges.push({ icon:'💪', name:'Recovery Champion', desc:'Bounced back from a flagged foundational gap.', earned: student.signals.includes('Improving') });
  badges.push({ icon:'📚', name:'Deep Learner', desc:'Engaged with resources across multiple weak concepts.', earned: Object.values(student.mastery).filter(m=>m<MED_T).length>=1 && consistency.weeklyPct>=40 });
  badges.push({ icon:'🧩', name:'Problem Solver', desc:'Kept practice accuracy steady even on hard questions.', earned: overallReadiness(student.mastery)>=65 });
  return badges;
}


function notificationsFor(student){
  const weakest = weakestConceptId(student);
  const roots = findRootCauses(student.mastery);
  const list = [
    { id:'n1', kind:'Student Alert', text:`Your mastery in ${CONCEPT_MAP[weakest].name} is below the recommended level (${student.mastery[weakest]}%).` },
  ];
  const improving = Object.entries(student.mastery).filter(([,v])=>v>=80);
  if(improving.length){ list.push({ id:'n2', kind:'Improvement Alert', text:`Your ${CONCEPT_MAP[improving[0][0]].name} mastery is holding strong at ${improving[0][1]}%.` }); }
  if(roots.length){ list.push({ id:'n3', kind:'Faculty Alert', text:`${roots.length} foundational gap${roots.length>1?'s':''} detected this week across the class.` }); }
  list.push({ id:'n4', kind:'System', text:'Your personalized study plan was refreshed based on this week\u2019s quiz results.' });
  return list;
}

/* ============================================================ V3: INTELLIGENCE CENTER — DERIVED "AI" LOGIC ============================================================
   Everything below is simulated / illustrative — computed client-side from the same demo dataset above,
   not the output of a trained model. Every score is labelled as a demo indicator in the UI. */

function deriveHealthScore(student){
  const cons = deriveConsistency(student);
  const mastery = overallReadiness(student.mastery);
  const consistency = cons.weeklyPct;
  const assessment = student.gradeAvg;
  const engagement = clamp(100 - student.hidden.length*18, 12, 99);
  const completion = clamp(Math.round(100 - student.riskScore*0.55), 8, 99);
  const trendScore = student.gradeTrend==='improving' ? 88 : student.gradeTrend==='stable' ? 66 : student.gradeTrend==='volatile' ? 48 : 32;
  const factors = [
    ['Concept Mastery', mastery],
    ['Learning Consistency', consistency],
    ['Assessment Performance', assessment],
    ['Engagement', engagement],
    ['Assignment Completion', completion],
    ['Improvement Trend', trendScore],
  ];
  const overall = Math.round(factors.reduce((a,[,v])=>a+v,0)/factors.length);
  return { overall, factors };
}

const RADAR_SIGNALS = [
  { id:'quiz', label:'Falling quiz performance' },
  { id:'assigntime', label:'Increasing assignment time' },
  { id:'late', label:'Late submissions' },
  { id:'mistakes', label:'Repeated mistakes' },

];

function deriveRadarSignals(student){
  const roots = findRootCauses(student.mastery);
  const cons = deriveConsistency(student);
  const weakest = weakestConceptId(student);
  const weakCount = Object.values(student.mastery).filter(m=>m<WEAK_T).length;
  const findHidden = tag => student.hidden.find(h=>h.tag===tag);
  const detectors = {
    quiz: { on: student.gradeTrend==='declining', evidence: `Grade trend is declining — average sits at ${student.gradeAvg}%.`, concepts:[CONCEPT_MAP[weakest].name] },
    assigntime: { on: !!findHidden('Time on task'), evidence: (findHidden('Time on task')||{}).text || 'No unusual change in assignment time detected.', concepts:[CONCEPT_MAP[weakest].name] },
    late: { on: !!findHidden('Submission timing'), evidence: (findHidden('Submission timing')||{}).text || 'Submission timing looks typical.', concepts:[] },
    mistakes: { on: weakCount>=2, evidence: `${weakCount} concept(s) currently below the ${WEAK_T}% mastery threshold.`, concepts: CONCEPTS.filter(c=>student.mastery[c.id]<WEAK_T).map(c=>c.name) },
    prereq: { on: roots.length>0, evidence: roots.length ? `${roots.length} unresolved prerequisite chain(s) detected, starting at ${CONCEPT_MAP[roots[0].id].name}.` : 'No broken prerequisite chains detected.', concepts: roots.map(r=>CONCEPT_MAP[r.id].name) },
    engagement: { on: !!(findHidden('Forum activity')||findHidden('Help-seeking')||findHidden('Engagement')), evidence: (findHidden('Forum activity')||findHidden('Help-seeking')||findHidden('Engagement')||{}).text || 'Engagement looks steady.', concepts:[] },
    inactivity: { on: cons.streak===0, evidence: cons.streak===0 ? 'No study activity logged in the current streak window.' : `Active streak of ${cons.streak} day(s) — no inactivity detected.`, concepts:[] },
    sudden: { on: student.gradeTrend==='volatile', evidence: student.gradeTrend==='volatile' ? 'Recent scores swing well outside the normal range for this student.' : 'Performance has stayed within a normal band.', concepts:[] },
  };
  const list = RADAR_SIGNALS.map(s=>({ ...s, ...detectors[s.id] }));
  const activeCount = list.filter(s=>s.on).length;
  const overall = activeCount===0 ? 'Stable' : activeCount<=2 ? 'Emerging' : activeCount<=4 ? 'Concerning' : 'Critical';
  const overallColor = activeCount===0?'pine':activeCount<=2?'amber':activeCount<=4?'rust':'rust';
  return { list, activeCount, overall, overallColor };
}

  assigntime:'Ask whether workload or time pressure outside this course may be a factor.',
  late:'A brief, low-pressure check-in message before the next deadline.',

};

function deriveWeeklyChanges(student){
  const seed = student.id+'-weekchange';
  const weakest = weakestConceptId(student);
  const quizDelta = student.gradeTrend==='improving' ? seededInt(seed,4,10,1) : student.gradeTrend==='declining' ? -seededInt(seed,4,10,1) : student.gradeTrend==='volatile' ? (seededInt(seed,0,1,7)?1:-1)*seededInt(seed,5,9,1) : seededInt(seed,-2,3,1);
  const studyDelta = seededInt(seed,-15,30,2);
  const forumDelta = student.signals.includes('Hidden struggle') ? -seededInt(seed,20,45,3) : seededInt(seed,-10,15,3);
  const masteryDelta = student.gradeTrend==='improving' ? seededInt(seed,5,14,4) : seededInt(seed,-6,8,4);
  return [
    { label:'Quiz performance', delta:quizDelta, unit:'%' },
    { label:'Study time', delta:studyDelta, unit:'%' },
    { label:'Forum activity', delta:forumDelta, unit:'%' },
    { label:CONCEPT_MAP[weakest].name+' mastery', delta:masteryDelta, unit:' pts' },
  ];
}

function interpretWeeklyChanges(items){
  const quiz=items[0].delta, study=items[1].delta, forum=items[2].delta;
  if(quiz<0 && study>0) return `Performance is declining while study time is increasing. This may indicate time is being spent without resolving a foundational concept — worth checking whether the right topic is being practiced.`;
  if(quiz>0 && study>0) return `Performance is improving alongside increased study time — a strong sign the extra effort is translating into real understanding.`;
  if(quiz<0 && forum<-15) return `Performance is declining alongside a drop in forum activity. This can indicate quietly struggling rather than asking for help.`;
  if(quiz>0 && study<0) return `Performance is holding up despite less study time — mastery may be solidifying, though this is worth continuing to monitor.`;
  if(quiz<0 && forum>0) return `Performance dipped even with steady participation — the gap may be concept-specific rather than a motivation issue.`;
  return `No strong correlation detected between this week's signals — activity looks broadly stable.`;
}

function deriveLearningProfile(student){
  const cons = deriveConsistency(student);
  const roots = findRootCauses(student.mastery);
  const pace = cons.streak>=4 ? 'Fast-paced' : cons.streak>=2 ? 'Steady-paced' : 'Irregular-paced';
  const consistencyLabel = cons.weeklyPct>=70 ? 'highly consistent practice' : cons.weeklyPct>=40 ? 'moderately consistent practice' : 'inconsistent practice';
  const vals = Object.values(student.mastery);
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const variance = Math.round(Math.sqrt(vals.reduce((a,v)=>a+Math.pow(v-mean,2),0)/vals.length));
  const masteryPattern = variance>18 ? 'Uneven mastery across topics' : 'Even mastery across topics';
  const assessPattern = student.gradeTrend==='volatile' ? 'Unpredictable results week to week' : student.gradeTrend==='improving' ? 'Steadily improving results' : student.gradeTrend==='declining' ? 'Declining results' : 'Stable, predictable results';
  const engagementPattern = student.signals.includes('Hidden struggle') ? 'Engagement trailing below what scores suggest' : 'Engagement consistent with scores';
  const recoveryPattern = student.signals.includes('Improving') ? 'Demonstrated recovery from an earlier gap' : (roots.length ? 'No recovery pattern observed yet' : 'No major recovery needed so far');
  const summary = `${pace} learner / ${consistencyLabel}`;
  return { pace, consistencyLabel, masteryPattern, assessPattern, engagementPattern, recoveryPattern, summary, variance };
}

function buildLearningPath(student){
  const roots = findRootCauses(student.mastery).sort((a,b)=>b.downstreamWeak-a.downstreamWeak);
  const seen = new Set();
  let order = [];
  roots.forEach(r=>{ rootChain(student.mastery, r.id).forEach(cid=>{ if(!seen.has(cid)){ seen.add(cid); order.push(cid); } }); });
  CONCEPTS.filter(c=>student.mastery[c.id]<MED_T && !seen.has(c.id)).forEach(c=>{ seen.add(c.id); order.push(c.id); });
  if(!order.length) order = CONCEPTS.filter(c=>student.mastery[c.id]<85).map(c=>c.id).slice(0,3);
  const key = id => youId+'::'+id;
  let prevDone = true;
  return order.map((cid,i)=>{
    const c = CONCEPT_MAP[cid];
    const current = student.mastery[cid];
    const target = Math.max(current+15, 82);
    const gap = Math.max(target-current,0);
    const est = Math.round(gap*1.6)+15;
    const difficulty = c.prereqs.length>=2 ? 'Hard' : c.prereqs.length===1 ? 'Medium' : 'Easy';
    const completed = current>=target;
    let status;
    if(completed) status='COMPLETED';
    else if(!prevDone) status='LOCKED';
    else status = learningPathProgress[key(cid)] ? 'IN PROGRESS' : 'AVAILABLE';
    prevDone = completed;
    return { id:cid, name:c.name, current, target, est, difficulty, status };
  });
}

function buildDailyPlan(student){
  const seed = student.id+'-dailyplan-'+dailyPlanSeed;
  const weakConcepts = CONCEPTS.filter(c=>student.mastery[c.id]<MED_T).sort((a,b)=>student.mastery[a.id]-student.mastery[b.id]);
  const pool = weakConcepts.length ? weakConcepts : CONCEPTS.slice(0,4);
  const pick = i => pool[i % pool.length];
  const tasks = [
    { id:'t1', time:'09:00', title:`Review ${pick(0).name}`, minutes:20 },
    { id:'t2', time:'11:30', title:`5 practice questions — ${pick(1).name}`, minutes:15 },
    { id:'t3', time:'16:00', title:`${pick(2).name} challenge set`, minutes:25 },
    { id:'t4', time:'20:00', title:'Mini quiz — weakest concept', minutes:10 },
  ];
  return tasks;
}

function classifyDiagnostic(mastery, result){
  if(result==='fail' && mastery<40) return { label:'Critical Foundation', color:'rust' };
  if(result==='fail') return { label:'Weak', color:'rust' };
  if(mastery<70) return { label:'Developing', color:'amber' };
  return { label:'Strong', color:'pine' };

function buildTimeline(student){
  const events = [];
  (interventionHistory[student.id]||[]).slice().reverse().forEach(h=>{
    events.push({ date:h.date, text:`Teacher intervention created — ${h.action}` });
  });
  (interventionNotes[student.id]||[]).slice().reverse().forEach(n=>{
    events.push({ date:'Recent', text:`Note added: "${n}"` });
  });
  const weakest = CONCEPT_MAP[weakestConceptId(student)].name;
  const strongestId = Object.keys(student.mastery).sort((a,b)=>student.mastery[b]-student.mastery[a])[0];
  events.push({ date:'Sep 14', text:`Risk score sits at ${student.riskScore}% — ${riskBand(student.riskScore).label.toLowerCase()}.` });
  events.push({ date:'Sep 12', text:`${weakest} quiz attempted.` });
  events.push({ date:'Sep 10', text: student.gradeTrend==='declining' ? 'Assignment submitted in the final hour before deadline.' : 'Assignment submitted on schedule.' });
  events.push({ date:'Sep 8', text:`${CONCEPT_MAP[strongestId].name} mastery holding at ${student.mastery[strongestId]}%.` });
  events.push({ date:'Sep 5', text:'Weekly study plan refreshed from latest quiz results.' });
  return events;
}

function interventionCategory(s){
  if(s.riskScore>=80) return 'Critical';
  if(s.riskScore>=60) return 'High';
  if(s.riskScore>=35) return 'Moderate';
  if(s.gradeTrend==='improving') return 'Improving';
  return 'Monitoring';
}
const IC_ORDER = ['Critical','High','Moderate','Monitoring','Improving'];
const IC_COLOR = { Critical:'rust', High:'rust', Moderate:'amber', Monitoring:'steel', Improving:'pine' };

function lastActivityFor(student){
  const days = seededInt(student.id+'-lastact', 0, 6, 3);
  return days===0 ? 'Today' : days===1 ? 'Yesterday' : days+' days ago';
}

function deriveExamPlan(student, hoursAvailable, daysRemaining){
  const weak = CONCEPTS.filter(c=>student.mastery[c.id]<MED_T);
  const covered = CONCEPTS.length - weak.length;
  const readiness = clamp(Math.round(overallReadiness(student.mastery) + Math.min(daysRemaining,14)*0.8), 0, 99);
  const days = Math.max(1, Math.min(daysRemaining, 10));
  const perDay = Math.ceil((weak.length||1)/days);
  const dailyPlan = [];
  for(let d=0; d<days; d++){
    const slice = weak.slice(d*perDay, d*perDay+perDay).map(c=>c.name);
    dailyPlan.push({ day:'Day '+(d+1), topics: slice.length?slice:['Mixed review & practice test'], hours: Math.max(1, Math.round((hoursAvailable/days)*10)/10) });
  }
  return { covered, remaining: weak.length, readiness, dailyPlan, weakNames: weak.map(c=>c.name) };
}

    ['easy','Which of these is a greedy algorithm for minimum spanning trees?','Kruskal’s algorithm','Bellman-Ford','Floyd–Warshall','Depth-first search'],
    ['medium','In activity selection, the greedy rule picks the next activity with the…','Earliest finish time','Earliest start time','Longest duration','Random choice'],
    ['medium','Prim’s algorithm repeatedly adds…','The cheapest edge connecting the tree to a new vertex','The largest edge','A random edge','All edges at once'],
    ['medium','Kruskal’s algorithm, dominated by sorting the edges, takes…','O(E log E)','O(V)','O(E)','O(V^3)'],
    ['medium','Dijkstra’s algorithm is greedy because it…','Always finalises the closest unvisited vertex next','Tries every possible path','Uses only a DP table','Reverses all edges'],
    ['medium','To minimise total waiting time, schedule jobs in order of…','Shortest processing time first','Longest processing time first','Arrival time only','Random order'],
    ['medium','The greedy-choice property means…','A global optimum can be reached through locally optimal choices','The problem has overlapping subproblems','Recursion is required','The input must be sorted'],
    ['hard','An exchange argument is used to…','Prove that a greedy algorithm is optimal','Sort the input','Hash the keys','Speed up the code'],
    ['hard','Huffman coding produces…','Optimal prefix-free codes','Fixed-length codes','Lossy compression','Sorted output'],
    ['hard','Why does nearest-neighbour greedy fail to solve TSP optimally?','Local choices can lock into a poor global tour','It needs too much memory','Sorting is impossible','The graph is infinite'],
    ['hard','Greedy fractional knapsack runs in…','O(n log n)','O(n^2 · W)','O(2^n)','O(n!)'],
    ['hard','The minimum number of meeting rooms can be found greedily by…','Sorting start and end times and sweeping through them','DP over subsets','Hashing the meetings','Backtracking over all schedules'],
  ],
};
Object.entries(MORE_Q).forEach(([tid, list])=>{
  QUESTION_BANK[tid] = (QUESTION_BANK[tid]||[]).concat(list.map(([d,q,right,...wrong])=>{
    const opts = [right].concat(wrong);
    const order = opts.map((_,i)=>i).sort((x,y)=>seededRand(q,x)-seededRand(q,y));
    return { d, q, o:order.map(i=>opts[i]), a:order.indexOf(0) };
  }));
});

function genericQuestion(concept, difficulty, i){
  return { d:difficulty, q:`Which statement best reflects a ${difficulty}-level idea in ${concept.name}?`,
    o:[`A core, correctly-applied idea from ${concept.name}`, 'An unrelated topic', 'A syntax error message', 'A random number'], a:0 };
}

function questionsFor(conceptId){
  const c = CONCEPT_MAP[conceptId];
  if(QUESTION_BANK[conceptId]) return QUESTION_BANK[conceptId];
  return [genericQuestion(c,'easy',1), genericQuestion(c,'medium',2), genericQuestion(c,'hard',3)];
}

/* ============================================================ AI ASSISTANT (canned, prototype) ============================================================ */

function assistantAnswer(question, student){
  const q = question.toLowerCase();
  const weakest = weakestConceptId(student);
  const roots = findRootCauses(student.mastery);
  const rootName = roots.length ? CONCEPT_MAP[roots[0].id].name : null;
  const readiness = overallReadiness(student.mastery);

  if(q.includes('weak') || q.includes('struggl')){
    return `Your lowest mastery right now is ${CONCEPT_MAP[weakest].name} at ${student.mastery[weakest]}%. ` +
      (rootName ? `The earliest gap in the chain looks like ${rootName} — that may be the real cause rather than the topic you're stuck on.` : `It doesn't look like it's part of a longer prerequisite chain right now — a fairly contained gap.`);
  }
  if(q.includes('study today') || q.includes('what should i study')){
    return rootName ? `Start with ${rootName} — it's the earliest weak concept and closing it should help unlock what comes after it.` : `Focus on ${CONCEPT_MAP[weakest].name}, your lowest-mastery concept right now.`;
  }
  if(q.includes('pointer') && q.includes('simpl')){
    return `Think of a pointer as a sticky note with an address written on it, not the item itself. It "points to" a box in memory holding the actual value — that's why changing what's in the box changes everything that points to it.`;
  }
  if(q.includes('prerequisite') || q.includes('missing')){
    return rootName ? `You're missing solid footing in ${rootName} (${student.mastery[roots[0].id]}%), and a few later topics build directly on it.` : `No missing prerequisite is currently flagged for you — your gaps look self-contained rather than chained.`;
  }
  if(q.includes('question') && q.includes('weak')){
    return `Head to the Adaptive Quiz — it's already tuned to start on ${CONCEPT_MAP[weakest].name}, your weakest concept.`;
  }
  if(q.includes('readiness') || q.includes('improve')){
    return `Your overall readiness is ${readiness}%. Closing ${CONCEPT_MAP[weakest].name} first, since it's your lowest concept, is usually the fastest lever.`;
  }
  if(q.includes('explain') && q.includes('trees')){
    return `Trees build on Functions/Recursion and Linked Lists. If either of those feels shaky, tree traversal problems tend to feel harder than they should.`;
  }
  return `I can help with concept gaps, study plans, and quiz practice. Try asking things like "Why am I weak in ${CONCEPT_MAP[weakest].name}?" or "What should I study today?"`;
}

/* ============================================================ CHART HELPERS ============================================================ */

function lineChartSVG(values, color){
  const w=560,h=170,pad=26;
  const min=Math.min(...values)-6, max=Math.max(...values)+6;
  const stepX=(w-2*pad)/(values.length-1);
  const pts=values.map((v,i)=>{
    const x=pad+i*stepX;
    const y=h-pad-((v-min)/(max-min||1))*(h-2*pad);
    return [x,y];
  });
  const path=pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L ${pts[pts.length-1][0].toFixed(1)} ${h-pad} L ${pts[0][0].toFixed(1)} ${h-pad} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${color}"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="11" font-family="IBM Plex Mono, monospace" fill="#1B2430">${values[i]}%</text>`).join('');
  const labels=pts.map((p,i)=>`<text x="${p[0]}" y="${h-6}" text-anchor="middle" font-size="10.5" fill="#5B6670">Week ${i+1}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
    <path d="${areaPath}" fill="${color}" opacity="0.07"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.4"/>
    ${dots}${labels}
  </svg>`;
}

/* ============================================================ GRAPH RENDER ============================================================ */

function renderGraph(mastery, roots, selectedId){
  const rootIds=new Set(roots.map(r=>r.id));
  const weakDownstream=new Set();
  roots.forEach(r=>{
    const seen=new Set(); const q=[r.id];
    while(q.length){ const cur=q.shift(); (CHILDREN[cur]||[]).forEach(ch=>{ if(!seen.has(ch)){ seen.add(ch); if(mastery[ch]<WEAK_T) weakDownstream.add(ch); q.push(ch); } }); }
  });

  let edges='';
  CONCEPTS.forEach(c=>{
    c.prereqs.forEach(pid=>{
      const p=CONCEPT_MAP[pid];
      const isChain = rootIds.has(pid) && (weakDownstream.has(c.id) || mastery[c.id]<WEAK_T);
      edges += `<line x1="${p.x}" y1="${p.y+34}" x2="${c.x}" y2="${c.y-34}" stroke="${isChain?'#B3541E':'#C7CDC9'}" stroke-width="${isChain?2.5:1.5}" stroke-dasharray="${isChain?'6 4':'0'}" />`;
    });
  });

  let nodes='';
  CONCEPTS.forEach(c=>{
    const pct=mastery[c.id];
    const color=bucketColor(pct);
    const isRoot=rootIds.has(c.id);
    const isSel = selectedId===c.id;
    nodes += `<g class="node-hit" onclick="selectConcept('${c.id}')">
      ${isRoot?`<circle cx="${c.x}" cy="${c.y}" r="40" fill="none" stroke="#B3541E" stroke-width="2" stroke-dasharray="4 3" />`:''}
      ${isSel?`<circle cx="${c.x}" cy="${c.y}" r="37" fill="none" style="stroke:var(--ink)" stroke-width="2" />`:''}
      <circle cx="${c.x}" cy="${c.y}" r="32" fill="${color}" />
      <text x="${c.x}" y="${c.y+5}" text-anchor="middle" class="node-pct">${pct}</text>
      <text x="${c.x}" y="${c.y+50}" text-anchor="middle" class="node-label">
        ${c.lines.map((l,i)=>`<tspan x="${c.x}" dy="${i===0?0:12}">${l}</tspan>`).join('')}
      </text>
    </g>`;
  });

  return `<div class="graph-wrap">
    <svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">${edges}${nodes}</svg>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:#2D5F4C"></span>🟢 Mastered (70%+)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#B4822C"></span>🟡 Developing (55–69%)</div>
      <div class="legend-item"><span class="legend-dot" style="background:#B3541E"></span>🔴 Needs work (below 55%)</div>
      <div class="legend-item"><span style="width:14px;height:0;border-top:2px dashed #B3541E;display:inline-block;margin-right:2px"></span>Root cause &amp; cascade</div>
    </div>
  </div>`;
}

/* Prototype note: data is cached in this browser and synced to a Firebase Realtime Database (see CLOUD SYNC below). Passwords are salted + SHA-256 hashed, but this is NOT production security. */
const LG_ACC_KEY = 'lg-accounts', LG_REP_KEY = 'lg-reports', LG_SESS_KEY = 'lg-session';
let __memStore = {};
/* ============================================================ CLOUD SYNC (v13) ============================================================
   All shared data (accounts, reports, messages, tests, results, live alerts, interventions) is mirrored to a Firebase Realtime Database,
   so every laptop / phone sees the same live data. Setup: paste your database URL into LG_CLOUD_URL below (or tap the badge at the bottom-left).
   Without a URL the site keeps working exactly as before (this browser only). Prototype-level security: see the setup notes. */
const LG_CLOUD_URL = '';   // e.g. 'https://your-project-default-rtdb.firebaseio.com'
function rawGet(k, fb){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(e){ return (k in __memStore) ? __memStore[k] : fb; } }
function rawSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ __memStore[k] = v; } }
function lsGet(k, fb){ return rawGet(k, fb); }
function lsSet(k, v){ rawSet(k, v); try{ if(typeof LGC!=='undefined' && LGC) LGC.changed(k); }catch(e){} }

function lgMerge3(base, mine, theirs, idf){
  const J = JSON.stringify;
  if(Array.isArray(mine)){
    const b = Array.isArray(base) ? base : [], t = Array.isArray(theirs) ? theirs : [];
    const bm = new Map(b.map(x=>[idf(x), x])), mm = new Map(mine.map(x=>[idf(x), x]));
    const out = t.filter(x=>!(bm.has(idf(x)) && !mm.has(idf(x))));      // keep others' items, drop what I deleted
    const pos = new Map(out.map((x,i)=>[idf(x), i]));
    const added = [];
    mine.forEach(x=>{
      const k = idf(x);
      if(!bm.has(k)){ if(pos.has(k)) out[pos.get(k)] = x; else added.push(x); }
      else if(J(bm.get(k)) !== J(x) && pos.has(k)) out[pos.get(k)] = x;  // I edited it
    });
    const front = mine.length && !bm.has(idf(mine[0]));
    return front ? added.concat(out) : out.concat(added);
  }
  if(mine && typeof mine==='object' && theirs && typeof theirs==='object' && !Array.isArray(theirs)){
    const b = (base && typeof base==='object' && !Array.isArray(base)) ? base : {};
    const out = Object.assign({}, theirs);
    new Set(Object.keys(mine).concat(Object.keys(b))).forEach(k=>{
      if(!(k in mine)){ if(k in b) delete out[k]; return; }
      if(J(mine[k]) === J(b[k])) return;
      out[k] = (k in theirs && mine[k] && typeof mine[k]==='object' && !Array.isArray(mine[k])) ? lgMerge3(b[k], mine[k], theirs[k], idf) : mine[k];
    });
    return out;
  }
  return mine;
}

var LGC = (function(){
  const J = JSON.stringify;
  let url = (LG_CLOUD_URL || '').trim();
  if(!url){ try{ url = localStorage.getItem('lg-cloud-url') || ''; }catch(e){} }
  url = url.replace(/\/+$/, '');
  const ALL = ['lg-accounts','lg-reports','lg-live-log','lg-messages','lg-interventions','lg-shared-tests','lg-shared-results'];
  const linkMode = /^#t=/.test(location.hash);              // student opening a shared test link: only needs to send results back
  const KEYS = linkMode ? ['lg-shared-results','lg-live-log'] : ALL;
  const idOf = k => k==='lg-accounts' ? (x=>x.email+'|'+x.type) : (x=>(x && x.id!=null) ? x.id : J(x));
  const post = (k, v) => (k==='lg-live-log' && Array.isArray(v)) ? v.slice().sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,60) : v;
  const pushing = {}, again = {}, dirty = {}, timers = {};
  let etagOK = true, es = null, status = url ? 'connecting' : 'off';

  function getBase(k){ try{ const v = localStorage.getItem('lg-b:'+k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
  function setBase(k, v){ try{ localStorage.setItem('lg-b:'+k, J(v)); }catch(e){} }
  function setStatus(s){
    status = s; const el = document.getElementById('lgCloud'); if(!el) return;
    const m = { off:['☁️ Local only · tap to connect','#8a6d1f'], connecting:['☁️ Connecting…','#475569'], online:['☁️ Synced · live','#15803d'], offline:['⚠️ Offline · will retry','#b45309'] }[s];
    el.textContent = m[0]; el.style.color = m[1];
  }
  async function cget(k){
    const r = await fetch(url+'/lg/'+k+'.json', { headers: etagOK ? {'X-Firebase-ETag':'true'} : {}, cache:'no-store' });
    if(!r.ok) throw new Error('GET '+r.status);
    const etag = r.headers.get('ETag'), s = await r.json();
    return { val: s==null ? null : JSON.parse(s), etag };
  }
  async function cput(k, v, etag){
    const h = {'Content-Type':'application/json'}; if(etag && etagOK) h['if-match'] = etag;
    const r = await fetch(url+'/lg/'+k+'.json', { method:'PUT', headers:h, body: J(J(v)) });
    if(r.status === 412) return false;                         // someone else wrote in between: re-merge
    if(!r.ok) throw new Error('PUT '+r.status);
    return true;
  }
  async function attempt(k){
    const mine = rawGet(k, null); if(mine === null) return true;
    const r = await cget(k), b = getBase(k);
    let out = mine;
    if(r.val !== null && J(r.val) !== J(b)) out = post(k, lgMerge3(b, mine, r.val, idOf(k)));
    if(r.val === null || J(out) !== J(r.val)){ if(!(await cput(k, out, r.etag))) return false; }
    setBase(k, out);
    if(J(out) !== J(mine) && !linkMode && J(rawGet(k, null)) === J(mine)){ rawSet(k, out); try{ lgOnChange(k); }catch(e){} }
    return true;
  }
  async function push(k){
    if(!url) return;
    if(pushing[k]){ again[k] = true; return; }
    pushing[k] = true;
    try{
      let ok = false, n = 0;
      while(!ok && n < 6){
        n++;
        try{ ok = await attempt(k); }
        catch(e){ if(e instanceof TypeError && etagOK){ etagOK = false; continue; } throw e; }
      }
      setStatus('online');
    }catch(e){ dirty[k] = true; setStatus('offline'); }
    pushing[k] = false;
    if(again[k]){ again[k] = false; push(k); }
  }
  function applyRemote(k, rv){
    const local = rawGet(k, null), b = getBase(k);
    if(local !== null && J(local) !== J(b)){ push(k); return; }  // I have changes the cloud hasn't seen yet → merge + upload
    setBase(k, rv);
    if(!linkMode && (local === null || J(local) !== J(rv))){ rawSet(k, rv); try{ lgOnChange(k); }catch(e){} }
  }
  function handle(path, data, isPatch){
    if(path === '/'){
      const o = data || {};
      KEYS.forEach(k=>{
        if(typeof o[k] === 'string') applyRemote(k, JSON.parse(o[k]));
        else if(!isPatch && rawGet(k, null) !== null) push(k);   // cloud empty but this device has data → upload it
      });
    } else {
      const k = path.slice(1).split('/')[0];
      if(KEYS.indexOf(k) >= 0 && typeof data === 'string') applyRemote(k, JSON.parse(data));
    }
  }
  function connect(){
    try{ if(es) es.close(); }catch(e){}
    es = new EventSource(url+'/lg.json');
    es.addEventListener('put',   ev=>{ try{ const d = JSON.parse(ev.data); handle(d.path, d.data, false); }catch(e){} });
    es.addEventListener('patch', ev=>{ try{ const d = JSON.parse(ev.data); handle(d.path, d.data, true); }catch(e){} });
    es.onopen = ()=>setStatus('online');
    es.onerror = ()=>setStatus('offline');
  }
  function start(){
    if(!linkMode){
      const el = document.createElement('div'); el.id = 'lgCloud';
      el.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:60;font:600 12px system-ui,sans-serif;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.93);border:1px solid rgba(0,0,0,.14);box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer;user-select:none;';
      el.onclick = ()=>{
        if(url && status !== 'offline') return;
        const v = prompt('Paste your Firebase Realtime Database URL (e.g. https://your-project-default-rtdb.firebaseio.com):', url);
        if(v && v.trim()){ try{ localStorage.setItem('lg-cloud-url', v.trim()); }catch(e){} location.reload(); }
      };
      document.body.appendChild(el);
    }
    setStatus(url ? 'connecting' : 'off');
    if(!url) return;
    if(linkMode){ setStatus('online'); }
    else {
      connect();
      setInterval(()=>{ if(es && es.readyState === 2) connect(); }, 15000);
    }
    setInterval(()=>{ Object.keys(dirty).forEach(k=>{ if(dirty[k]){ dirty[k] = false; push(k); } }); }, 20000);
    addEventListener('online', ()=>{ Object.keys(dirty).forEach(k=>{ dirty[k] = false; push(k); }); if(!linkMode) connect(); });
  }
  function changed(k){ if(!url || KEYS.indexOf(k) < 0) return; clearTimeout(timers[k]); timers[k] = setTimeout(()=>push(k), 150); }
  return { start, changed, linkMode, get on(){ return !!url; } };
})();

async function hashPw(pw, salt){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt+':'+pw));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    return 'x'+btoa(unescape(encodeURIComponent(salt+':'+pw)));
  }
}

let testViolations = { quiz:0, diagnostic:0 };
let testEvents = { quiz:[], diagnostic:[] };   // when each tab switch happened
let testNotice = '';
let proctorPaused = false;
let lastViolationAt = 0;

function activeTestKind(){
  if(currentRole==='shared') return (quizState && !quizState.done) ? 'quiz' : null;
  if(currentRole!=='student') return null;
  if(studentSection==='quiz' && quizState && !quizState.done) return 'quiz';
  if(studentSection==='diagnostic' && diagnosticState && !diagnosticState.done) return 'diagnostic';
  return null;
}
function cancelActiveTest(k){ if(k==='quiz') quizState=null; else if(k==='diagnostic') diagnosticState=null; testNotice=''; }
function confirmPaused(msg){
  proctorPaused = true;
  const ok = confirm(msg);
  setTimeout(()=>{ proctorPaused=false; }, 600);
  return ok;
}
function guardLeave(){
  const k = activeTestKind();
  if(!k) return true;
  if(!confirmPaused('A test is in progress. Leaving now will cancel it and you will have to start again from Question 1. Leave anyway?')) return false;
  testViolations[k]++;
  pushLive('tab','left the test mid-way (navigated away) — attempt cancelled', k);
  cancelActiveTest(k);
  return true;
}
function exitTest(){
  const k = activeTestKind(); if(!k) return;
  if(!confirmPaused('Exit this test? Your progress will be lost and no report will be sent.')) return;
  cancelActiveTest(k); render();
}
function handleFocusLoss(why){
  if(proctorPaused) return;
  const k = activeTestKind(); if(!k) return;
  const now = Date.now();
  if(now - lastViolationAt < 1500) return;      // tab switch fires both visibilitychange and blur
  lastViolationAt = now;
  testViolations[k]++;
  const n = testViolations[k];
  const isTab = why.indexOf('Tab')===0;
  const qn = k==='quiz' ? ((quizState && quizState.qIndex)||0)+1 : ((diagnosticState && (diagnosticState.qIndex||diagnosticState.idx))||0)+1;
  testEvents[k].push({ ts:Math.floor(now/1000), q:qn, w:isTab?'t':'b' });
  pushLive('tab', (isTab?'switched tabs':'left the test window')+' on question '+qn+' (violation #'+n+') — test restarted', k);
  testNotice = why+' — the test has been restarted from Question 1. This is violation #'+n+' and it will be shown to your teacher in your report.';
  if(k==='quiz') beginQuiz(); else beginDiagnostic();
}
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) handleFocusLoss('Tab switch detected'); });
window.addEventListener('blur', ()=>{ handleFocusLoss('You left the test window'); });
window.addEventListener('beforeunload', (e)=>{ if(activeTestKind()){ e.preventDefault(); e.returnValue=''; } });
['contextmenu','copy','cut','paste'].forEach(ev=>document.addEventListener(ev, (e)=>{ if(activeTestKind()) e.preventDefault(); }));

/* ---------- V9: camera proctoring (quizzes only; video stays on the device, nothing is recorded or uploaded) ---------- */
let camState = { stream:null, issue:null, offCount:0, events:[], cur:null, dark:0, startedAt:0 };
const CAM_TEXT = {
  denied:['Camera access needed','This quiz is proctored by camera. Allow camera access in your browser (click the camera icon in the address bar), then press the button below.'],
  off:['Your camera was turned off','The camera must stay on for the whole quiz. Turn it back on to continue.'],
  covered:['Your camera looks covered','The camera image is black or too dark. Uncover the lens or improve the lighting — this clears automatically.']
};
function camReset(){ camState = { stream:null, issue:null, offCount:0, events:[], cur:null, dark:0, startedAt:Date.now() }; }
function camElapsed(){ return Math.round((Date.now()-camState.startedAt)/1000); }
function camCloseEvent(){ if(camState.cur){ camState.cur.dur = Math.round((Date.now()-camState.cur.t0)/1000); camState.cur = null; } }
function camRaise(type){
  if(camState.issue) return;
  camState.issue = type; camState.offCount++;
  camState.cur = { type, at:camElapsed(), t0:Date.now(), dur:0 };
  camState.events.push(camState.cur);
  pushLive('cam', {off:'turned the camera off', denied:'did not allow camera access', covered:'covered the camera / image too dark'}[type]);
  render();
}
function camClear(){
  if(!camState.issue) return;
  camCloseEvent(); camState.issue = null; camState.dark = 0; render();
}
function camFinal(){
  const ev = camState.events.map(e=>({ type:e.type, at:e.at, dur: e===camState.cur ? Math.round((Date.now()-e.t0)/1000) : e.dur }));
  return { n:camState.offCount, events:ev };
}
function camSummary(r){
  const names = { off:'camera turned off', denied:'camera access denied', covered:'camera covered or too dark' };
  return (r.camEvents||[]).map(e=>(names[e.type]||e.type)+' at '+fmtClock(e.at)+(e.dur?' for '+e.dur+'s':'')).join('; ');
}
function camBox(){
  let b = document.getElementById('camBox');
  if(!b){ b = document.createElement('div'); b.id = 'camBox'; b.innerHTML = '<video id="camVid" autoplay muted playsinline></video><span id="camLbl"></span>'; document.body.appendChild(b); }
  return b;
}
function syncCamBox(on){
  const b = camBox();
  b.style.display = on ? 'block' : 'none';
  b.className = camState.issue ? 'bad' : '';
  document.getElementById('camLbl').textContent = camState.issue ? '● Camera OFF' : '● Camera on';
  const v = document.getElementById('camVid');
  if(on && camState.stream && v.srcObject!==camState.stream){ v.srcObject = camState.stream; v.play().catch(()=>{}); }
}
async function startCamera(){
  if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){ camState.unavail = true; camRaise('denied'); return; }
  const __wasPaused = proctorPaused; proctorPaused = true;      // the browser permission prompt can blur the window
  try{
    const s = await navigator.mediaDevices.getUserMedia({ video:{ width:320, height:240, facingMode:'user' }, audio:false });
    if(camState.stream) camState.stream.getTracks().forEach(t=>t.stop());
    camState.stream = s;
    const tr = s.getVideoTracks()[0];
    tr.onended = ()=>{ if(camState.stream===s && activeTestKind()==='quiz') camRaise('off'); };
    tr.onmute  = ()=>{ if(camState.stream===s && activeTestKind()==='quiz') camRaise('off'); };
    tr.onunmute = ()=>{ if(camState.stream===s && camState.issue==='off' && tr.readyState==='live') camClear(); };
    if(activeTestKind()!=='quiz'){ stopCamera(); return; }      // quiz was cancelled while the permission prompt was open
    if(camState.issue) camClear(); else render();
  }catch(e){
    camState.unavail = !navigator.mediaDevices || !window.isSecureContext || ['NotFoundError','OverconstrainedError','NotReadableError'].includes(e && e.name);
    if(camState.issue) toast('Camera still unavailable — allow access in the browser address bar'); else camRaise('denied');
  } finally { setTimeout(()=>{ proctorPaused = __wasPaused; }, 600); }
}
function stopCamera(){
  camCloseEvent();
  camState.issue = null;
  if(camState.stream){ camState.stream.getTracks().forEach(t=>{ t.onended=null; t.onmute=null; t.onunmute=null; t.stop(); }); camState.stream = null; }
  const v = document.getElementById('camVid'); if(v) v.srcObject = null;
}
function camTick(){
  const s = camState.stream; if(!s) return;
  const tr = s.getVideoTracks()[0];
  if(tr.readyState!=='live' || !tr.enabled){ camRaise('off'); return; }
  if(tr.muted){ camRaise('off'); return; }
  if(camState.issue==='off'){ camClear(); return; }
  const v = document.getElementById('camVid'); if(!v || v.readyState<2) return;
  try{
    const c = camTick.c || (camTick.c = document.createElement('canvas')); c.width = 24; c.height = 18;
    const x = c.getContext('2d', { willReadFrequently:true }); x.drawImage(v, 0, 0, 24, 18);
    const d = x.getImageData(0, 0, 24, 18).data; let sum = 0;
    for(let i=0;i<d.length;i+=4) sum += d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
    if(sum/(d.length/4) < 12){ if(++camState.dark>=4) camRaise('covered'); }
    else { camState.dark = 0; if(camState.issue==='covered') camClear(); }
  }catch(e){}
}
function camContinueWithout(){ camCloseEvent(); camState.issue = null; camState.noCam = true; render(); }
function renderCamBlock(){
  const m = CAM_TEXT[camState.issue] || CAM_TEXT.off;
  return `<div class="fs-lost" role="alertdialog" aria-modal="true"><div class="box">
    <h2>📷 ${m[0]}</h2>
    <p>${m[1]}</p>
    <p style="color:var(--rust); font-weight:600;">⚠️ This has been flagged and will be shown to your teacher. Your timer is still running.</p>
    ${camState.unavail ? '<p style="font-size:12.5px;">Camera access needs a working webcam and a secure (https) page.</p>' : ''}
    <div class="btn-row" style="justify-content:center;">${camState.issue==='covered' ? '' : '<button class="btn primary" onclick="startCamera()">Turn camera on</button>'}${camState.unavail ? '<button class="btn" onclick="camContinueWithout()">Continue without camera (stays flagged)</button>' : ''}</div></div></div>`;
}

/* ---------- V7: timer + full screen ---------- */
const SECONDS_PER_QUESTION = 60;          // time allowed per question; total = questions x 60s
let testTimer = null;                     // { kind, startAt, endAt, totalSec }
let timerHandle = null;
let fsLost = false, fsEntered = false;

function fmtClock(sec){ sec=Math.max(0,sec); const m=Math.floor(sec/60), r=sec%60; return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0'); }
function startTestTimer(kind, nQuestions, totalOverride){
  const totalSec = totalOverride || nQuestions*SECONDS_PER_QUESTION;
  testTimer = { kind, startAt:Date.now(), endAt:Date.now()+totalSec*1000, totalSec };
  if(!timerHandle) timerHandle = setInterval(tickTimer, 1000);
}
function timerRemaining(){ return testTimer ? Math.max(0, Math.ceil((testTimer.endAt-Date.now())/1000)) : 0; }
function timerClass(rem){ if(!testTimer) return ''; const f = rem/testTimer.totalSec; return (rem<=60 || f<=0.1) ? 'crit' : f<=0.25 ? 'warn' : ''; }
function tickTimer(){
  const k = activeTestKind();
  if(!k || !testTimer || testTimer.kind!==k) return;
  const rem = timerRemaining();
  const el = document.getElementById('lgTimerVal'); const box = document.getElementById('lgTimer');
  if(el) el.textContent = fmtClock(rem);
  if(box) box.className = 'test-timer '+timerClass(rem);
  const bar = document.getElementById('lgTimerBar');
  if(bar){ bar.style.width = (rem/testTimer.totalSec*100)+'%'; bar.className = timerClass(rem); }
  if(k==='quiz') camTick();
  if(rem<=0) handleTimeUp(k);
}
function handleTimeUp(k){
  if(k==='quiz') finishQuizTimeUp(); else finishDiagnosticTimeUp();
}
function enterFullscreen(){
  const el = document.documentElement;
  const fn = el.requestFullscreen || el.webkitRequestFullscreen;
  if(fn){ try{ const r = fn.call(el); if(r && r.catch) r.catch(()=>{}); }catch(e){} }
}
function leaveFullscreen(){
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  if(fe){ const fn = document.exitFullscreen || document.webkitExitFullscreen; try{ const r = fn.call(document); if(r && r.catch) r.catch(()=>{}); }catch(e){} }
}
function reenterFullscreen(){ fsLost = false; enterFullscreen(); render(); }
function onFullscreenChange(){
  const fe = document.fullscreenElement || document.webkitFullscreenElement;
  if(fe){ fsEntered = true; return; }
  const k = activeTestKind();
  if(!k || !fsEntered || proctorPaused) return;
  testViolations[k]++;
  fsLost = true;
  testNotice = 'You left full-screen mode. This is violation #'+testViolations[k]+' and it will be shown to your teacher. The timer keeps running.';
  render();
}
document.addEventListener('fullscreenchange', onFullscreenChange);
document.addEventListener('webkitfullscreenchange', onFullscreenChange);
// keyboard: 1-4 pick an answer, Enter / right arrow continues
document.addEventListener('keydown', (e)=>{
  const k = activeTestKind(); if(!k || fsLost || (k==='quiz' && camState.issue)) return;
  if(['1','2','3','4'].includes(e.key)){
    const idx = parseInt(e.key,10)-1;
    if(k==='quiz' && quizState && quizState.answered===null && quizState.cur && idx<quizState.cur.o.length) answerQuiz(idx);
    else if(k==='diagnostic' && diagnosticState && diagnosticState.answered===null && idx<diagnosticState.items[diagnosticState.idx].q.o.length) answerDiagnostic(idx);

    else if(k==='diagnostic' && diagnosticState && diagnosticState.answered!==null){ e.preventDefault(); diagnosticNext(); }
  }
});

function analyseReport(r){
  let msg;
  if(r.kind==='quiz'){
    if(r.accuracy>=80) msg = 'Strong result on '+r.topic+' ('+r.accuracy+'%). Ready for harder material.';
    else if(r.accuracy>=60) msg = 'Partial grasp of '+r.topic+' ('+r.accuracy+'%). Targeted practice on the missed questions should close the gap.';
    else msg = 'Low accuracy on '+r.topic+' ('+r.accuracy+'%). Revisit the prerequisite concept ('+r.prereq+') before retrying.';
  } else {
    msg = r.critical ? 'Foundation gap found — start remediation at '+r.critical+'. '+(r.failed.length?('Missed: '+r.failed.join(', ')+'.'):'') : 'No critical foundation gaps found across the concepts tested.';
  }
  if(r.violations>0) msg += ' Integrity note: '+r.violations+' tab/window switch'+(r.violations>1?'es were':' was')+' detected and the test restarted each time, so interpret this result with care.';
  if(r.camFlags>0) msg += ' Camera flag: the camera was off, blocked or covered '+r.camFlags+' time'+(r.camFlags>1?'s':'')+' during the test.';
  return msg;
}

function openReport(id){

}

function markAllStaffRead(){
  const all = getReports(); all.forEach(r=>{ r.seen=true; }); saveReports(all);
  const me = currentAccount();
  if(me){ const ms = getMessages(); ms.forEach(m=>{ if(myMsg(m,me)) m.read=true; }); saveMessages(ms); }
  notifRead.f1 = true; notifRead.f2 = true; render();
}
function exportReportsCSV(){

function lgOnChange(key){
  const staff = (currentRole==='instructor' || currentRole==='department');
  if(key===LG_LIVE_KEY && staff){ const l = lsGet(LG_LIVE_KEY, [])[0]; if(l && Date.now()-(l.ts||0) < 30000) toast('🚨 '+l.name+' '+l.detail); }

/* ============================================================ MESSAGING (registered student <-> registered teacher only) ============================================================ */
const LG_MSG_KEY = 'lg-messages';
let msgPeer = null;

function getMessages(){ return lsGet(LG_MSG_KEY, []); }
function saveMessages(m){ lsSet(LG_MSG_KEY, m); }
function myMsg(m, acc){ return m.toEmail===acc.email && m.toType===acc.type; }
function sentByMe(m, acc){ return m.fromEmail===acc.email && m.fromType===acc.type; }
function contactsFor(acc){
  // students can only reach registered staff; staff can only reach registered students
  const want = acc.type==='student' ? 'staff' : 'student';
  return getAccounts().filter(a=>a.type===want);
}
function threadFor(acc, peerEmail){
  return getMessages().filter(m=> (myMsg(m,acc) && m.fromEmail===peerEmail) || (sentByMe(m,acc) && m.toEmail===peerEmail))
    .sort((a,b)=>new Date(a.at)-new Date(b.at));
}
function unreadFor(acc){ return acc ? getMessages().filter(m=>myMsg(m,acc) && !m.read) : []; }
function resolvePeer(acc){
  const list = contactsFor(acc);
  if(!list.some(c=>c.email===msgPeer)) msgPeer = list.length ? list[0].email : null;
  return msgPeer;
}
function markThreadRead(acc, peerEmail){
  const all = getMessages(); let changed = false;
  all.forEach(m=>{ if(myMsg(m,acc) && m.fromEmail===peerEmail && !m.read){ m.read = true; changed = true; } });
  if(changed) saveMessages(all);
}
function ensureThreadRead(){
  const acc = currentAccount(); if(!acc) return;
  const viewing = (currentRole==='student' && studentSection==='messages') || (currentRole==='instructor' && instructorSection==='messages');
  if(!viewing) return;
  const p = resolvePeer(acc);
  if(p) markThreadRead(acc, p);
}
function postMessage(toEmail, text, kind, reportId){
  const me = currentAccount();
  if(!me){ toast('Please sign in first'); return false; }
  const toType = me.type==='student' ? 'staff' : 'student';
  const to = getAccounts().find(a=>a.email===toEmail && a.type===toType);
  if(!to){ toast('That account is not registered'); return false; }
  text = (text||'').trim();
  if(!text){ toast('Write a message first'); return false; }
  const all = getMessages();
  all.push({ id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), at:new Date().toISOString(),
    fromEmail:me.email, fromType:me.type, fromName:me.name, toEmail:to.email, toType, toName:to.name,
    text, kind:kind||'message', reportId:reportId||null, read:false });
  saveMessages(all);
  return true;
}
function selectPeer(email){ msgPeer = email; const acc = currentAccount(); if(acc) markThreadRead(acc, email); render(); }
function openThread(email){
  const acc = currentAccount(); if(!acc) return;
  if(!guardLeave()) return;
  msgPeer = email; notifOpen = false;
  if(acc.type==='student'){ currentRole='student'; studentSection='messages'; }
  else { currentRole='instructor'; instructorSection='messages'; }
  markThreadRead(acc, email); render();
}
function sendThreadMessage(){
  const el = document.getElementById('msgInput');
  if(!el || !msgPeer) return;
  if(postMessage(msgPeer, el.value, 'message')){ el.value=''; render(); toast('Message sent'); }
}
function peerLabel(a){ return a.type==='student' ? (a.roll ? 'Student · '+a.roll : 'Student') : (a.staffRole==='department' ? 'Department Head' : 'Teacher'); }

function renderMessages(){
  const me = currentAccount(); if(!me) return '';
  const contacts = contactsFor(me);
  const peerEmail = resolvePeer(me);
  const msgs = getMessages();
  const isStu = me.type==='student';
  const title = isStu ? 'Message your teacher' : 'Messages with students';
  const lead = isStu ? 'Only teachers with a registered staff account appear here. Teachers can send you notifications about your tests, and you can reply or ask for help.'
                     : 'Only students with a registered student account appear here. Use this to follow up on a test result or reply to a student.';
  if(!contacts.length){
    return `<div class="section-title"><h1>💬 ${title}</h1><p>${lead}</p></div>
      <div class="panel"><p class="empty-note" style="margin:0;">${isStu ? 'No teacher has created a staff account yet, so there is nobody to message.' : 'No student has created an account yet, so there is nobody to message.'}</p></div>`;
  }
  const list = contacts.map(c=>{
    const unread = msgs.filter(m=>myMsg(m,me) && m.fromEmail===c.email && !m.read).length;
    const last = threadFor(me, c.email).slice(-1)[0];
    return `<button class="msg-contact ${c.email===peerEmail?'active':''}" onclick="selectPeer('${esc(c.email)}')">
      <span><span class="cn">${esc(c.name)}</span><br><span class="cs">${last ? esc(last.text.slice(0,34))+(last.text.length>34?'…':'') : peerLabel(c)}</span></span>
      ${unread?`<span class="msg-unread">${unread}</span>`:''}</button>`;
  }).join('');
  const peer = contacts.find(c=>c.email===peerEmail);
  const thread = threadFor(me, peerEmail);
  const bubbles = thread.length ? thread.map(m=>{
    const mine = sentByMe(m, me);
    return `<div class="chat-msg ${mine?'user':'bot'}">${m.kind==='notice'?'<span class="msg-notice-tag">🔔 Test notification</span><br>':''}${esc(m.text).replace(/\n/g,'<br>')}<span class="msg-time">${mine?'You':esc(m.fromName)} · ${fmtDate(m.at)}</span></div>`;
  }).join('') : `<p class="empty-note">No messages yet. Say hello below.</p>`;
  return `
    <div class="section-title"><h1>💬 ${title}</h1><p>${lead}</p></div>
    <div class="msg-layout">
      <div>${list}</div>
      <div class="panel" style="margin-top:0;">
        <div class="panel-head"><h2>${esc(peer.name)}</h2><span class="sub">${peerLabel(peer)}</span></div>
        <div class="msg-thread" id="msgThread">${bubbles}</div>
        <div class="msg-compose">
          <textarea id="msgInput" placeholder="${isStu?'Write to your teacher…':'Write to the student…'}"></textarea>
          <button class="btn primary" onclick="sendThreadMessage()">Send message</button>
        </div>
      </div>
    </div>`;
}

/* ============================================================ REAL PER-STUDENT TEST ANALYSIS ============================================================ */
function reportKey(r){ return (r.studentEmail||'')+'|'+r.studentName; }
function analyseDetailed(r){
  const all = getReports();
  const mine = all.filter(x=>reportKey(x)===reportKey(r) && x.kind===r.kind).sort((a,b)=>new Date(a.at)-new Date(b.at));
  const idx = mine.findIndex(x=>x.id===r.id);
  const prev = idx>0 ? mine[idx-1] : null;
  const findings = [], recs = [];
  const level = r.accuracy>=80 ? {label:'Strong',color:'pine'} : r.accuracy>=60 ? {label:'Developing',color:'amber'} : {label:'Needs support',color:'rust'};
  let diff = null, headline = '';

  if(r.kind==='quiz'){
    const log = r.log||[];
    diff = {};
    ['easy','medium','hard'].forEach(d=>{ const L = log.filter(x=>x.d===d); diff[d] = { right:L.filter(x=>x.correct).length, total:L.length }; });
    const wrong = log.filter(x=>!x.correct);
    headline = r.score+' of '+r.total+' correct on '+r.topic+' ('+r.accuracy+'%).';
    if(diff.easy.total && diff.easy.right<diff.easy.total) findings.push('Missed '+(diff.easy.total-diff.easy.right)+' easy question(s) — this points to a basics gap, not just difficulty.');
    if(diff.hard.total && diff.hard.right===diff.hard.total && wrong.length) findings.push('Got every hard question right but dropped easier ones — likely careless errors or rushing.');
    if(diff.hard.total && diff.hard.right===0 && diff.easy.right===diff.easy.total) findings.push('Comfortable with basics but not yet with hard questions on this topic.');
    if(wrong.length>=3) findings.push('Repeated mistakes ('+wrong.length+' wrong) suggest the underlying idea is not yet secure.');
    if(wrong.length) findings.push('Questions missed: '+wrong.map(x=>'“'+x.q+'”').join('; '));
    if(!wrong.length) findings.push('No incorrect answers in this attempt.');
    if(r.accuracy<60) recs.push('Revisit the prerequisite concept ('+r.prereq+') before retrying '+r.topic+'.');
    if(wrong.length) recs.push('Re-do the '+wrong.length+' missed question(s) with the correct answers in view, then retake the quiz.');
    if(r.accuracy>=80) recs.push('Ready to move on to harder material on '+r.topic+'.');
    // compare with class on same topic (other students only)
    const peers = all.filter(x=>x.kind==='quiz' && x.topic===r.topic && reportKey(x)!==reportKey(r));
    if(peers.length){
      const avg = Math.round(peers.reduce((a,x)=>a+x.accuracy,0)/peers.length);
      findings.push('Class average on '+r.topic+' (other students, '+peers.length+' attempt'+(peers.length>1?'s':'')+') is '+avg+'% — this student is '+(r.accuracy>avg?'above':r.accuracy<avg?'below':'level with')+' it.');
    }
  } else {
    if(r.topicResults){
      const names = Object.keys(r.topicResults);
      headline = r.score+' of '+r.total+' questions correct ('+r.accuracy+'%) across '+names.length+' topic'+(names.length>1?'s':'')+'.';
      findings.push('Accuracy by topic: '+names.map(n=>n+' '+r.topicResults[n].pct+'% ('+r.topicResults[n].right+'/'+r.topicResults[n].total+')').join('; ')+'.');
      const dl = ['easy','medium','hard'].map(k=>{ const L=(r.log||[]).filter(x=>x.d===k); return L.length ? k+' '+L.filter(x=>x.correct).length+'/'+L.length : null; }).filter(Boolean);
      if(dl.length) findings.push('By difficulty: '+dl.join(', ')+'.');
    } else headline = 'Passed '+r.score+' of '+r.total+' foundation concepts ('+r.accuracy+'%).';
    const g = r.groups||{};
    if(r.failed && r.failed.length) findings.push('Missed concepts: '+r.failed.join(', ')+'.');
    if(g['Critical Foundation'] && g['Critical Foundation'].length) findings.push('Critical foundation gap: '+g['Critical Foundation'].join(', ')+'.');
    if(g['Weak'] && g['Weak'].length) findings.push('Weak: '+g['Weak'].join(', ')+'.');
    if(g['Strong'] && g['Strong'].length) findings.push('Solid on: '+g['Strong'].join(', ')+'.');
    if(r.critical) recs.push('Start remediation at '+r.critical+' — later topics build on it.');
    if(r.failed && r.failed.length>=3) recs.push('Several foundations missed — suggest a short 1:1 review instead of more practice alone.');
    if(!r.failed || !r.failed.length) recs.push('No foundation gaps found across the tested concepts.');
    const peers = all.filter(x=>x.kind==='diagnostic' && reportKey(x)!==reportKey(r));
    if(peers.length && r.failed && r.failed.length){
      const common = r.failed.filter(n=>peers.some(p=>(p.failed||[]).includes(n)));
      if(common.length) findings.push('Other students also missed: '+common.join(', ')+' — may be worth a class-level review.');
    }
  }
  if(prev){
    const d = r.accuracy - prev.accuracy;
    findings.push('Compared with the previous '+kindLabel(r.kind).toLowerCase()+' ('+prev.accuracy+'%), this is '+(d>0?'up '+d:d<0?'down '+Math.abs(d):'unchanged')+(d?' points':'')+'.');
  } else findings.push('First '+kindLabel(r.kind).toLowerCase()+' on record for this student — no earlier attempt to compare with.');
  if(r.durationSec && r.total){
    const per = Math.round(r.durationSec/r.total*10)/10;
    findings.push('Time taken: '+r.durationSec+'s in total, about '+per+'s per question.');
    if(per<6 && r.accuracy<70) findings.push('Answered very quickly with low accuracy — possible guessing.');
  }
  if(r.timedOut) findings.push('The timer ran out before every question was answered; the remaining questions were counted as incorrect — this may point to slow recall rather than a concept gap.');
  if(r.violations>0) findings.push('Integrity: '+r.violations+' tab/window switch'+(r.violations>1?'es':'')+' recorded; the test restarted each time, so read this score with care.');
  if(r.camFlags>0) findings.push('Camera flagged '+r.camFlags+' time'+(r.camFlags>1?'s':'')+': '+camSummary(r)+'. The student was warned and the timer kept running, so read this score with care.');
  if(r.violEv && r.violEv.length) findings.push('Tab activity: the student '+violSummary(r)+'. Each switch restarted the test.');
  return { level, headline, findings, recs, diff, history: mine.map(x=>x.accuracy), isBad: r.accuracy<60 };
}

function renderAnalysis(r){
  const a = analyseDetailed(r);
  return `
    <div class="an-head"><span class="pill ${a.level.color}">${a.level.label}</span><span class="hl">${esc(a.headline)}</span></div>
    ${a.diff ? `<div class="an-box"><h4>Accuracy by difficulty</h4><div class="an-diff">${['easy','medium','hard'].map(d=>`<div>${d}<b>${a.diff[d].total?a.diff[d].right+'/'+a.diff[d].total:'—'}</b></div>`).join('')}</div></div>` : ''}
    <div class="an-box"><h4>What the data shows</h4><ul>${a.findings.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
    <div class="an-box"><h4>Suggested teacher actions</h4><ul>${a.recs.map(f=>`<li>${esc(f)}</li>`).join('')}</ul></div>
    ${a.history.length>1 ? `<div class="an-box"><h4>This student's ${kindLabel(r.kind).toLowerCase()} history</h4><div style="font-size:13px;">${a.history.map(v=>v+'%').join(' → ')}</div></div>` : ''}`;
}

function defaultNoticeText(r){
  const first = (r.studentName||'there').split(' ')[0];
  const a = analyseDetailed(r);
  let body = 'Hi '+first+', I reviewed your '+kindLabel(r.kind)+(r.topic?' on '+r.topic:'')+' ('+r.accuracy+'%). ';
  if(r.kind==='quiz') body += a.isBad ? 'This topic needs more work — please revisit '+r.prereq+' first and then retry the quiz. ' : 'You are on the right track; a little more practice will help. ';
  else body += r.critical ? 'Your foundation in '+r.critical+' needs attention first. ' : 'Please review the concepts you missed. ';
  if(r.violations>0) body += 'Please also stay on the test window — tab switches were recorded. ';
  if(r.camFlags>0) body += 'Your camera was off or blocked during the quiz and this was flagged — please keep it on next time. ';
  body += 'Reply here if you would like help or want to book a time to go through it.';
  return body;
}
function renderNotifyBox(r){
  const stu = getAccounts().find(a=>a.email===r.studentEmail && a.type==='student');
  if(!stu) return `<div class="notify-box ok"><h4>Notify student</h4><p class="empty-note" style="margin:0;">This student's account is no longer registered, so a notification can't be delivered.</p></div>`;
  const bad = r.accuracy<60 || (r.kind==='diagnostic' && (r.failed||[]).length>=3);
  return `<div class="notify-box ${bad?'':'ok'}">
    <h4>${bad ? '⚠️ This result needs support — notify '+esc(stu.name)+'?' : 'Send a note to '+esc(stu.name)}</h4>
    <p style="font-size:12px; color:var(--ink-soft); margin:0;">Delivered to ${esc(stu.name)}'s notifications and Messages (student can reply). Edit the text before sending.</p>
    <textarea id="notice-${r.id}">${esc(defaultNoticeText(r))}</textarea>
    <div class="btn-row"><button class="btn ${bad?'primary':''}" onclick="sendReportNotice('${r.id}')">🔔 Send notification</button>
      <button class="btn" onclick="viewRegisteredStudent('${esc(stu.email)}')">👤 View student profile</button>
      <button class="btn ghost" onclick="openThread('${esc(stu.email)}')">Open conversation</button></div>
    ${r.notifiedAt ? `<div class="sent-note" style="margin-top:10px;">✅ Last notified ${fmtDate(r.notifiedAt)}</div>` : ''}
  </div>`;
}
function sendReportNotice(id){
  const all = getReports(); const r = all.find(x=>x.id===id); if(!r) return;
  const el = document.getElementById('notice-'+id);
  if(postMessage(r.studentEmail, el ? el.value : defaultNoticeText(r), 'notice', id)){
    r.notifiedAt = new Date().toISOString(); saveReports(all); render(); toast('Notification sent to '+r.studentName);
  }
}

function renderTestReports(){
  const all = getReports();
  const list = all.filter(r=> reportFilter==='all' ? true : reportFilter==='flagged' ? (r.violations>0 || r.camFlags>0) : r.kind===reportFilter);
  const quizzes = all.filter(r=>r.kind==='quiz');
  const avg = quizzes.length ? Math.round(quizzes.reduce((a,r)=>a+r.accuracy,0)/quizzes.length) : null;
  const flagged = all.filter(r=>r.violations>0 || r.camFlags>0).length;
  const unseen = all.filter(r=>!r.seen).length;

  const topicMap = {}; quizzes.forEach(r=>{ (topicMap[r.topic] = topicMap[r.topic] || []).push(r.accuracy); });
  const failMap = {}; all.filter(r=>r.kind==='diagnostic').forEach(r=>(r.failed||[]).forEach(n=>{ failMap[n]=(failMap[n]||0)+1; }));
  const topicRows = Object.entries(topicMap).map(([t,a])=>[t, Math.round(a.reduce((x,y)=>x+y,0)/a.length), a.length]).sort((x,y)=>x[1]-y[1]);
  const failRows = Object.entries(failMap).sort((x,y)=>y[1]-x[1]).slice(0,6);

  const filters = [['all','All'],['quiz','Adaptive Quiz'],['diagnostic','Diagnostic'],['flagged','⚠️ Flagged']];
  const filterRow = `<div class="filter-row">${filters.map(([k,l])=>`<button class="${reportFilter===k?'active':''}" onclick="setReportFilter('${k}')">${l}</button>`).join('')}</div>`;

  const card = (r)=>{
    const open = reportOpenId===r.id;
    let detail = '';
    if(open){
      const qTable = (r.log && r.log.length) ? `<div class="rep-qrow h"><div>Question</div><div>Student answered</div><div>Correct answer</div><div></div></div>` +
        r.log.map(x=>`<div class="rep-qrow"><div>${x.topic?'<small style="color:var(--ink-soft)">'+esc(x.topic)+'</small><br>':''}${esc(x.q)}</div><div>${esc(x.chosen)}</div><div>${esc(x.right)}</div><div>${x.correct?'✅':'❌'}</div></div>`).join('') : '';
      const gTable = r.groups ? `<div class="diag-groups">${Object.entries(r.groups).map(([label,items])=>`<div class="diag-col"><h4>${label}</h4>${items.length?items.map(n=>`<span class="dchip">${esc(n)}${r.topicResults&&r.topicResults[n]?' · '+r.topicResults[n].pct+'%':''}</span>`).join(''):`<span class="empty-note">None</span>`}</div>`).join('')}</div>` : '';
      detail = gTable + qTable;
      detail = `<div style="margin-top:14px;">
        ${renderAnalysis(r)}
        <div class="an-box" style="margin-top:12px;"><h4>${r.kind==='quiz'?'Answer review':'Concept groups'}</h4>${detail}</div>
        ${renderNotifyBox(r)}
        ${!r.seen?`<div class="btn-row" style="margin-top:12px;"><button class="btn" onclick="markReportSeen('${r.id}')">Mark reviewed</button></div>`:''}
      </div>`;
    }
    return `<div class="panel">
      <div class="rep-head" onclick="toggleReport('${r.id}')">
        <div>
          <div class="who">${esc(r.studentName)}${!r.seen?'<span class="chip-new">NEW</span>':''}${r.violations?`<span class="chip-flag">🪟 Switched tab ×${r.violations}</span>`:''}${r.camFlags?`<span class="chip-flag">📷 Camera off ×${r.camFlags}</span>`:''}${(!r.violations&&!r.camFlags)?'<span class="chip-ok">Clean</span>':''}${r.accuracy<60?'<span class="chip-flag">Needs support</span>':''}${r.notifiedAt?'<span class="chip-ok">🔔 Notified</span>':''}</div>
          <div class="meta">${esc(r.studentEmail)}${r.roll?' · '+esc(r.roll):''} · ${kindLabel(r.kind)}${r.topic?' · '+esc(r.topic):''} · ${fmtDate(r.at)}</div>
        </div>
        <div style="text-align:right;"><b style="font-family:'Newsreader',serif; font-size:22px;">${r.accuracy}%</b><div class="meta">${r.score}/${r.total} correct</div></div>
      </div>${detail}
    </div>`;
  };

  return `
    <div class="section-title"><h1>📋 Test Reports</h1><p>Reports sent automatically by students when they finish a proctored test. Click a report to see the answers and the analysis.</p></div>
    ${renderLiveAlerts()}
    <div class="rep-tiles">
      <div class="rep-tile"><b>${all.length}</b><span>Reports received</span></div>
      <div class="rep-tile"><b>${unseen}</b><span>Not yet reviewed</span></div>
      <div class="rep-tile"><b>${avg===null?'—':avg+'%'}</b><span>Average quiz accuracy</span></div>
      <div class="rep-tile"><b>${flagged}</b><span>Flagged (tab switch / camera)</span></div>
    </div>
    ${all.length ? `
      <div class="panel">
        <div class="panel-head"><h2>Class analysis</h2><button class="btn" onclick="exportReportsCSV()">Export CSV</button></div>
        ${topicRows.length ? `<h4 style="margin:6px 0 8px; font-size:12px; color:var(--ink-soft);">Average quiz accuracy by topic (lowest first)</h4>${topicRows.map(([t,a,n])=>`<div style="margin-bottom:10px; font-size:12.5px;"><div style="display:flex; justify-content:space-between;"><span>${esc(t)} <span style="color:var(--ink-soft);">(${n} attempt${n>1?'s':''})</span></span><b>${a}%</b></div><div class="rep-bar"><i style="width:${a}%; background:${a<60?'var(--rust)':a<80?'var(--amber)':'var(--pine)'};"></i></div></div>`).join('')}` : ''}
        ${failRows.length ? `<h4 style="margin:14px 0 8px; font-size:12px; color:var(--ink-soft);">Concepts most often missed in diagnostics</h4>${failRows.map(([n,c])=>`<span class="dchip">${esc(n)} · ${c}</span>`).join('')}` : ''}
        ${!topicRows.length && !failRows.length ? '<p class="empty-note">Not enough data yet.</p>' : ''}
      </div>

function answerQuiz(optIdx){
  if(!quizState || quizState.answered!==null) return;
  const q = quizState.cur;
  const correct = optIdx===q.a;
  testNotice='';
  quizState.answered = optIdx;
  quizState.total++;
  if(correct){ quizState.score++; quizState.correctStreak++; quizState.wrongStreak=0; } else { quizState.wrongStreak++; quizState.correctStreak=0; }
  quizState.log.push({ q:q.q, correct, chosen:q.o[optIdx], right:q.o[q.a], d:q.d });
  render();
}
function nextQuizQuestion(){
  if(!quizState) return;
  const order = quizState.order;
  const idx = quizState.log.length;
  if(idx>=order.length){ quizState.done=true; quizState.durationSec=Math.round((Date.now()-quizState.startedAt)/1000); submitTestReport('quiz'); render(); return; }
  let nextDiff = order[idx];
  if(quizState.wrongStreak>=2 && nextDiff!=='easy') nextDiff='easy';
  quizState.cur = takeQuizQuestion(nextDiff);
  quizState.difficulty = quizState.cur.d;
  quizState.qIndex = idx;
  quizState.answered = null;
  render();
}
function restartQuiz(){ startQuiz(); }
// timer ran out: unanswered questions are logged as incorrect, then the report is sent
function finishQuizTimeUp(){
  if(!quizState || quizState.done) return;
  const unanswered = (q)=>({ q:q.q, correct:false, chosen:'(not answered)', right:q.o[q.a], d:q.d });
  if(quizState.answered===null && quizState.cur){ quizState.log.push(unanswered(quizState.cur)); quizState.total++; }
  while(quizState.log.length < quizState.order.length){
    const q = takeQuizQuestion(quizState.order[quizState.log.length]); if(!q) break;
    quizState.log.push(unanswered(q)); quizState.total++;
  }
  quizState.done = true; quizState.timedOut = true;
  quizState.durationSec = testTimer ? testTimer.totalSec : Math.round((Date.now()-quizState.startedAt)/1000);
  submitTestReport('quiz'); render();
}
function finishDiagnosticTimeUp(){
  const d = diagnosticState; if(!d || d.done) return;
  const from = d.answered===null ? d.idx : d.idx+1;
  for(let i=from;i<d.items.length;i++){
    const it = d.items[i], q = it.q;
    const t = d.tally[it.cid] || (d.tally[it.cid] = { right:0, total:0 }); t.total++;
    d.log.push({ q:q.q, correct:false, chosen:'(not answered)', right:q.o[q.a], d:q.d, topic:CONCEPT_MAP[it.cid].name });
  }
  d.done = true; d.timedOut = true;
  d.durationSec = testTimer ? testTimer.totalSec : Math.round((Date.now()-d.startedAt)/1000);
  submitTestReport('diagnostic'); render();
}

        <p style="font-size:11px; color:var(--ink-soft); margin:10px 0 0;">Confidence is a simple demo calculation from this session's answers — not a certified measure of ability.</p>
        ${renderReportSentNote('quiz')}<div class="btn-row" style="margin-top:14px;"><button class="btn primary" onclick="restartQuiz()">Retake this topic</button><button class="btn" onclick="quizChooseAnother()">Choose another topic</button></div>
      </div>`;
  }
  const q = quizState.cur;
  const answered = quizState.answered;
  return `
    <div class="section-title"><h1>${quizState.shared&&sharedCtx ? '📝 '+esc(sharedCtx.test.title) : '📝 AI Adaptive Quiz'}</h1><p>Student: <b>${esc(quizState.shared&&sharedCtx ? sharedCtx.name : loggedName())}</b> · Topic: ${CONCEPT_MAP[quizState.conceptId].name}</p></div>
    <div class="panel">
      ${renderTestBanner('quiz')}
      <div class="quiz-head">
        <div class="quiz-progress-dots">${quizState.order.map((d,i)=>`<span class="${i<quizState.log.length?'done':i===quizState.log.length?'current':''}"></span>`).join('')}</div>
        <div class="quiz-meta">
          <div>Question <b>${quizState.log.length+1}/${quizState.order.length}</b></div>
          <div>Difficulty <b>${quizState.difficulty}</b></div>
          <div>Score <b>${quizState.score}/${quizState.total}</b></div>
        </div>
      </div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-options">
        ${q.o.map((opt,i)=>{
          let cls='quiz-opt';
          if(answered!==null){ if(i===q.a) cls+=' correct'; else if(i===answered) cls+=' incorrect'; }
          return `<button class="${cls}" ${answered!==null?'disabled':''} onclick="answerQuiz(${i})"><span class="qkey">${i+1}</span>${opt}</button>`;
        }).join('')}
      </div>
      ${answered!==null ? `
        <div class="quiz-feedback ${answered===q.a?'correct':'incorrect'}">
          ${answered===q.a ? 'Correct.' : 'Not quite.'} ${quizState.wrongStreak>=2 ? 'Recommended: revisit the prerequisite concept before continuing.' : ''}
        </div>
        <button class="btn primary" onclick="nextQuizQuestion()">Next</button>
      ` : ''}
    </div>
  `;
}

function renderGoalsGamification(student){
  const goal = deriveGoal(student, goalOverrides[student.id]);

  const cons = deriveConsistency(student);
  const classAvg = Math.round(STUDENTS.reduce((a,s)=>a+overallReadiness(s.mastery),0)/STUDENTS.length);
  const myAvg = overallReadiness(student.mastery);
  return `
