        ${badges.map(b=>`<div class="badge-card ${b.earned?'':'badge-locked'}"><span class="bi">${b.icon}</span><h4>${b.name}</h4><p>${b.desc}</p></div>`).join('')}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Study Consistency</h2><span class="sub">Current streak: ${cons.streak} day(s) · Weekly consistency: ${cons.weeklyPct}%</span></div>
      <div class="cal-row">${cons.days.map(d=>`<div class="cal-cell"><div class="box ${d.status}"></div><div class="lbl">${d.day}</div></div>`).join('')}</div>
    </div>

    <div class="panel">
      <div class="panel-head"><h2>Class Benchmark</h2><span class="sub">A learning benchmark, not a public ranking</span></div>
      <div class="bench-row"><div class="bl">Your mastery</div><div class="bench-track"><div class="bench-fill" style="width:${myAvg}%; background:${bucketColor(myAvg)}"></div><div class="bench-marker" style="left:${goal.target}%;" title="Target"></div></div><div class="pct">${myAvg}%</div></div>
      <div class="bench-row"><div class="bl">Class average</div><div class="bench-track"><div class="bench-fill" style="width:${classAvg}%; background:#B9C3BE"></div></div><div class="pct">${classAvg}%</div></div>
      <p style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">Vertical mark shows your target readiness of ${goal.target}%.</p>
    </div>
  `;
}

  sorting:[{ t:'Insertion sort', p:'Sort an integer array of length n in ascending order using insertion sort.', h:'Take each element and shift larger elements right to make room.', s:'for (int i = 1; i < n; i++) {\n    int key = a[i], j = i - 1;\n    while (j >= 0 && a[j] > key) { a[j+1] = a[j]; j--; }\n    a[j+1] = key;\n}' },
           { t:'First occurrence with binary search', p:'In a sorted array with duplicates, return the index of the first occurrence of key (or -1).', h:'When you find key, keep searching to the left.', s:'int lo=0, hi=n-1, ans=-1;\nwhile (lo <= hi) {\n    int mid = lo + (hi-lo)/2;\n    if (a[mid] == key) { ans = mid; hi = mid - 1; }\n    else if (a[mid] < key) lo = mid + 1;\n    else hi = mid - 1;\n}\nreturn ans;' }],

  heaps:[{ t:'K largest elements', p:'Return the k largest values from an array of n numbers.', h:'Keep a min-heap of size k; pop the smallest whenever it grows past k.', s:'priority_queue<int, vector<int>, greater<int>> pq;\nfor (int x : a) {\n    pq.push(x);\n    if (pq.size() > k) pq.pop();\n}\n// pq now holds the k largest' },
         { t:'Merge sorted lists', p:'Merge k sorted lists into one sorted list.', h:'Put the first element of each list in a min-heap and repeatedly take the smallest.', s:'// heap of (value, listIndex, position)\nwhile (!pq.empty()) {\n    auto [v, li, pos] = pq.top(); pq.pop();\n    out.push_back(v);\n    if (pos + 1 < lists[li].size())\n        pq.push({lists[li][pos+1], li, pos+1});\n}' }],
  backtrack:[{ t:'All subsets', p:'Print every subset of an array of distinct integers.', h:'For each element decide: include it or skip it.', s:'void go(int i, vector<int>& cur) {\n    if (i == n) { print(cur); return; }\n    go(i + 1, cur);            // skip\n    cur.push_back(a[i]);       // choose\n    go(i + 1, cur);\n    cur.pop_back();            // un-choose\n}' },
             { t:'N-Queens count', p:'Count the ways to place n queens on an n×n board so none attack each other.', h:'Place one queen per row; track used columns and diagonals to prune.', s:'int solve(int r) {\n    if (r == n) return 1;\n    int total = 0;\n    for (int c = 0; c < n; c++) {\n        if (col[c] || d1[r+c] || d2[r-c+n]) continue;\n        col[c] = d1[r+c] = d2[r-c+n] = true;\n        total += solve(r + 1);\n        col[c] = d1[r+c] = d2[r-c+n] = false;\n    }\n    return total;\n}' }],

let resView = null;

function openResource(type, cid){
  resView = { type, cid, i:0, answers:{}, shown:{}, code:{}, flip:false, done:false };
  render();
}
function closeResource(){ resView = null; render(); }
function resSet(k,v){ resView[k]=v; render(); }
function resToggle(key){ resView.shown[key] = !resView.shown[key]; render(); }
function resAnswer(qi, oi){
  if(resView.answers[qi]!==undefined) return;
  resView.answers[qi] = oi; render();
}
function resCode(i, v){ resView.code[i] = v; }   // keep typed text without re-rendering
function resFlip(){ resView.flip = !resView.flip; render(); }
function resCard(d, n){ resView.i = (resView.i + d + n) % n; resView.flip = false; render(); }
function resMiniNext(n){ if(resView.i+1>=n){ resView.done = true; } else { resView.i++; } render(); }
function resMiniRestart(){ resView.i=0; resView.answers={}; resView.done=false; render(); }

function resQuestionHTML(q, qi, picked, onclickFn){
  return `<div class="quiz-q">${qi!==null?(qi+1)+'. ':''}${esc(q.q)}</div>
    <div class="quiz-options">${q.o.map((opt,i)=>{
      let cls='quiz-opt';
      if(picked!==undefined){ if(i===q.a) cls+=' correct'; else if(i===picked) cls+=' incorrect'; }
      return `<button class="${cls}" ${picked!==undefined?'disabled':''} onclick="${onclickFn}(${qi},${i})">${esc(opt)}</button>`;
    }).join('')}</div>
    ${picked!==undefined ? `<div class="quiz-feedback ${picked===q.a?'correct':'incorrect'}">${picked===q.a?'Correct.':'Not quite.'} The right answer is: <b>${esc(q.o[q.a])}</b></div>` : ''}`;
}

function renderResourceBody(){
  const v = resView, cid = v.cid, c = CONCEPT_MAP[cid];
  if(v.type==='notes'){
    const n = RES_NOTES[cid];
    return `<p style="font-size:14px; line-height:1.65; margin-top:0;">${esc(n.summary)}</p>
      <div class="an-box"><h4>Key points</h4><ul>${n.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
      <div class="an-box"><h4>Example</h4><pre class="res-code">${esc(n.code)}</pre></div>
      <div class="an-box"><h4>Common mistakes</h4><ul>${n.mistakes.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>
      <div class="btn-row"><button class="btn" onclick="openResource('flash','${cid}')">🧠 Revise with flashcards</button><button class="btn" onclick="openResource('practice','${cid}')">📝 Practice questions</button></div>`;
  }
  if(v.type==='coding'){
    return RES_CODING[cid].map((p,i)=>`<div class="an-box">
      <h4>Problem ${i+1} — ${esc(p.t)}</h4>
      <p style="font-size:13.5px; margin:0 0 8px;">${esc(p.p)}</p>
      <textarea class="res-answer" placeholder="Write your solution here…" oninput="resCode(${i}, this.value)">${esc(v.code[i]||'')}</textarea>
      <div class="btn-row"><button class="btn small" onclick="resToggle('h${i}')">${v.shown['h'+i]?'Hide hint':'💡 Show hint'}</button><button class="btn small" onclick="resToggle('s${i}')">${v.shown['s'+i]?'Hide solution':'✅ Show solution'}</button></div>
      ${v.shown['h'+i]?`<div class="cc-insight">${esc(p.h)}</div>`:''}
      ${v.shown['s'+i]?`<pre class="res-code" style="margin-top:10px;">${esc(p.s)}</pre>`:''}
    </div>`).join('') + `<p class="empty-note">Try it yourself first — the hint is there if you get stuck, and the solution is one way to solve it.</p>`;
  }
  if(v.type==='practice'){
    const qs = questionsFor(cid);
    const answered = Object.keys(v.answers).length;
    const right = qs.filter((q,i)=>v.answers[i]===q.a).length;
    return `<p class="empty-note" style="margin-top:0;">${answered}/${qs.length} answered · ${right} correct. Answers are shown straight away — this is practice, nothing is sent to your teacher.</p>` +
      qs.map((q,i)=>`<div class="an-box">${resQuestionHTML(q,i,v.answers[i],'resAnswer')}</div>`).join('') +
      `<div class="btn-row"><button class="btn" onclick="resSet('answers',{})">↻ Try again</button></div>`;
  }
  if(v.type==='flash'){
    const cards = RES_FLASH[cid];
    const card = cards[v.i % cards.length];
    return `<p class="empty-note" style="margin-top:0;">Card ${v.i+1} of ${cards.length} — click the card to flip it.</p>
      <div class="flashcard ${v.flip?'flipped':''}" onclick="resFlip()" role="button" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();resFlip();}">
        <span class="fc-side">${v.flip?'Answer':'Question'}</span>
        <div class="fc-text">${esc(v.flip?card[1]:card[0])}</div>
      </div>
      <div class="btn-row" style="justify-content:center; margin-top:14px;"><button class="btn" onclick="resCard(-1,${cards.length})">← Previous</button><button class="btn primary" onclick="resFlip()">Flip</button><button class="btn" onclick="resCard(1,${cards.length})">Next →</button></div>`;
  }
  if(v.type==='miniquiz'){
    const qs = questionsFor(cid);
    if(v.done){
      const right = qs.filter((q,i)=>v.answers[i]===q.a).length;
      const pct = Math.round(right/qs.length*100);
      return `<div style="text-align:center; padding:10px 0;"><div style="font-family:'Newsreader',serif; font-size:44px; font-weight:600;">${right}/${qs.length}</div>
        <p style="font-size:14px;">${pct>=80?'Great — this concept looks solid.':pct>=50?'Getting there — review the notes and try again.':'Worth revisiting the beginner notes first, then retry.'}</p>
        <div class="btn-row" style="justify-content:center;"><button class="btn primary" onclick="resMiniRestart()">Retake</button><button class="btn" onclick="openResource('notes','${cid}')">📖 Open notes</button></div>
        <p class="empty-note">Practice only — mini quizzes aren’t proctored and are not sent to your teacher.</p></div>`;
    }
    const q = qs[v.i];
    return `<div class="quiz-progress-dots">${qs.map((_,i)=>`<span class="${i<v.i?'done':i===v.i?'current':''}"></span>`).join('')}</div>
      ${resQuestionHTML(q, v.i, v.answers[v.i], 'resAnswer')}
      ${v.answers[v.i]!==undefined ? `<button class="btn primary" onclick="resMiniNext(${qs.length})">${v.i+1>=qs.length?'See result':'Next'}</button>` : ''}`;
  }
  return '';
}

function renderRadarSVG(list){
  const cx=140, cy=140, maxR=110, rings=4;
  const n = list.length;
  const sevLevel = s => s.on ? 3 : 0.6;
  let grid='';
  for(let r=1;r<=rings;r++){
    const rad = maxR*(r/rings);
    let pts=[];
    for(let i=0;i<n;i++){ const a=(Math.PI*2*i/n)-Math.PI/2; pts.push((cx+rad*Math.cos(a)).toFixed(1)+','+(cy+rad*Math.sin(a)).toFixed(1)); }
    grid += `<polygon points="${pts.join(' ')}" fill="none" stroke="#C7CDC9" stroke-width="1"/>`;
  }
  let spokes='', labels='', valPts=[], dots='';
  list.forEach((s,i)=>{
    const a=(Math.PI*2*i/n)-Math.PI/2;
    const ex=cx+maxR*Math.cos(a), ey=cy+maxR*Math.sin(a);
    spokes += `<line x1="${cx}" y1="${cy}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="#C7CDC9" stroke-width="1"/>`;
    const lx=cx+(maxR+16)*Math.cos(a), ly=cy+(maxR+16)*Math.sin(a);
    labels += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="8.5" fill="#5B6670">${i+1}</text>`;
    const rr = maxR*(sevLevel(s)/3.6);
    const vx=cx+rr*Math.cos(a), vy=cy+rr*Math.sin(a);
    valPts.push(vx.toFixed(1)+','+vy.toFixed(1));
    dots += `<circle cx="${vx.toFixed(1)}" cy="${vy.toFixed(1)}" r="4" fill="${s.on?'#B3541E':'#2D5F4C'}"/>`;
  });
  return `<svg viewBox="0 0 280 300">
    ${grid}${spokes}
    <polygon points="${valPts.join(' ')}" fill="#B3541E" opacity="0.14" stroke="#B3541E" stroke-width="1.6"/>
    ${dots}${labels}
    <text x="140" y="292" text-anchor="middle" font-size="9.5" fill="#5B6670">Numbers map to the signal list — outer ring = detected</text>
  </svg>`;
}

    </div>

  `;
}

function trendSVGReal(values){
  if(values.length<2) return '<p class="empty-note" style="margin:0;">Needs at least two tests to draw a trend.</p>';
  const w=560,h=160,pad=28, stepX=(w-2*pad)/(values.length-1);
  const pts=values.map((v,i)=>[pad+i*stepX, h-pad-(v/100)*(h-2*pad)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;"><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#C7CDC9"/><path d="${path}" fill="none" stroke="#2D5F4C" stroke-width="2.4"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2D5F4C"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="11" fill="currentColor">${values[i]}%</text><text x="${p[0]}" y="${h-8}" text-anchor="middle" font-size="10" fill="#5B6670">Test ${i+1}</text>`).join('')}</svg>`;
}

function compareMetricRow(label, va, vb, higherIsBetter, suffix){
  suffix = suffix || '';

  const bWins = both && (higherIsBetter ? vb>va : vb<va);
  const show = v => num(v) ? v+suffix : v;
  return `<div class="factor-row" style="align-items:center;">
    <div class="fname" style="width:170px;">${label}</div>
    <div style="flex:1; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

}

function positionRoleThumb(){
  const thumb = document.getElementById('roleThumb');
  if(!thumb) return;
  const active = thumb.parentElement ? thumb.parentElement.querySelector('button.active') : null;
  if(!active){ thumb.style.opacity = '0'; return; }
  thumb.style.opacity = '1';
  thumb.style.width = active.offsetWidth + 'px';
  thumb.style.left = active.offsetLeft + 'px';
}
window.addEventListener('resize', positionRoleThumb);

  const activeKind = (currentRole==='student' || currentRole==='shared') ? activeTestKind() : null;

  syncCamBox(activeKind==='quiz');
  window.__openWhy = __openWhyId;
  ensureThreadRead();

    loginRole = currentRole==='student' ? 'student' : 'staff'; currentRole='login'; authMode='signin';
  }
  const app = document.getElementById('app');

  if(currentRole==='login'){
    app.className = 'shell shell-login';
    app.innerHTML = renderLoginPage();
    return;

/* ============================================================ V6: TOPIC PICKER (student chooses what to be tested on) ============================================================ */
let quizTopicChoice = null;
let diagTopicChoice = [];

function topicAggByName(reps){
  const m = {};
  const add = (n, right, total)=>{ if(!n || !total) return; const t = m[n] || (m[n] = { right:0, total:0, tests:0 }); t.right += right; t.total += total; t.tests++; };
  reps.forEach(r=>{
    if(r.kind==='quiz') add(r.topic, r.score, r.total);
    else if(r.topicResults) Object.entries(r.topicResults).forEach(([n,t])=>add(n, t.right, t.total));
  });
  return m;
}
function myTopicStats(){
  const acc = currentAccount(); const out = {};
  if(!acc) return out;
  const agg = topicAggByName(getReports().filter(r=>r.studentEmail===acc.email));
  CONCEPTS.forEach(c=>{ const t = agg[c.name]; if(t) out[c.id] = Math.round(t.right/t.total*100); });
  return out;
}
function renderTopicGrid(selected, multi){
  const mine = myTopicStats();
  return `<div class="topic-grid">${CONCEPTS.map(c=>{
    const on = multi ? selected.includes(c.id) : selected===c.id;
    const past = mine[c.id];
    return `<button type="button" class="topic-btn ${on?'on':''}" aria-pressed="${on}" onclick="${multi?'toggleDiagTopic':'selectQuizTopic'}('${c.id}')">
      <span class="tb-name">${multi?(on?'☑ ':'☐ '):''}${c.name}</span>
      <span class="tb-meta">${past===undefined ? 'Not attempted yet' : 'Your accuracy so far: '+past+'%'}</span>
    </button>`;
  }).join('')}</div>`;
}
function selectQuizTopic(id){ quizTopicChoice = id; render(); }
function toggleDiagTopic(id){ const i = diagTopicChoice.indexOf(id); if(i>=0) diagTopicChoice.splice(i,1); else diagTopicChoice.push(id); render(); }
function diagSelectAll(){ diagTopicChoice = CONCEPTS.map(c=>c.id); render(); }
function diagSelectChain(){ diagTopicChoice = DIAGNOSTIC_ORDER.slice(); render(); }
function diagClear(){ diagTopicChoice = []; render(); }
function diagPerTopic(n){ return n===1 ? 5 : (n>=2 && n<=3) ? 3 : 1; }

function classifyByAccuracy(pct){
  if(pct>=80) return { label:'Strong', color:'pine' };
  if(pct>=60) return { label:'Developing', color:'amber' };
  if(pct>=40) return { label:'Weak', color:'rust' };
  return { label:'Critical Foundation', color:'rust' };
}
function pickQuestions(cid, k){
  const order = { easy:0, medium:1, hard:2 };
  const qs = questionsFor(cid).slice().sort((a,b)=>order[a.d]-order[b.d]);
  if(k>=qs.length) return qs;
  if(k===1) return [qs[0]];
  const out = [];
  for(let i=0;i<k;i++) out.push(qs[Math.round(i*(qs.length-1)/(k-1))]);
  return out;
}

/* ---------- adaptive quiz (single chosen topic) ---------- */
function startQuiz(){
  if(!quizTopicChoice){ toast('Please choose a topic first'); return; }
  testViolations.quiz = 0; testEvents.quiz = []; testNotice = ''; fsLost = false; fsEntered = false;
  enterFullscreen();            // must run inside the click that started the test
  camReset(); startCamera();     // camera permission prompt, also inside the click
  beginQuiz();
}
const QUIZ_ORDER = [].concat(Array(5).fill('easy'), Array(8).fill('medium'), Array(7).fill('hard'));   // 20 questions
function shuffled(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// draws the next unused question of the wanted difficulty (falls back to the nearest difficulty when a pool is empty)
function takeQuizQuestion(diff){
  if(quizState.fixed) return quizState.fixed.shift() || null;      // shared test: fixed question list
  const pools = quizState.pools;
  const fallback = { easy:['easy','medium','hard'], medium:['medium','easy','hard'], hard:['hard','medium','easy'] }[diff] || ['easy','medium','hard'];
  for(const d of fallback){ if(pools[d] && pools[d].length) return pools[d].shift(); }
  return null;
}
function beginQuiz(){
  if(currentRole==='shared' && sharedCtx){ beginSharedQuiz(); return; }   // restart after a violation
  const qs = questionsFor(quizTopicChoice);
  const pools = { easy:shuffled(qs.filter(q=>q.d==='easy')), medium:shuffled(qs.filter(q=>q.d==='medium')), hard:shuffled(qs.filter(q=>q.d==='hard')) };
  const order = QUIZ_ORDER.slice(0, Math.min(QUIZ_ORDER.length, qs.length));
  quizState = { conceptId:quizTopicChoice, difficulty:'easy', qIndex:0, score:0, total:0, answered:null, correctStreak:0, wrongStreak:0, order, pools, cur:null, done:false, timedOut:false, log:[], startedAt:Date.now() };
  quizState.cur = takeQuizQuestion('easy');
  quizState.difficulty = quizState.cur.d;
  startTestTimer('quiz', order.length);
  render();
}
function quizChooseAnother(){ quizState = null; render(); }

/* ---------- diagnostic (one or more chosen topics) ---------- */
function startDiagnostic(){
  if(!diagTopicChoice.length){ toast('Please choose at least one topic'); return; }
  testViolations.diagnostic = 0; testEvents.diagnostic = []; testNotice = ''; fsLost = false; fsEntered = false;
  enterFullscreen();
  beginDiagnostic();
}
function beginDiagnostic(){
  const sel = CONCEPTS.map(c=>c.id).filter(id=>diagTopicChoice.includes(id));
  if(!sel.length){ diagnosticState = null; render(); return; }
  const per = diagPerTopic(sel.length);
  const items = [];
  sel.forEach(cid=>pickQuestions(cid, per).forEach(q=>items.push({ cid, q })));
  diagnosticState = { items, idx:0, answered:null, tally:{}, log:[], done:false, timedOut:false, startedAt:Date.now() };
  startTestTimer('diagnostic', items.length);
  render();
}
function answerDiagnostic(optIdx){
  if(!diagnosticState || diagnosticState.answered!==null) return;
  const item = diagnosticState.items[diagnosticState.idx];
  const q = item.q, cid = item.cid;
  const correct = optIdx===q.a;
  testNotice = '';
  diagnosticState.answered = optIdx;
  const t = diagnosticState.tally[cid] || (diagnosticState.tally[cid] = { right:0, total:0 });
  t.total++; if(correct) t.right++;
  diagnosticState.log.push({ q:q.q, correct, chosen:q.o[optIdx], right:q.o[q.a], d:q.d, topic:CONCEPT_MAP[cid].name });
  render();
}
function diagnosticNext(){
  if(!diagnosticState) return;
  diagnosticState.idx++;
  diagnosticState.answered = null;
  if(diagnosticState.idx>=diagnosticState.items.length){
    diagnosticState.done = true;
    diagnosticState.durationSec = Math.round((Date.now()-diagnosticState.startedAt)/1000);
    submitTestReport('diagnostic');
  }
  render();
}
function diagChooseAnother(){ diagnosticState = null; render(); }

    return `

/* ---------- report sent to the teacher ---------- */
function submitTestReport(kind){
  if(kind==='quiz' && currentRole==='shared' && sharedCtx){ submitSharedResult(); return; }
  const acc = currentAccount();
  const student = STUDENT_MAP[youId];
  const rep = {
    id: 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    at: new Date().toISOString(),
    kind,
    studentName: acc ? acc.name : student.name,
    studentEmail: acc ? acc.email : '',
    roll: acc && acc.roll ? acc.roll : '',
    violations: testViolations[kind],
    violEv: testEvents[kind].slice(),
    camFlags: kind==='quiz' ? camFinal().n : 0,
    camEvents: kind==='quiz' ? camFinal().events : [],
    timedOut: !!((kind==='quiz' ? quizState : diagnosticState) && (kind==='quiz' ? quizState : diagnosticState).timedOut),
    seen: false,
    durationSec: 0,
  };
  if(kind==='quiz'){
    const q = quizState;
    const c = CONCEPT_MAP[q.conceptId];
    rep.topic = c.name; rep.topicId = q.conceptId;
    rep.prereq = CONCEPT_MAP[(c.prereqs && c.prereqs[0]) || q.conceptId].name;
    rep.score = q.score; rep.total = q.total;
    rep.accuracy = q.total ? Math.round(q.score/q.total*100) : 0;
    rep.durationSec = q.durationSec || 0;
    rep.log = q.log.map(x=>({ q:x.q, correct:x.correct, chosen:x.chosen, right:x.right, d:x.d }));
  } else {
    const d = diagnosticState;
    const groups = { 'Strong':[], 'Developing':[], 'Weak':[], 'Critical Foundation':[] };
    const failed = [], topicResults = {};
    Object.keys(d.tally).forEach(cid=>{
      const t = d.tally[cid], pct = Math.round(t.right/t.total*100), name = CONCEPT_MAP[cid].name;
      groups[classifyByAccuracy(pct).label].push(name);
      topicResults[name] = { id:cid, right:t.right, total:t.total, pct };
      if(pct<50) failed.push(name);
    });
    const names = Object.keys(topicResults);
    rep.groups = groups; rep.failed = failed; rep.topicResults = topicResults;
    rep.critical = groups['Critical Foundation'][0] || groups['Weak'][0] || '';
    rep.topic = names.length===1 ? names[0] : names.length+' topics';
    rep.total = d.log.length;
    rep.score = d.log.filter(x=>x.correct).length;
    rep.accuracy = rep.total ? Math.round(rep.score/rep.total*100) : 0;
    rep.durationSec = d.durationSec || 0;
    rep.log = d.log.map(x=>({ q:x.q, correct:x.correct, chosen:x.chosen, right:x.right, d:x.d, topic:x.topic }));
  }
  const all = getReports(); all.unshift(rep); saveReports(all);
}

/* ============================================================ V6: STAFF ANALYTICS — everything below is computed from registered students' real test reports ============================================================ */
const RIC_ORDER = ['Critical','High','Moderate','Monitoring','Improving','Not tested'];
const RIC_COLOR = { Critical:'rust', High:'rust', Moderate:'amber', Monitoring:'steel', Improving:'pine', 'Not tested':'neutral' };
const LG_INT_KEY = 'lg-interventions';
let regSearch = '', regFilter = 'all', regSort = 'risk';

function studentAccounts(){ return getAccounts().filter(a=>a.type==='student'); }
function getInt(){ const v = lsGet(LG_INT_KEY, null); return v && v.history ? v : { history:{}, notes:{}, resolved:{} }; }
function saveInt(v){ lsSet(LG_INT_KEY, v); }

function realStudentStats(acc){
  const reps = getReports().filter(r=>r.studentEmail===acc.email).sort((a,b)=>new Date(a.at)-new Date(b.at));
  const avg = list => list.length ? Math.round(list.reduce((s,x)=>s+x.accuracy,0)/list.length) : null;
  const quizzes = reps.filter(r=>r.kind==='quiz'), diags = reps.filter(r=>r.kind==='diagnostic');
  const agg = topicAggByName(reps);
  const topics = {}; Object.keys(agg).forEach(n=>{ topics[n] = Math.round(agg[n].right/agg[n].total*100); });
  const tEntries = Object.entries(topics).sort((a,b)=>a[1]-b[1]);
  const weakTopics = tEntries.filter(([,v])=>v<60).map(([n])=>n);
  const strongTopics = tEntries.filter(([,v])=>v>=80).map(([n])=>n);
  const weakest = tEntries.length && tEntries[0][1]<80 ? tEntries[0][0] : '—';
  const diff = { easy:{r:0,t:0}, medium:{r:0,t:0}, hard:{r:0,t:0} };
  reps.forEach(r=>(r.log||[]).forEach(x=>{ if(diff[x.d]){ diff[x.d].t++; if(x.correct) diff[x.d].r++; } }));
  const last = reps[reps.length-1], prev = reps[reps.length-2];
  const delta = last && prev ? last.accuracy - prev.accuracy : null;
  const totalQ = reps.reduce((a,r)=>a+(r.total||0),0), totalSec = reps.reduce((a,r)=>a+(r.durationSec||0),0);
  const avgSec = totalSec && totalQ ? Math.round(totalSec/totalQ*10)/10 : null;
  const msgs = getMessages();
  const s = {
    tests: reps.length, quizAvg: avg(quizzes), diagAvg: avg(diags), overall: avg(reps),
    latest: last ? last.accuracy : null, delta,
    violations: reps.reduce((a,r)=>a+(r.violations||0),0),
    camFlags: reps.reduce((a,r)=>a+(r.camFlags||0),0),
    weakest, topics, weakTopics, strongTopics, diff, avgSec,
    lastActive: last ? fmtDate(last.at) : 'No tests yet', lastAt: last ? last.at : null,
    notified: reps.filter(r=>r.notifiedAt).length,
    replies: msgs.filter(m=>m.fromEmail===acc.email && m.fromType==='student').length,
    risk: null, riskFactors: [], trendDelta: null,
  };
  if(reps.length){
    const earlier = reps.slice(0,-1);
    const earlierAvg = earlier.length ? earlier.reduce((a,r)=>a+r.accuracy,0)/earlier.length : null;
    const drop = earlierAvg===null ? 0 : Math.max(0, earlierAvg - last.accuracy);
    s.trendDelta = earlierAvg===null ? null : Math.round(last.accuracy - earlierAvg);
    const base = (100-s.overall)*0.9, trend = Math.min(15, drop*0.5), viol = Math.min(15, s.violations*5), weak = Math.min(15, weakTopics.length*5);
    s.risk = Math.round(clamp(base+trend+viol+weak, 0, 100));
    s.riskFactors = [['Low accuracy', Math.round(base)], ['Declining results', Math.round(trend)], ['Integrity violations', Math.round(viol)], ['Weak topics', Math.round(weak)]];
  }
  return s;
}
function realCategory(s){
  if(!s.tests) return 'Not tested';
  if(s.risk>=80) return 'Critical';
  if(s.risk>=60) return 'High';
  if(s.risk>=35) return 'Moderate';
  if(s.trendDelta!==null && s.trendDelta>=5) return 'Improving';
  return 'Monitoring';
}
function realRows(){
  return studentAccounts().map(a=>{ const s = realStudentStats(a); return { acc:a, s, cat:realCategory(s) }; });
}
function realReasons(s){
  if(!s.tests) return ['Has not taken any proctored test yet — no data to analyse.'];
  const r = [];
  if(s.overall<60) r.push('Low overall accuracy ('+s.overall+'%)');
  if(s.weakTopics.length) r.push('Weak topics: '+s.weakTopics.map(n=>n+' ('+s.topics[n]+'%)').join(', '));
  if(s.trendDelta!==null && s.trendDelta<=-8) r.push('Latest result is '+Math.abs(s.trendDelta)+' points below earlier results');
  if(s.diff.easy.t>=2 && s.diff.easy.r/s.diff.easy.t<0.7) r.push('Missing easy questions ('+Math.round(s.diff.easy.r/s.diff.easy.t*100)+'% correct) — points to a basics gap');
  if(s.violations>0) r.push(s.violations+' tab/window switch'+(s.violations>1?'es':'')+' recorded during tests');
  if(s.camFlags>0) r.push('camera turned off or blocked '+s.camFlags+' time'+(s.camFlags>1?'s':'')+' during quizzes');
  if(s.avgSec!==null && s.avgSec<6 && s.overall<70) r.push('Answering very quickly (about '+s.avgSec+'s per question) with low accuracy — possible guessing');
  if(!r.length) r.push('No warning signs in the tests taken so far');
  return r;
}
function suggestedAction(row){
  const s = row.s;
  if(!s.tests) return 'Remind the student to take their first test.';
  if(s.weakTopics.length) return 'Targeted review of '+s.weakTopics[0]+', then a retake.';
  if(s.violations>0) return 'Have a short conversation about test conduct.';
  if(row.cat==='Improving') return 'Acknowledge the progress and keep monitoring.';
  if(s.risk>=35) return 'Check in and offer help on the lowest topics.';
  return 'Routine monitoring.';
}
function trendText(s){ return s.delta===null ? '—' : (s.delta>0 ? '↑ +' : s.delta<0 ? '↓ ' : '→ ')+s.delta+' pts'; }
function studentStatus(s){
  if(s.tests===0) return { label:'No tests yet', color:'neutral' };
  if(s.risk>=60) return { label:'Needs support', color:'rust' };
  if(s.risk>=35) return { label:'Developing', color:'amber' };
  return { label:'On track', color:'pine' };
}
function riskCell(s){
  if(s.risk===null) return '—';
  return `<span class="risk-bar"><span class="risk-fill" style="width:${s.risk}%; background:${s.risk>=60?'#B3541E':s.risk>=35?'#B4822C':'#2D5F4C'}"></span></span>${s.risk}`;
}
function topicBarsHTML(list){
  return list.map(t=>`<div class="bar-row"><div class="name">${esc(t.name)}</div><div class="bar-track"><div class="bar-fill" style="width:${t.pct||0}%; background:${t.pct===null?'transparent':bucketColor(t.pct)}"></div></div><div class="pct">${t.pct===null?'—':t.pct+'%'}</div></div>`).join('');
}

/* ---------- class-level data (all registered students) ---------- */
function classData(){
  const rows = realRows();
  const emails = new Set(rows.map(r=>r.acc.email));
  const reports = getReports().filter(r=>emails.has(r.studentEmail));
  const tested = rows.filter(r=>r.s.tests>0);
  const classAvg = tested.length ? Math.round(tested.reduce((a,r)=>a+r.s.overall,0)/tested.length) : null;
  const tm = {}, qm = {}, diff = { easy:{r:0,t:0}, medium:{r:0,t:0}, hard:{r:0,t:0} };
  let secSum = 0, qSum = 0;
  reports.forEach(r=>{
    const add = (n,right,total)=>{ if(!n||!total) return; const t = tm[n] || (tm[n] = { right:0, total:0, emails:new Set() }); t.right+=right; t.total+=total; t.emails.add(r.studentEmail); };
    if(r.kind==='quiz') add(r.topic, r.score, r.total);
    else if(r.topicResults) Object.entries(r.topicResults).forEach(([n,t])=>add(n, t.right, t.total));
    (r.log||[]).forEach(x=>{
      if(diff[x.d]){ diff[x.d].t++; if(x.correct) diff[x.d].r++; }
      const e = qm[x.q] || (qm[x.q] = { q:x.q, topic:x.topic||r.topic||'', d:x.d, right:0, total:0 });
      e.total++; if(x.correct) e.right++;
    });
    if(r.durationSec && r.total){ secSum += r.durationSec; qSum += r.total; }
  });
  const topicRows = CONCEPTS.map(c=>{ const t = tm[c.name]; return { id:c.id, name:c.name, pct:t?Math.round(t.right/t.total*100):null, students:t?t.emails.size:0, answers:t?t.total:0 }; });
  const attempted = topicRows.filter(t=>t.pct!==null).sort((a,b)=>a.pct-b.pct);
  const missed = Object.values(qm).filter(e=>e.right<e.total).sort((a,b)=>(a.right/a.total)-(b.right/b.total) || b.total-a.total).slice(0,5);
  const byCat = {}; RIC_ORDER.forEach(k=>byCat[k]=0); rows.forEach(r=>byCat[r.cat]++);
  return {
    rows, tested, reports, classAvg, topicRows, attempted,
    untested: topicRows.filter(t=>t.pct===null),
    hardest: attempted[0] || null, strongest: attempted.length ? attempted[attempted.length-1] : null,
    missed, diff, avgSec: qSum ? Math.round(secSum/qSum*10)/10 : null, byCat,
    atRisk: rows.filter(r=>r.s.risk!==null && r.s.risk>=60),
    flagged: rows.filter(r=>r.s.violations>0 || r.s.camFlags>0),
    notTested: rows.filter(r=>!r.s.tests),
  };
}

function studentOverallAnalysis(acc, reps, s){
  const first = acc.name.split(' ')[0];
  const found = [], recs = [];
  if(!reps.length) return { found:[first+' has not taken any proctored test yet.'], recs:['Ask '+first+' to take the Adaptive Quiz or the Diagnostic Test so there is data to analyse.'] };
  found.push(first+' has taken '+s.tests+' test'+(s.tests>1?'s':'')+' with an average accuracy of '+s.overall+'% (latest '+s.latest+'%).');
  if(reps.length>=2){
    const d = reps[reps.length-1].accuracy - reps[0].accuracy;
    found.push(d>0 ? 'Improving: up '+d+' points from the first test to the latest.' : d<0 ? 'Declining: down '+Math.abs(d)+' points from the first test to the latest.' : 'Scores have stayed flat across attempts.');
  }
  if(s.weakTopics.length){ found.push('Weak topics (below 60%): '+s.weakTopics.map(n=>n+' ('+s.topics[n]+'%)').join(', ')+'.'); recs.push('Revise '+s.weakTopics[0]+' with '+first+' before moving on.'); }
  if(s.strongTopics.length) found.push('Strong topics (80%+): '+s.strongTopics.join(', ')+'.');
  const ea = s.diff.easy, ha = s.diff.hard;
  if(ea.t>=2 && ea.r/ea.t<0.7){ found.push('Only '+Math.round(ea.r/ea.t*100)+'% of easy questions were correct — the basics are not secure.'); recs.push('Go back to fundamentals before attempting harder problems.'); }
  if(ha.t>=2 && ea.t>=2 && ha.r/ha.t>ea.r/ea.t) found.push('Does better on hard questions than easy ones — likely careless errors or rushing.');
  if(s.avgSec!==null){
    found.push('Average time per question is about '+s.avgSec+'s.');
    if(s.avgSec<6 && s.overall<70){ found.push('Very fast answers with low accuracy suggest guessing.'); recs.push('Encourage '+first+' to slow down and explain answers aloud.'); }
    if(s.avgSec>60 && s.overall<60) found.push('Long time per question with low accuracy suggests genuine difficulty with the material.');
  }
  const missedQ = {};
  reps.forEach(r=>(r.log||[]).filter(x=>!x.correct).forEach(x=>{ missedQ[x.q]=(missedQ[x.q]||0)+1; }));
  const repeated = Object.entries(missedQ).filter(([,n])=>n>1);
  if(repeated.length){ found.push('Missed the same question more than once: '+repeated.map(([q])=>'“'+q+'”').join('; ')); recs.push('Repeated misses show a concept not yet understood — a short 1:1 explanation will help more than another retry.'); }
  const diag = reps.filter(r=>r.kind==='diagnostic').slice(-1)[0];
  if(diag && diag.failed && diag.failed.length){ found.push('Latest diagnostic found gaps in: '+diag.failed.join(', ')+'.'); recs.push('Begin remediation at '+(diag.critical||diag.failed[0])+'.'); }
  const notTested = CONCEPTS.filter(c=>s.topics[c.name]===undefined).map(c=>c.name);
  if(notTested.length && notTested.length<CONCEPTS.length) found.push('Topics not tested yet: '+notTested.join(', ')+'.');
  if(s.violations>0){ found.push(s.violations+' tab/window switch'+(s.violations>1?'es':'')+' recorded across tests — scores may not fully reflect '+first+'’s own work.'); recs.push('Have a quick conversation about test conduct.'); }
  if(s.notified && !s.replies) recs.push('You notified '+first+' but there has been no reply yet — consider a follow-up.');
  if(!recs.length) recs.push(first+' is doing well — no action needed beyond routine monitoring.');
  return { found, recs };
}
function buildRealTimeline(acc, reps){
  const ev = [];
  reps.forEach(r=>ev.push({ at:r.at, text: kindLabel(r.kind)+(r.topic?' on '+r.topic:'')+' — '+r.accuracy+'% ('+r.score+'/'+r.total+')'+(r.violations?' · '+r.violations+' tab switch'+(r.violations>1?'es':''):'') }));
  getMessages().forEach(m=>{
    if(m.toEmail===acc.email && m.toType==='student') ev.push({ at:m.at, text:(m.kind==='notice'?'Notification':'Message')+' sent by '+m.fromName });
    else if(m.fromEmail===acc.email && m.fromType==='student') ev.push({ at:m.at, text:'Student sent a message to '+m.toName });
  });
  const st = getInt();
  (st.history[acc.email]||[]).forEach(h=>ev.push({ at:h.at, text:'Intervention logged — '+h.action+' (reason: '+h.reason+')' }));
  (st.notes[acc.email]||[]).forEach(n=>ev.push({ at:n.at, text:'Note: “'+n.text+'”' }));
  return ev.sort((a,b)=>new Date(b.at)-new Date(a.at));
}

    </div>
    <div class="panel"><div class="panel-head"><h2>Interventions &amp; notes</h2><button class="btn small" onclick="addNote('${esc(acc.email)}')">+ Add note</button></div>

      ${notes.map(n=>`<div class="signal-note"><span class="dot" style="background:var(--amber)"></span><div><span class="tag">Note · ${fmtDate(n.at)}</span><p>${esc(n.text)}</p></div></div>`).join('')}

    </div>
    <div class="panel"><div class="panel-head"><h2>Contact ${esc(acc.name.split(' ')[0])}</h2><span class="sub">${thread.length} message${thread.length===1?'':'s'} in this conversation</span></div>
      <textarea id="sd-notice" class="res-answer" style="width:100%; min-height:84px; border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; font-size:13px; background:var(--paper-raised); color:var(--ink); font-family:inherit;" placeholder="Write a notification for ${esc(acc.name)}…"></textarea>

/* ---------- compare (registered students only) ---------- */
function compareOptionsHTML(slot){
  return studentAccounts().map(a=>`<option value="acc:${esc(a.email)}" ${compareIds[slot]==='acc:'+a.email?'selected':''}>${esc(a.name)}</option>`).join('');
}
function renderCompare(){
  const reals = studentAccounts();
  const ids = reals.map(a=>'acc:'+a.email);
  if(!ids.includes(compareIds[0])) compareIds[0] = ids[0] || '';
  if(!ids.includes(compareIds[1]) || compareIds[1]===compareIds[0]) compareIds[1] = ids.find(i=>i!==compareIds[0]) || '';
  const head = `
    <div class="section-title"><h1>Compare Students</h1><p>Compare two registered students side by side, using their real test reports.</p></div>`;
  if(reals.length<2){
    return head + `<div class="panel"><p class="empty-note" style="margin:0;">${reals.length} student account${reals.length===1?' has':'s have'} been created so far. Once two students have registered and taken tests, they can be compared here.</p></div>`;
  }
  const A = reals.find(x=>'acc:'+x.email===compareIds[0]), B = reals.find(x=>'acc:'+x.email===compareIds[1]);
  const sa = realStudentStats(A), sb = realStudentStats(B);
  const topics = Array.from(new Set(Object.keys(sa.topics).concat(Object.keys(sb.topics))));
  const n = v => v===null ? '—' : v;
  return head + `
    <div class="panel"><div class="filter-row">
      <select aria-label="Select first student" onchange="setCompareId(0,this.value)">${compareOptionsHTML(0)}</select>
      <span style="align-self:center; color:var(--ink-soft); font-size:12.5px;">compared with</span>
      <select aria-label="Select second student" onchange="setCompareId(1,this.value)">${compareOptionsHTML(1)}</select>
    </div></div>
    <div class="panel">
      <div class="panel-head"><h2>${esc(A.name)} <span style="color:var(--ink-soft); font-weight:400;">vs</span> ${esc(B.name)}</h2><span class="label-tag">From real test reports</span></div>
      ${compareMetricRow('Tests taken', sa.tests, sb.tests, true)}
      ${compareMetricRow('Overall accuracy', n(sa.overall), n(sb.overall), true, sa.overall===null||sb.overall===null?'':'%')}
      ${compareMetricRow('Quiz average', n(sa.quizAvg), n(sb.quizAvg), true, sa.quizAvg===null||sb.quizAvg===null?'':'%')}
      ${compareMetricRow('Diagnostic average', n(sa.diagAvg), n(sb.diagAvg), true, sa.diagAvg===null||sb.diagAvg===null?'':'%')}
      ${compareMetricRow('Latest score', n(sa.latest), n(sb.latest), true, sa.latest===null||sb.latest===null?'':'%')}
      ${compareMetricRow('Change vs previous test', trendText(sa), trendText(sb), true)}
      ${compareMetricRow('Risk score', n(sa.risk), n(sb.risk), false)}
      ${compareMetricRow('Strong topics (80%+)', sa.strongTopics.length, sb.strongTopics.length, true)}
      ${compareMetricRow('Weak topics (<60%)', sa.weakTopics.length, sb.weakTopics.length, false)}
      ${compareMetricRow('Avg seconds per question', n(sa.avgSec), n(sb.avgSec), true)}
      ${compareMetricRow('Tab-switch violations', sa.violations, sb.violations, false)}
      ${compareMetricRow('Messages sent to teachers', sa.replies, sb.replies, true)}
      <div class="factor-row" style="align-items:center;"><div class="fname" style="width:170px;">Weakest topic</div><div style="flex:1; display:flex; gap:10px; font-size:12.5px; flex-wrap:wrap;"><span class="pill steel">${esc(sa.weakest)}</span><span style="color:var(--ink-soft); font-size:11px; align-self:center;">vs</span><span class="pill steel">${esc(sb.weakest)}</span></div></div>
      <div class="factor-row" style="align-items:center;"><div class="fname" style="width:170px;">Last test</div><div style="flex:1; font-size:12.5px; color:var(--ink-soft);">${esc(sa.lastActive)} <span style="font-size:11px;">vs</span> ${esc(sb.lastActive)}</div></div>
    </div>
    ${topics.length ? `<div class="panel"><div class="panel-head"><h2>Accuracy by topic</h2><span class="sub">Quizzes + diagnostics</span></div>
      ${topics.map(t=>`<div style="margin-bottom:12px; font-size:12.5px;"><b>${esc(t)}</b>
        ${[[A,sa],[B,sb]].map(([acc,s])=>`<div style="display:flex; align-items:center; gap:10px; margin-top:5px;"><span style="width:120px; color:var(--ink-soft);">${esc(acc.name)}</span><div class="rep-bar" style="flex:1; margin:0;"><i style="width:${s.topics[t]||0}%; background:${(s.topics[t]||0)<60?'var(--rust)':(s.topics[t]||0)<80?'var(--amber)':'var(--pine)'};"></i></div><span style="width:44px; text-align:right;">${s.topics[t]!==undefined?s.topics[t]+'%':'—'}</span></div>`).join('')}</div>`).join('')}
    </div>` : `<div class="panel"><p class="empty-note" style="margin:0;">Neither student has completed a test yet, so there are no per-topic results to compare.</p></div>`}
    <div class="btn-row">
      <button class="btn small" onclick="viewRegisteredStudent('${esc(A.email)}')">Open ${esc(A.name)}</button>
      <button class="btn small" onclick="viewRegisteredStudent('${esc(B.email)}')">Open ${esc(B.name)}</button>
      <button class="btn small ghost" onclick="setInstructorSection('reports')">View test reports</button>
    </div>`;
}

function renderEarlyWarning(){

    <div class="section-title"><h1>🚨 Academic Early Warning</h1><p>Risk is scored from each registered student's real test results. It is an indicator for review, not a permanent judgment — verify before acting.</p></div>

    ${withData.map(({acc,s})=>{
      const band = riskBand(s.risk);
      return `<div class="panel">
        <div class="panel-head"><h2>${band.icon} ${esc(acc.name)}</h2><span class="pill ${band.color}">${band.label} · ${s.risk}</span></div>
        <p style="font-size:12.5px; color:var(--ink-soft); margin:0 0 8px;">${s.tests} test${s.tests>1?'s':''} · average ${s.overall}% · latest ${s.latest}% · weakest: ${esc(s.weakest)}</p>

/* ---------- intervention center ---------- */
function isHiddenResolved(store, row){
  const at = store.resolved[row.acc.email];
  if(!at) return false;
  return !(row.s.lastAt && new Date(row.s.lastAt) > new Date(at));
}
function renderInterventionCenter(){
  const rows = realRows(), store = getInt();
  const groups = {}; RIC_ORDER.forEach(k=>groups[k]=[]);
  let resolvedCount = 0;
  rows.forEach(r=>{ if(isHiddenResolved(store, r)) resolvedCount++; else groups[r.cat].push(r); });
  RIC_ORDER.forEach(k=>groups[k].sort((a,b)=>(b.s.risk||0)-(a.s.risk||0)));
  return `
    <div class="section-title"><h1>👨‍🏫 Intervention Center</h1><p>Registered students grouped by urgency from their real test results, with a guided workflow for logging interventions.</p></div>
    ${!rows.length ? '<div class="panel"><p class="empty-note" style="margin:0;">No student has registered yet.</p></div>' : `
    <div class="ic-columns">
      ${RIC_ORDER.map(cat=>`
        <div>
          <div class="ic-col-head"><span class="pill ${RIC_COLOR[cat]}">${cat}</span><span class="ic-count">${groups[cat].length}</span></div>
          ${groups[cat].length ? groups[cat].map(r=>{
            const s = r.s, em = esc(r.acc.email), nIv = (store.history[r.acc.email]||[]).length;
            return `<div class="ic-card">
              <h4>${esc(r.acc.name)}</h4>
              <p class="icr">${esc(realReasons(s)[0])}</p>
              <div class="icmeta">${s.tests?`Weakest: <b>${esc(s.weakest)}</b> · Risk: <b>${s.risk}</b> · Avg: <b>${s.overall}%</b> · Last test: <b>${s.lastActive}</b> · Trend: <b>${trendText(s)}</b>`:'No tests taken yet'}${nIv?` · Interventions: <b>${nIv}</b>`:''}</div>
              <div class="icmeta">Suggested: ${esc(suggestedAction(r))}</div>
              <div class="ic-btn-row">
                <button onclick="viewRegisteredStudent('${em}')">View Student</button>
                <button onclick="openInterventionWorkflow('${em}')">Create Intervention</button>
                <button onclick="openThread('${em}')">Message</button>
                <button onclick="addNote('${em}')">Add Note</button>
                <button onclick="markResolved('${em}')">Mark Resolved</button>
              </div>
            </div>`;
          }).join('') : `<p class="empty-note">No students in this category.</p>`}
        </div>`).join('')}
    </div>`}
    ${resolvedCount ? `<p class="empty-note" style="margin-top:14px;">${resolvedCount} student(s) marked resolved. They reappear automatically after their next test. <button class="btn small ghost" onclick="clearResolved()">Show all again</button></p>` : ''}
  `;
}
function addNote(email){
  const acc = studentAccounts().find(a=>a.email===email); if(!acc) return;
  const v = prompt('Add a note for '+acc.name+':');
  if(!v || !v.trim()) return;
  const st = getInt(); (st.notes[email] = st.notes[email] || []).push({ text:v.trim(), at:new Date().toISOString() });
  saveInt(st); render(); toast('Note added');
}
function markResolved(email){
  const acc = studentAccounts().find(a=>a.email===email); if(!acc) return;
  const st = getInt(); st.resolved[email] = new Date().toISOString(); saveInt(st);
  render(); toast(acc.name+' marked resolved');
}
function clearResolved(){ const st = getInt(); st.resolved = {}; saveInt(st); render(); }

const IW_REASONS = ['Foundational gap','Declining performance','Weak topic','Low accuracy','Possible guessing / rushing','Test conduct (tab switching)','Not tested yet','Other'];
const IW_ACTIONS = ['Schedule 1:1 meeting','Assign remedial practice','Recommend study group','Refer to TA / tutoring','Notify academic advisor','Send encouragement note'];
function openInterventionWorkflow(email){ interventionWorkflow = { email, step:1, reason:'', action:'', note:'', followUp:'', notify:false, saved:false }; render(); }
function saveIntervention(){
  const iw = interventionWorkflow;
  const st = getInt();
  (st.history[iw.email] = st.history[iw.email] || []).push({ reason:iw.reason||'Not specified', action:iw.action||'Not specified', note:iw.note, followUp:iw.followUp, at:new Date().toISOString() });
  saveInt(st);
  if(iw.notify && iw.note.trim()) postMessage(iw.email, iw.note, 'notice');
  interventionWorkflow.saved = true;
  render();
}
function renderInterventionWorkflow(){
  const iw = interventionWorkflow;
  if(!iw) return '';
  const acc = studentAccounts().find(a=>a.email===iw.email);
  if(!acc) return '';
  if(iw.saved){
    return `<div class="drawer iw-drawer">
      <div class="drawer-head"><h2>Intervention</h2><button class="drawer-close" onclick="closeInterventionWorkflow()">✕</button></div>
      <div class="drawer-body">
        <div class="iw-success"><div class="chk">✓</div><h3 style="margin:0 0 6px;">Intervention Created ✓</h3><p style="color:var(--ink-soft); font-size:13px;">Logged to ${esc(acc.name)}'s activity timeline.${iw.notify&&iw.note.trim()?' Your note was also sent to the student.':''}</p></div>
        <div class="btn-row" style="justify-content:center;"><button class="btn primary" onclick="closeInterventionWorkflow()">Done</button></div>
      </div>
    </div>`;
  }
  const stepBody = () => {
    if(iw.step===1) return `<p class="empty-note" style="margin-bottom:10px;">Step 1 — Select reason</p>${IW_REASONS.map(r=>`<button class="iw-option ${iw.reason===r?'sel':''}" onclick="setIWField('reason','${r}')">${r}</button>`).join('')}`;
    if(iw.step===2) return `<p class="empty-note" style="margin-bottom:10px;">Step 2 — Choose action</p>${IW_ACTIONS.map(a=>`<button class="iw-option ${iw.action===a?'sel':''}" onclick="setIWField('action','${a}')">${a}</button>`).join('')}`;
    if(iw.step===3) return `<p class="empty-note" style="margin-bottom:10px;">Step 3 — Add note</p><textarea placeholder="Context for this intervention…" onchange="setIWField('note',this.value)">${esc(iw.note)}</textarea>
      <label style="display:flex; gap:8px; align-items:center; font-size:12.5px; margin-top:10px;"><input type="checkbox" ${iw.notify?'checked':''} onchange="setIWField('notify',this.checked)"/> Also send this note to ${esc(acc.name.split(' ')[0])} as a notification</label>`;
    if(iw.step===4) return `<p class="empty-note" style="margin-bottom:10px;">Step 4 — Set follow-up date</p><input type="date" value="${iw.followUp}" onchange="setIWField('followUp',this.value)"/>`;
    return `<p class="empty-note" style="margin-bottom:10px;">Step 5 — Review &amp; save</p>
      <dl class="iw-summary">
        <dt>Student</dt><dd>${esc(acc.name)}</dd>
        <dt>Reason</dt><dd>${esc(iw.reason||'Not set')}</dd>
        <dt>Action</dt><dd>${esc(iw.action||'Not set')}</dd>
        <dt>Note</dt><dd>${esc(iw.note||'—')}</dd>
        <dt>Send note to student</dt><dd>${iw.notify?'Yes':'No'}</dd>
        <dt>Follow-up date</dt><dd>${esc(iw.followUp||'—')}</dd>
      </dl>`;
  };
  return `<div class="drawer iw-drawer">
    <div class="drawer-head"><h2>Create Intervention — ${esc(acc.name)}</h2><button class="drawer-close" onclick="closeInterventionWorkflow()">✕</button></div>
    <div class="drawer-body">
      <div class="iw-steps">${[1,2,3,4,5].map(n=>`<span class="${n<=iw.step?'on':''}"></span>`).join('')}</div>
      ${stepBody()}
      <div class="btn-row" style="margin-top:16px;">
        ${iw.step>1 ? `<button class="btn ghost" onclick="iwBack()">Back</button>` : ''}
        ${iw.step<5 ? `<button class="btn primary" onclick="iwNext()">Next</button>` : `<button class="btn primary" onclick="saveIntervention()">Save Intervention</button>`}
      </div>
    </div>
  </div>`;
}

/* ---------- class intelligence ---------- */
function renderClassIntelligence(){
  const d = classData();
  if(!d.rows.length){
    return `<div class="section-title"><h1>📊 Class Intelligence</h1></div><div class="panel"><p class="empty-note" style="margin:0;">No student has registered yet.</p></div>`;
  }
  const actions = [];
  if(d.hardest && d.hardest.pct<70) actions.push('Plan a revision session on '+d.hardest.name+' — class accuracy is only '+d.hardest.pct+'% across '+d.hardest.students+' student'+(d.hardest.students>1?'s':'')+'.');
  if(d.missed.length && d.missed[0].total>=2) actions.push('Review the most-missed question in class: “'+d.missed[0].q+'” (only '+d.missed[0].right+'/'+d.missed[0].total+' correct).');
  if(d.diff.easy.t>=3 && d.diff.easy.r/d.diff.easy.t<0.75) actions.push('Only '+Math.round(d.diff.easy.r/d.diff.easy.t*100)+'% of easy questions were answered correctly — the class may need a fundamentals refresher.');
  if(d.atRisk.length) actions.push(d.atRisk.length+' student'+(d.atRisk.length>1?'s are':' is')+' at high risk: '+d.atRisk.map(r=>r.acc.name).join(', ')+'.');
  if(d.notTested.length) actions.push(d.notTested.length+' registered student'+(d.notTested.length>1?'s have':' has')+' not taken any test — send a reminder.');
  if(d.flagged.length) actions.push(d.flagged.length+' student'+(d.flagged.length>1?'s':'')+' switched tabs during a test — treat those scores with care.');
  if(d.untested.length) actions.push('No one has been tested on: '+d.untested.map(t=>t.name).join(', ')+'.');
  if(!actions.length) actions.push('No class-level concerns detected so far.');
  return `
    <div class="section-title"><h1>📊 Class Intelligence</h1><p>Topic-level and question-level analytics for the whole section — from registered students' real test reports only.</p></div>
    <div class="grid-4">
      <div class="stat-card"><div class="num">${d.classAvg===null?'—':d.classAvg+'%'}</div><div class="lbl">Class average accuracy</div></div>
      <div class="stat-card"><div class="num">${d.tested.length}/${d.rows.length}</div><div class="lbl">Students tested</div></div>
      <div class="stat-card"><div class="num">${d.reports.length}</div><div class="lbl">Tests submitted</div></div>
      <div class="stat-card"><div class="num">${d.avgSec===null?'—':d.avgSec+'s'}</div><div class="lbl">Avg time per question</div></div>
    </div>
    <div class="panel" style="margin-top:18px;"><div class="panel-head"><h2>Recommended class actions</h2></div>
      <ul class="metric-list">${actions.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>
    <div class="grid-2">
      <div class="panel"><div class="panel-head"><h2>Topic performance</h2><span class="sub">All 10 topics</span></div>
        ${topicBarsHTML(d.topicRows.slice().sort((a,b)=>(a.pct===null?999:a.pct)-(b.pct===null?999:b.pct)))}
        <p class="empty-note" style="margin:8px 0 0;">“—” means nobody has been tested on that topic yet.</p></div>
      <div class="panel"><div class="panel-head"><h2>Accuracy by difficulty</h2></div>
        <div class="an-diff">${['easy','medium','hard'].map(k=>`<div>${k}<b>${d.diff[k].t?Math.round(d.diff[k].r/d.diff[k].t*100)+'%':'—'}</b>${d.diff[k].t?d.diff[k].r+'/'+d.diff[k].t+' correct':'no data'}</div>`).join('')}</div>
        <div class="panel-head" style="margin-top:18px;"><h2>Risk distribution</h2></div>
        ${RIC_ORDER.map(cat=>`<div class="factor-row"><div class="fname" style="width:110px;">${cat}</div><div class="factor-track"><div class="factor-fill" style="width:${d.byCat[cat]/d.rows.length*100}%; background:${cat==='Critical'||cat==='High'?'var(--rust)':cat==='Moderate'?'var(--amber)':cat==='Improving'?'var(--pine)':'var(--steel)'}"></div></div><div class="fpct">${d.byCat[cat]}</div></div>`).join('')}</div>

/* ============================================================ V8: SHAREABLE TESTS (instructor -> WhatsApp -> student -> instant score -> instructor dashboard) ============================================================
   Prototype note: there is no server. The whole test travels inside the link (#t=...), and a student's result travels back
   as a result link/code (#r=...) that the instructor opens to record it. Results taken in the same browser are saved automatically. */
const LG_TEST_KEY = 'lg-shared-tests', LG_SRES_KEY = 'lg-shared-results';
let sharedCtx = null;          // student side: { test, name, roll, showReview, result }
let pendingImport = null;      // result code waiting for an instructor to sign in
let shareDraft = { title:'', topic:'trees', n:20, mins:20, phone:'' };
let shareJustMade = null, openTestId = null, importMsg = '';
const animDone = new Set();

function b64e(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function getTests(){ return lsGet(LG_TEST_KEY, []); }
function saveTests(v){ lsSet(LG_TEST_KEY, v); }
function getSRes(){ return lsGet(LG_SRES_KEY, []); }
function saveSRes(v){ lsSet(LG_SRES_KEY, v); }
function baseUrl(){ const sv = lsGet(LG_BASE_KEY, ''); return (sv || location.href).split('#')[0]; }
function linkIssue(){
  const u = baseUrl();
  if(!/^https?:/i.test(u)) return '⚠️ This page is not on a shareable web address (it is opened from a file on this computer), so links made here only open on this device. Host the file online and paste its address below — links will then open on any phone or laptop.';
  if(/^https?:\/\/(localhost|127\.|0\.0\.0\.0|\[::1\])/i.test(u)) return '⚠️ This address (localhost) only works on this computer. Paste the public address where the file is hosted.';
  if(/^http:/i.test(u)) return '⚠️ This address is not secure (http). Links will open, but browsers block the camera on http pages, so students could not start a camera-proctored test. Use an https address.';
  return '';
}
function setPublicBase(v){ v = (v||'').trim(); if(v && !/^https?:\/\//i.test(v)) v = 'https://'+v; v = v.split('#')[0]; lsSet(LG_BASE_KEY, v); toast(v ? 'Link address saved' : 'Link address cleared'); render(); }
function renderLinkSetup(){
  const iss = linkIssue(), saved = lsGet(LG_BASE_KEY, '');
  return `<div class="panel anim-in link-setup"><div class="panel-head"><h2>🌐 Link address</h2><span class="pill ${iss?'amber':'pine'}">${iss?'Needs attention':'Ready to share'}</span></div>
    <p class="empty-note" style="margin:0 0 8px;">Links open from the address where this page is hosted. Links will use: <code style="word-break:break-all;">${esc(baseUrl())}</code></p>
    ${iss ? `<div class="proctor-warn">${iss}</div>` : ''}
    <div class="btn-row"><input id="baseBox" class="sh-input" style="flex:1;min-width:240px;" type="url" placeholder="https://your-site.netlify.app/learnguard.html" value="${esc(saved)}"><button class="btn" onclick="setPublicBase(document.getElementById('baseBox').value)">Save address</button></div>
    <p class="empty-note" style="margin:10px 0 0;">Host this one HTML file online (Netlify Drop, GitHub Pages or Vercel), paste its address above, then create your link. If a link ever fails to open, students can paste the <b>test code</b> into “Join test” on the home page.</p></div>`;
}
function testCode(t){ return b64e({ v:1, id:t.id, ti:t.title, tp:t.tp, n:t.n, m:t.m, by:t.by, be:t.be, ph:t.ph||'', sd:t.sd }); }
function copyTestCode(id){ const t=getTests().find(x=>x.id===id); if(t) copyText(testCode(t), 'Test code copied'); }
function joinByCode(raw){
  raw = (raw||'').trim(); const m = raw.match(/[#?&]t=([\w-]+)/) || raw.match(/^([\w-]{30,})$/);
  if(!m){ toast('Paste the full test link or the test code'); return; }
  try{ history.replaceState(null,'','#t='+m[1]); }catch(e){}
  handleHash('#t='+m[1]);
}
function topicName(id){ return CONCEPT_MAP[id] ? CONCEPT_MAP[id].name : id; }
function testLink(t){ return baseUrl()+'#t='+testCode(t); }
function testShareText(t){
  return '*LearnGuard AI — Test*\n📝 '+t.title+'\nTopic: '+topicName(t.tp)+' · '+t.n+' questions · '+t.m+' min\nShared by '+t.by+'\n\n👉 Tap the link to start (timed, opens in full screen):\n'+testLink(t);
}
function waUrl(text, phone){ const ph = String(phone||'').replace(/\D/g,''); return 'https://wa.me/'+ph+'?text='+encodeURIComponent(text); }
function openWa(url){ window.open(url, '_blank', 'noopener'); }
function copyText(txt, msg){
  const fallback = ()=>{ const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0;top:0;left:0;'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast(msg||'Copied'); }catch(e){ prompt('Copy this:', txt); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copied'), fallback); } else fallback();
}

/* ---------- instructor: create / share / manage ---------- */
function myTests(){ const a=currentAccount(); return a ? getTests().filter(t=>t.be===a.email).sort((x,y)=>y.at-x.at) : []; }
function createSharedTest(){
  const a = currentAccount(); if(!a || a.type!=='staff'){ toast('Sign in as an instructor first'); return; }
  const d = shareDraft;
  const n = [5,10,15,20].includes(+d.n) ? +d.n : 20;
  const m = Math.max(1, Math.min(180, Math.round(+d.mins || n)));
  const t = { id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,4), title:(d.title||'').trim() || topicName(d.topic)+' quiz', tp:d.topic, n, m, by:a.name, be:a.email, ph:String(d.phone||'').replace(/\D/g,''), sd:Math.floor(Math.random()*1e6), at:Date.now() };
  const all = getTests(); all.unshift(t); saveTests(all);
  shareJustMade = t.id; openTestId = null; render(); toast('Share link created ✓');
}
function deleteSharedTest(id){
  if(!confirm('Delete this test link and all its stored results?')) return;
  saveTests(getTests().filter(t=>t.id!==id)); saveSRes(getSRes().filter(r=>r.testId!==id));
  if(shareJustMade===id) shareJustMade=null; if(openTestId===id) openTestId=null; render();
}

function shareTestWa(id){ const t=getTests().find(x=>x.id===id); if(t) openWa(waUrl(testShareText(t))); }

function previewTest(id){ const t=getTests().find(x=>x.id===id); if(t) window.open(testLink(t), '_blank'); }
function resultsFor(testId){ return getSRes().filter(r=>r.testId===testId).sort((a,b)=>new Date(b.at)-new Date(a.at)); }
function exportResultsCsv(id){
  const t=getTests().find(x=>x.id===id); if(!t) return;
  const rows=[['Name','Roll/ID','Score','Total','Percent','Time (s)','Violations','Camera flags','Timed out','Submitted']].concat(resultsFor(id).map(r=>[r.name,r.roll||'',r.score,r.total,r.pct,r.durationSec,r.violations,r.camFlags||0,r.timedOut?'yes':'no',new Date(r.at).toLocaleString()]));
  const csv=rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=(t.title.replace(/[^\w]+/g,'_')||'results')+'.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function importResultCode(code){
  let p; try{ p = b64d(code.trim()); }catch(e){ return { ok:false, msg:'That result code could not be read.' }; }
  const t = getTests().find(x=>x.id===p.t);
  if(!t) return { ok:false, msg:'This result belongs to a test that was not created in this browser/account.' };
  const all = getSRes();
  if(all.some(r=>r.id===p.i)) return { ok:true, dup:true, testId:t.id, msg:'That result was already recorded.' };
  const total=+p.o||0, score=+p.s||0;
  all.unshift({ id:p.i, testId:t.id, name:p.n, roll:p.r||'', score, total, pct: total?Math.round(score/total*100):0, durationSec:+p.d||0, violations:+p.v||0, camFlags:+p.c||0, violEv:(p.e||[]).map(a=>({ts:a[0],q:a[1],w:a[2]})), camEvents:(p.ce||[]).map(a=>({type:a[0],at:a[1],dur:a[2]})), timedOut:!!p.x, at:new Date(+p.a||Date.now()).toISOString(), imported:true });
  saveSRes(all);
  return { ok:true, testId:t.id, msg:'Recorded '+p.n+'’s result ('+score+'/'+total+').' };
}
function doImport(){
  if(!pendingImport) return; const code = pendingImport; pendingImport = null;
  const r = importResultCode(code);
  currentRole='instructor'; instructorSection='sharetests'; if(r.testId) openTestId=r.testId; importMsg = r.msg; render(); toast(r.msg);

}
